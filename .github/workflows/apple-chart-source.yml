name: apple-spotify-chart-sources
on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-apple-ranking.mjs"
      - "scripts/refresh-apple-spotify-streams.mjs"
      - "functions/lib/apple-spotify-chart.js"
      - "functions/lib/apple-us-hybrid.js"
      - "functions/lib/tri-source-chart.js"
      - "functions/lib/chart-history.js"
      - "scripts/backfill-chart-history.mjs"
      - "public/data/chart-history/**"
      - "tests/tri-source-chart.test.mjs"
      - "tests/tri-source-worker-integration.test.mjs"
      - "scripts/resolve-tri-apple-media.mjs"
      - "functions/lib/daily-chart-sources.js"
      - ".github/workflows/apple-chart-source.yml"
  schedule:
    - cron: "45 1,5,9,13,17,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: apple-chart-source
  cancel-in-progress: false
jobs:
  fetch-apple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch paired verified Apple Music USA and Global Top 100
        run: node scripts/refresh-apple-ranking.mjs
      - name: Restore Oct 8 and Oct 9 dated Apple archives and preserve verified Spotify date
        run: node scripts/backfill-chart-history.mjs
      - name: Build union of THREE sources from the latest common source date
        run: node scripts/refresh-apple-spotify-streams.mjs
      - name: Prepare verified Apple media for Spotify-only Top 50 entrants
        run: node scripts/resolve-tri-apple-media.mjs
      - name: Validate three-source identity, weights, rank continuity and Spotify numbers
        run: node --test tests/tri-source-*.test.mjs
      - name: Commit verified chart snapshots (regenerate after competing pushes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "music98 apple chart bot"
          git config user.email "actions@users.noreply.github.com"
          for n in 1 2 3 4 5; do
            # An artwork job may have pushed fresh chart.json while we collected.
            # Rebasing generated JSON files causes conflicts, so restart from
            # the newest main and regenerate the paired edition together.
            git fetch origin main
            git reset --hard origin/main
            node scripts/refresh-apple-ranking.mjs
            node scripts/backfill-chart-history.mjs
            node scripts/refresh-apple-spotify-streams.mjs
            node scripts/resolve-tri-apple-media.mjs
            node --test tests/tri-source-*.test.mjs
            git add public/data/apple-chart.json public/data/apple-us-chart.json public/data/apple-spotify-streams.json public/data/chart-history/
            if git diff --cached --quiet; then
              echo "Current main already has matching verified sources"
              exit 0
            fi
            git commit -m "chart: matching-date Apple USA Global Spotify 40-30-30 edition"
            if git push origin HEAD:main; then
              gh workflow run apple-data.yml --ref main
              gh workflow run verify-tri-live.yml --ref main
              exit 0
            fi
            sleep 3
          done
          echo "Concurrent chart source publish conflicts exhausted"
          exit 1
