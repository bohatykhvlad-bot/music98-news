name: apple-spotify-chart-sources
on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-apple-ranking.mjs"
      - "scripts/refresh-spotify-ranking.mjs"
      - "functions/lib/spotify-chart.js"
      - "functions/lib/spotify-source.js"
      - "functions/api/spotify-source.js"
      - "worker.js"
      - "scripts/refresh-apple-spotify-streams.mjs"
      - "functions/lib/apple-spotify-chart.js"
      - "functions/lib/apple-us-hybrid.js"
      - "functions/lib/tri-source-chart.js"
      - "functions/lib/chart-history.js"
      - "functions/lib/publish-window.js"
      - "functions/lib/stream-fallback.js"
      - "tests/chart-publication-cadence.test.mjs"
      - "tests/stream-source-fallback.test.mjs"
      - "scripts/backfill-chart-history.mjs"
      - "scripts/prune-chart-history.mjs"
      - "tests/tri-source-chart.test.mjs"
      - "tests/tri-source-worker-integration.test.mjs"
      - "scripts/resolve-tri-apple-media.mjs"
      - "functions/lib/daily-chart-sources.js"
      - ".github/workflows/apple-chart-source.yml"
  schedule:
    - cron: "45 1,5,9,13,17,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: apple-chart-source
  cancel-in-progress: true
jobs:
  fetch-apple:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh Musicrank Spotify Global Top 200
        run: node scripts/refresh-spotify-ranking.mjs
      - name: Fetch paired verified Apple Music USA and Global Top 100
        run: node scripts/refresh-apple-ranking.mjs
      - name: Build union of THREE sources from the latest common source date
        run: node scripts/refresh-apple-spotify-streams.mjs
      - name: Merge verified Spotify observations if publication is blocked
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chart-measurement-recovery
          for file in public/data/chart-history/spotify-ids.json public/data/chart-history/stream-totals.json; do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/chart-measurement-recovery/$(basename "$file")"
            fi
          done
          # The dated Apple charts of this run are worth keeping even when the
          # union cannot be built: a chart of a day is only published while it
          # is the current one, so a lost archive is a lost day.
          mkdir -p /tmp/chart-apple-recovery
          for file in public/data/chart-history/apple-us-*.json public/data/chart-history/apple-global-*.json; do
            if [ -f "$file" ]; then
              cp "$file" "/tmp/chart-apple-recovery/$(basename "$file")"
            fi
          done
          git config user.name "music98 chart measurement bot"
          git config user.email "actions@users.noreply.github.com"
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          base=Path('public/data/chart-history')
          cache=Path('/tmp/chart-measurement-recovery')
          def read(path):
              try:return json.loads(path.read_text('utf-8'))
              except (FileNotFoundError,ValueError):return {}
          ids=read(base/'spotify-ids.json')
          incoming=read(cache/'spotify-ids.json')
          entries=ids.setdefault('entries',{})
          for key,value in incoming.get('entries',{}).items():
              if not isinstance(value,dict):continue
              if not isinstance(value.get('id'),str) or len(value['id'])!=22:continue
              entries.setdefault(key,value)
          (base/'spotify-ids.json').write_text(json.dumps(ids,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          totals=read(base/'stream-totals.json')
          incoming=read(cache/'stream-totals.json')
          tracks=totals.setdefault('tracks',{})
          for sid,observations in incoming.get('tracks',{}).items():
              if not isinstance(observations,list):continue
              existing=tracks.get(sid,[])
              if not isinstance(existing,list):existing=[]
              merged={}
              for item in existing+observations:
                  if not isinstance(item,dict):continue
                  provider=item.get('provider','soundcamps')
                  date=item.get('date')
                  total=item.get('total')
                  if provider not in ('soundcamps','mystreamcount') or not isinstance(date,str) or not isinstance(total,int) or total<=0:continue
                  key=(date,provider)
                  merged.setdefault(key,{'date':date,'provider':provider,'total':total})
              tracks[sid]=sorted(merged.values(),key=lambda x:(x['date'],x['provider']))[-28:]
          (base/'stream-totals.json').write_text(json.dumps(totals,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
            cp /tmp/chart-apple-recovery/*.json public/data/chart-history/ 2>/dev/null || true
            git add public/data/chart-history/
            if git diff --cached --quiet; then
              echo "Spotify observations already preserved"
              exit 0
            fi
            git commit -m "chart: retain verified observations and dated Apple charts without publishing an incomplete Top 50"
            if git push origin HEAD:main; then
              echo "Cached stream measurements safely merged"
              exit 0
            fi
            sleep 3
          done
          echo "Unable to save measurement cache after three retries" >&2
          exit 1
      - name: Prepare verified Apple media for Spotify-only Top 50 entrants
        run: node scripts/resolve-tri-apple-media.mjs
      - name: Validate three-source identity, weights, rank continuity and Spotify numbers
        run: node --test tests/tri-source-*.test.mjs tests/chart-history.test.mjs tests/chart-publication-cadence.test.mjs tests/stream-source-fallback.test.mjs
      - name: Retain only 14 days of dated source snapshots
        run: node scripts/prune-chart-history.mjs
      - name: Preserve the verified collection before any Git push
        run: |
          tar -czf /tmp/music98-chart-sources.tgz             public/data/apple-chart.json             public/data/apple-us-chart.json             public/data/apple-spotify-streams.json             public/data/chart-history
      - name: Upload verified source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: chart-sources-${{ github.run_id }}
          path: |
            public/data/apple-chart.json
            public/data/apple-us-chart.json
            public/data/apple-spotify-streams.json
            public/data/chart-history/
          retention-days: 14
          if-no-files-found: error
      - name: Commit verified snapshots without recollecting on push conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "music98 apple chart bot"
          git config user.email "actions@users.noreply.github.com"
          BASE="$GITHUB_SHA"
          SOURCES=(
            scripts/refresh-spotify-ranking.mjs
            scripts/refresh-apple-ranking.mjs
            scripts/refresh-apple-spotify-streams.mjs
            functions/lib/apple-spotify-chart.js
            functions/lib/apple-us-hybrid.js
            functions/lib/tri-source-chart.js
            functions/lib/chart-history.js
            functions/lib/publish-window.js
            functions/lib/stream-fallback.js
          )
          publish() {
            git add -A public/data/apple-chart.json public/data/apple-us-chart.json public/data/apple-spotify-streams.json public/data/chart-history/
            if git diff --cached --quiet; then
              echo "Current main already has matching verified sources"
              return 2
            fi
            git commit -m "chart: matching-date Apple USA Global Spotify 40-30-30 edition"
            git push origin HEAD:main
          }
          for n in 1 2 3 4 5; do
            if publish; then
              gh workflow run apple-data.yml --ref main
              gh workflow run verify-tri-live.yml --ref main
              gh workflow run chart-browser-smoke.yml --ref main
              exit 0
            else
              code=$?
              if [ "$code" -eq 2 ]; then exit 0; fi
            fi
            echo "Concurrent main update; reapplying the already verified snapshot ($n/5)"
            git fetch origin main
            if ! git diff --quiet "$BASE" origin/main -- "${SOURCES[@]}"; then
              echo "Chart source code changed during this run; discard stale output. New code has its own run."
              exit 0
            fi
            git reset --hard origin/main
            tar -xzf /tmp/music98-chart-sources.tgz
            sleep 4
          done
          echo "Could not publish the verified chart snapshot after five retries" >&2
          exit 1
