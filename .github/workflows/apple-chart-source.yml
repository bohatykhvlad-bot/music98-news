name: apple-spotify-chart-sources
on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-apple-ranking.mjs"
      - "scripts/refresh-apple-spotify-streams.mjs"
      - "functions/lib/apple-spotify-chart.js"
      - "functions/lib/apple-us-hybrid.js"
      - "functions/lib/daily-chart-sources.js"
      - ".github/workflows/apple-chart-source.yml"
  schedule:
    - cron: "45 1,5,9,13,17,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: apple-chart-source
  cancel-in-progress: false
jobs:
  fetch-apple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch paired verified Apple Music USA and Global Top 100
        run: node scripts/refresh-apple-ranking.mjs
      - name: Collect multi-path Spotify daily streams for USA Top 50 candidates
        run: node scripts/refresh-apple-spotify-streams.mjs
      - name: Commit only complete current-day snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "music98 apple chart bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/apple-chart.json public/data/apple-us-chart.json public/data/apple-spotify-streams.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chart: Apple USA 70 Spotify 20 Global 10 verified daily sources"
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              # Bot pushes do not trigger downstream push workflows.
              gh workflow run apple-data.yml --ref main
              exit 0
            fi
            sleep 3
          done
          exit 1
