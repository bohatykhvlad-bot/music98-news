name: apple-chart-source
on:
  push:
    paths:
      - "scripts/refresh-apple-ranking.mjs"
      - ".github/workflows/apple-chart-source.yml"
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apple-chart-source
  cancel-in-progress: false
jobs:
  fetch-apple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch verified same-day Apple Top 50
        run: node scripts/refresh-apple-ranking.mjs
      - name: Commit only complete current-day snapshot
        run: |
          git config user.name "music98 apple chart bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/apple-chart.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chart: verified same-day Apple ranking"
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
