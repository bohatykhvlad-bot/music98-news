name: apple-data

# Обложки и написание (title/artist) из Apple для текущего чарта.
# iTunes API из Cloudflare отвечает через раз, поэтому оба файла собираются здесь -
# с обычного IP Apple отвечает всегда. Воркер читает их и запоминает по песне,
# так что на сайте ничего не меняется день ото дня.
#
#   public/data/covers.json      ключ -> обложка Apple
#   public/data/apple-names.json ключ -> {title, artist} из Apple
#
# Это же снимает проблему "w/"-написания: имя всегда эпловское.

on:
  # Re-run immediately when the resolver itself changes; ordinary site/content
  # pushes still do not invoke the live chart Worker.
  push:
    branches: [main]
    paths:
      - "scripts/build-covers.mjs"
      - "scripts/chart-artwork-regression.mjs"
      - "functions/lib/chart-identity.js"
      - "public/data/cover-corrections.json"
  schedule:
    # раз в сутки, утром после смены чартового дня (09:20 по Киеву): свежий чарт
    # получает эпловские имена, ссылки, превью и обложки тем же утром
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Проверить live tenure
        run: node scripts/audit-live-chart.mjs
      - name: Проверить original/remix matcher
        run: node scripts/chart-artwork-regression.mjs
      - name: Собрать cover registry и Apple metadata
        run: |
          cp public/data/covers.json /tmp/covers-before.json
          if [ "${{ github.event_name }}" = "schedule" ]; then
            export REVALIDATE_EXISTING=0
          else
            export REVALIDATE_EXISTING=1
          fi
          node scripts/build-covers.mjs
          node - <<'NODE'
          const fs = require("fs");
          const before = JSON.parse(fs.readFileSync("/tmp/covers-before.json","utf8"));
          const after = JSON.parse(fs.readFileSync("public/data/covers.json","utf8"));
          const names = JSON.parse(fs.readFileSync("public/data/apple-names.json","utf8"));
          const meta = JSON.parse(fs.readFileSync("public/data/apple-cover-meta.json","utf8"));
          const corrections = JSON.parse(fs.readFileSync("public/data/cover-corrections.json","utf8"));
          const appleArt = (u) => {
            try {
              const h = new URL(String(u || "")).hostname.toLowerCase();
              return h === "mzstatic.com" || h.endsWith(".mzstatic.com");
            } catch { return false; }
          };
          let changed = 0;
          for (const [key, url] of Object.entries(after)) {
            if (!appleArt(url)) throw new Error("non-Apple cover in registry: " + key);
            if (before[key] === url) continue;
            changed++;
            if (corrections[key]?.art === url) {
              console.log("approved editorial cover correction:", key);
              continue;
            }
            const rec = names[key];
            const proof = meta[key];
            if (!rec?.url || !rec?.title || !rec?.artist) {
              throw new Error("revalidated cover has no matching Apple identity: " + key);
            }
            if (!proof || proof.source !== "resolver" || proof.resolverVersion !== 3 ||
                proof.art !== url || !proof.trackId || !proof.collectionId) {
              throw new Error("revalidated cover has no current canonical resolver proof: " + key);
            }
            console.log("verified Apple cover refresh:", key, "->", rec.url, proof.collectionName);
          }
          console.log("cover registry safety: PASS", changed, "verified changes");
          NODE
      - name: Закоммитить, если изменилось
        run: |
          git config user.name "music98 apple-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/covers.json public/data/apple-names.json public/data/apple-cover-meta.json public/data/cover-corrections.json public/data/top50.json public/index.html
          if git diff --cached --quiet; then
            echo "данные Apple без изменений"
            exit 0
          fi
          git commit -m "apple: ежедневное обновление обложек и написаний"
          git push || {
            echo "main успел измениться — ребейзим сгенерированные данные и повторяем push"
            git pull --rebase origin main
            git push
          }
