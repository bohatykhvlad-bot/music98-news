name: apple-data

# Обложки и написание (title/artist) из Apple для текущего чарта.
# iTunes API из Cloudflare отвечает через раз, поэтому оба файла собираются здесь -
# с обычного IP Apple отвечает всегда. Воркер читает их и запоминает по песне,
# так что на сайте ничего не меняется день ото дня.
#
#   public/data/covers.json      ключ -> обложка Apple
#   public/data/apple-names.json ключ -> {title, artist} из Apple
#
# Это же снимает проблему "w/"-написания: имя всегда эпловское.

on:
  push:
    paths:
      - "functions/lib/chart-identity.js"
      - "scripts/build-covers.mjs"
      - "scripts/build-loudness.mjs"
      - "public/data/cover-corrections.json"
  # Artwork code changes may refresh artwork immediately, but must never rebuild
  # or reorder the Top 50 itself. The
  # committed registry already ships the correction; refresh happens once a day
  # or when an editor explicitly runs this workflow.
  schedule:
    # раз в сутки, утром после смены чартового дня (09:20 по Киеву): свежий чарт
    # получает эпловские имена, ссылки, превью и обложки тем же утром
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Зафиксировать ranking-файлы до artwork audit
        run: |
          cp public/data/top50.json /tmp/top50-before.json
          cp public/index.html /tmp/index-before.html
      - name: Проверить live tenure
        run: node scripts/audit-live-chart.mjs
      - name: Проверить original/remix matcher
        run: node scripts/chart-artwork-regression.mjs
      - name: Собрать cover registry и Apple metadata
        run: |
          cp public/data/covers.json /tmp/covers-before.json
          node scripts/build-covers.mjs
          node - <<'NODE'
          const fs = require("fs");
          const before = JSON.parse(fs.readFileSync("/tmp/covers-before.json","utf8"));
          const after = JSON.parse(fs.readFileSync("public/data/covers.json","utf8"));
          const corrections = JSON.parse(fs.readFileSync("public/data/cover-corrections.json","utf8"));
          for (const [key, url] of Object.entries(after)) {
            if (!/^https:\/\/[^/]*mzstatic\.com\//i.test(String(url || ""))) {
              throw new Error("non-Apple artwork in cover registry: " + key);
            }
          }
          const changed = Object.keys(after).filter(k => before[k] && before[k] !== after[k]);
          console.log("cover registry updates:", changed.length, "existing rows corrected only by explicit pins/corrections");
          NODE
          cmp -s public/data/top50.json /tmp/top50-before.json || {
            echo "ERROR: artwork audit modified Top 50 ranking data"
            exit 1
          }
          cmp -s public/index.html /tmp/index-before.html || {
            echo "ERROR: artwork audit modified embedded Top 50/site markup"
            exit 1
          }
      - name: Измерить громкость Apple previews
        run: |
          ffmpeg -version | head -n 1
          node scripts/build-loudness.mjs
      - name: Закоммитить, если изменилось
        run: |
          git config user.name "music98 apple-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/covers.json public/data/apple-names.json public/data/cover-corrections.json public/data/loudness.json
          if git diff --cached --quiet; then
            echo "данные Apple без изменений"
            exit 0
          fi
          git commit -m "apple/audio: обновление обложек, metadata и loudness"
          git push || {
            echo "main успел измениться — ребейзим сгенерированные данные и повторяем push"
            git pull --rebase origin main
            git push
          }
