name: apple-data

# Обложки и написание (title/artist) из Apple для текущего чарта.
# Spotify source publisher dispatches this workflow explicitly after a successful
# GITHUB_TOKEN push: such pushes do not themselves fire dependent push workflows.
# iTunes API из Cloudflare отвечает через раз, поэтому оба файла собираются здесь -
# с обычного IP Apple отвечает всегда. Воркер читает их и запоминает по песне,
# так что на сайте ничего не меняется день ото дня.
#
#   public/data/covers.json      ключ -> обложка Apple
#   public/data/apple-names.json ключ -> {title, artist} из Apple
#
# Это же снимает проблему "w/"-написания: имя всегда эпловское.

on:
  push:
    branches: [main]
    paths:
      - "functions/api/top50.js"
      - "functions/lib/daily-chart-sources.js"
      - "public/data/spotify-chart.json"
      - "public/data/apple-chart.json"
      - "public/data/deezer-chart.json"
      - "scripts/snapshot-live-chart.mjs"
      - "scripts/audit-live-chart.mjs"
      - ".github/workflows/apple-data.yml"
      - "functions/lib/chart-identity.js"
      - "functions/lib/artwork-resolver.js"
      - "scripts/build-covers.mjs"
      - "scripts/build-loudness.mjs"
      - "public/data/cover-corrections.json"
  # Artwork code changes may refresh artwork immediately, but must never rebuild
  # or reorder the Top 50 itself. The
  # committed registry already ships the correction; refresh happens once a day
  # or when an editor explicitly runs this workflow.
  schedule:
    # раз в сутки, утром после смены чартового дня (09:20 по Киеву): свежий чарт
    # получает эпловские имена, ссылки, превью и обложки тем же утром
    - cron: "20 6 * * *"
  workflow_dispatch:

concurrency:
  group: apple-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Зафиксировать ranking-файлы до artwork audit
        run: |
          cp public/data/top50.json /tmp/top50-before.json
          cp public/index.html /tmp/index-before.html
      - name: Проверить resolver до сетевого аудита
        run: node scripts/chart-artwork-regression.mjs
      - name: Собрать и перепроверить artwork registry
        run: |
          cp public/data/covers.json /tmp/covers-before.json
          node scripts/build-covers.mjs
          node scripts/chart-artwork-regression.mjs
          node - <<'NODE'
          const fs = require("fs");
          const before = JSON.parse(fs.readFileSync("/tmp/covers-before.json","utf8"));
          const after = JSON.parse(fs.readFileSync("public/data/covers.json","utf8"));
          const corrections = JSON.parse(fs.readFileSync("public/data/cover-corrections.json","utf8"));
          for (const [key, url] of Object.entries(after)) {
            if (!/^https:\/\/(?:[^/]*mzstatic\.com|[^/]*dzcdn\.net)\//i.test(String(url || ""))) {
              throw new Error("untrusted artwork in cover registry: " + key);
            }
          }
          const changed = Object.keys(after).filter(k => before[k] && before[k] !== after[k]);
          const audit = JSON.parse(fs.readFileSync("public/data/artwork-audit.json","utf8"));
          const unresolved = Array.isArray(audit.unresolved) ? audit.unresolved : [];
          const verified = Object.keys(audit.entries||{}).length;
          if (audit.schema !== 2 || audit.rows !== 50 || verified + unresolved.length !== audit.rows) {
            throw new Error("artwork audit accounting is incomplete");
          }
          if (unresolved.length) {
            throw new Error("BLOCKED: cannot deploy an incomplete artwork registry: " + unresolved.map(x=>x.artist+" - "+x.title).join("; "));
          }
          console.log("cover registry updates:", changed.length, "verified rows:", verified, "unresolved rows:", unresolved.length);
          NODE
          cmp -s public/data/top50.json /tmp/top50-before.json || {
            echo "ERROR: artwork audit modified Top 50 ranking data"
            exit 1
          }
          cmp -s public/index.html /tmp/index-before.html || {
            echo "ERROR: artwork audit modified embedded Top 50/site markup"
            exit 1
          }
      - name: Установить ffmpeg для loudness audit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Измерить громкость Apple previews
        run: node scripts/build-loudness.mjs
      - name: Закоммитить, если изменилось
        run: |
          git config user.name "music98 apple-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/covers.json public/data/artwork-audit.json public/data/apple-names.json public/data/cover-corrections.json public/data/loudness.json
          if git diff --cached --quiet; then
            echo "данные Apple без изменений"
            exit 0
          fi
          git commit -m "artwork/audio: verified provider audit"
          if git push origin HEAD:main; then
            echo "Проверенные обложки сохранены"
          else
            # Another workflow may have committed new snapshots meanwhile.
            # Rebasing generated JSON causes merge conflicts. Regenerate from
            # current main instead, so no older audit can overwrite newer data.
            pushed=0
            for attempt in 1 2 3; do
              echo "Artwork push conflicted; refreshing main and re-auditing (attempt $attempt/3)"
              git fetch origin main
              git reset --hard origin/main
              node scripts/build-covers.mjs
              node scripts/chart-artwork-regression.mjs
              node scripts/build-loudness.mjs
              git add public/data/covers.json public/data/artwork-audit.json public/data/apple-names.json public/data/cover-corrections.json public/data/loudness.json
              if git diff --cached --quiet; then
                echo "Current main already has the latest verified registry"
                pushed=1
                break
              fi
              git commit -m "artwork/audio: verified provider audit (rebuilt after race)"
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to publish the regenerated verified artwork registry"
              exit 1
            fi
          fi

      - name: Дождаться точного совпадения всех 50 live обложек с проверенным реестром
        run: node scripts/verify-live-artwork.mjs
      # Repair media before the source-version audit: a slow Worker deployment
      # must not skip cover recovery for the chart already visible to visitors.
      - name: Проверить live tenure после восстановления обложек
        run: node scripts/audit-live-chart.mjs
      - name: Сохранить здоровый tenure snapshot
        run: |
          node scripts/snapshot-live-chart.mjs
          if git diff --quiet -- public/data/chart-tenure-backup.json public/data/daily-top50-backup.json; then
            echo "tenure snapshot без изменений"
          else
            git config user.name "music98 chart tenure bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data/chart-tenure-backup.json public/data/daily-top50-backup.json
            git commit -m "chart: snapshot healthy live tenure"
            if ! git push origin HEAD:main; then
              published=0
              for attempt in 1 2 3; do
                echo "Tenure snapshot push conflicted; refreshing main (attempt $attempt/3)"
                git fetch origin main
                git reset --hard origin/main
                node scripts/snapshot-live-chart.mjs
                if git diff --quiet -- public/data/chart-tenure-backup.json public/data/daily-top50-backup.json; then
                  echo "Newest main already contains the verified snapshot"
                  published=1
                  break
                fi
                git add public/data/chart-tenure-backup.json public/data/daily-top50-backup.json
                git commit -m "chart: snapshot healthy live tenure (rebuilt after race)"
                if git push origin HEAD:main; then
                  published=1
                  break
                fi
              done
              if [ "$published" -ne 1 ]; then
                echo "::error::Failed to publish healthy snapshot after concurrent updates"
                exit 1
              fi
            fi
          fi
