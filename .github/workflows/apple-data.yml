name: apple-data

# Обложки и написание (title/artist) из Apple для текущего чарта.
# iTunes API из Cloudflare отвечает через раз, поэтому оба файла собираются здесь -
# с обычного IP Apple отвечает всегда. Воркер читает их и запоминает по песне,
# так что на сайте ничего не меняется день ото дня.
#
#   public/data/covers.json      ключ -> обложка Apple
#   public/data/apple-names.json ключ -> {title, artist} из Apple
#
# Это же снимает проблему "w/"-написания: имя всегда эпловское.

on:
  push:
    paths:
      - "functions/lib/chart-identity.js"
      - "functions/api/top50.js"
      - "scripts/build-covers.mjs"
      - "scripts/chart-artwork-regression.mjs"
      - ".github/workflows/apple-data.yml"
  schedule:
    # раз в сутки, утром после смены чартового дня (09:20 по Киеву): свежий чарт
    # получает эпловские имена, ссылки, превью и обложки тем же утром
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Диагностика live artwork
        run: |
          node - <<'NODE'
          const urls = [
            "https://music98.news/api/top50?diag=" + Date.now(),
            "https://itunes.apple.com/lookup?id=1842957386&entity=song&country=US",
            "https://itunes.apple.com/search?term=" + encodeURIComponent("Tame Impala Loser") + "&entity=song&limit=25&country=US",
            "https://music.apple.com/us/album/loser-single/1842957385"
          ];
          for (const u of urls) {
            try {
              const r = await fetch(u, {headers:{"user-agent":"Mozilla/5.0"}});
              const t = await r.text();
              if (u.includes("music98.news")) {
                const j=JSON.parse(t);
                const row=(j.tracks||[]).find(x=>x.title==="Loser" && /Tame Impala/i.test(x.artist||""));
                console.log("LIVE_LOSER", JSON.stringify(row));
              } else if (u.includes("lookup?")) {
                const j=JSON.parse(t);
                console.log("LOOKUP_LOSER", JSON.stringify((j.results||[]).map(x=>({trackId:x.trackId,trackName:x.trackName,collectionName:x.collectionName,artistName:x.artistName,art:x.artworkUrl100,releaseDate:x.releaseDate}))));
              } else if (u.includes("search?")) {
                const j=JSON.parse(t);
                console.log("SEARCH_LOSER", JSON.stringify((j.results||[]).filter(x=>/loser/i.test(x.trackName||"")).map(x=>({trackId:x.trackId,trackName:x.trackName,collectionName:x.collectionName,artistName:x.artistName,art:x.artworkUrl100,releaseDate:x.releaseDate}))));
              } else {
                const m=t.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)/i) || t.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
                console.log("APPLE_PAGE_OG", m&&m[1]);
              }
            } catch(e) { console.log("DIAG_ERR", u, String(e)); }
          }
          NODE
      - name: Проверить original/remix matcher
        run: node scripts/chart-artwork-regression.mjs
      - name: Собрать Apple-обложки и Apple-написания
        run: node scripts/build-covers.mjs
      - name: Закоммитить, если изменилось
        run: |
          git config user.name "music98 apple-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/covers.json public/data/apple-names.json
          if git diff --cached --quiet; then
            echo "данные Apple без изменений"
            exit 0
          fi
          git commit -m "apple: ежедневное обновление обложек и написаний"
          git push || {
            echo "main успел измениться — ребейзим сгенерированные данные и повторяем push"
            git pull --rebase origin main
            git push
          }
