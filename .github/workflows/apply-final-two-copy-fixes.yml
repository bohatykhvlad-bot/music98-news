name: Apply final two copy fixes
on:
  push:
    branches: [main]
    paths:
      - scripts/final_two_copy_fixes.py
      - .github/workflows/apply-final-two-copy-fixes.yml
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact copy fixes
        run: python scripts/final_two_copy_fixes.py
      - name: Export exact live copies
        shell: bash
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          node <<'NODE'
          const fs=require("fs");
          const ids=["shakira26amazonmadrid","auvictoriafol26r1"];
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Accept":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const r=await fetch("https://music98.news/api/desk?finalaudit="+Date.now(),{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            const d=await r.json();
            const posts=ids.map(id=>d.posts.find(p=>p.id===id));
            fs.writeFileSync("/tmp/live.json",JSON.stringify({posts},null,2));
            const staged=JSON.parse(JSON.stringify({posts}));
            staged.posts.forEach(p=>p.status="draft");
            fs.writeFileSync("/tmp/staged.json",JSON.stringify(staged,null,2));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Editorial readthrough
        shell: bash
        run: |
          python scripts/editorial_readthrough.py --post shakira26amazonmadrid --file /tmp/live.json --confirm-full-read
          python scripts/editorial_readthrough.py --post auvictoriafol26r1 --file /tmp/live.json --confirm-full-read
      - name: Gate exact live bodies
        shell: python
        run: |
          import importlib.util,json,sys
          spec=importlib.util.spec_from_file_location("gate","scripts/gate.py")
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g);g.CHECK_IDS=False
          data=json.load(open("/tmp/live.json",encoding="utf-8"))
          bad=False
          for p in data["posts"]:
              fails,warns,info=g.check_post(p,strict=True)
              print("POST",p["id"])
              for k,v in info:
                  if k in ("length","dates","numbers"): print("INFO",k,v)
              for k,v in warns: print("WARN",k,v)
              for k,v in fails: print("FAIL",k,v)
              print("GATE","PASS" if not fails else "FAIL")
              bad=bad or bool(fails)
          if bad: sys.exit(1)
      - name: Preflight exact bodies
        shell: bash
        run: |
          python scripts/preflight.py --post shakira26amazonmadrid --file /tmp/staged.json --expected-media 1 --min-words 300
          python scripts/preflight.py --post auvictoriafol26r1 --file /tmp/staged.json --expected-media 1 --min-words 450
      - name: Verify public state
        shell: bash
        run: |
          python scripts/post.py verify shakira26amazonmadrid
          python scripts/post.py verify auvictoriafol26r1
