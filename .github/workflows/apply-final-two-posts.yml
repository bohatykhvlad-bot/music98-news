name: Apply final reviewed Shakira and Victoria rewrites
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-final-two-posts.yml
      - .github/final-two-posts-rewrite.json
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-run mandatory checks on exact payload
        shell: bash
        run: |
          set -euo pipefail
          python scripts/editorial_readthrough.py --post shakira26amazonmadrid --file .github/final-two-posts-rewrite.json --confirm-full-read
          python scripts/editorial_readthrough.py --post auvictoriafol26r1 --file .github/final-two-posts-rewrite.json --confirm-full-read
          python scripts/preflight.py --post shakira26amazonmadrid --file .github/final-two-posts-rewrite.json --expected-media 1 --min-words 300
          python scripts/preflight.py --post auvictoriafol26r1 --file .github/final-two-posts-rewrite.json --expected-media 1 --min-words 450
      - name: Apply body and excerpt only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const payload=JSON.parse(fs.readFileSync(".github/final-two-posts-rewrite.json","utf8"));
          const ids=payload.posts.map(p=>p.id);
          const byId=Object.fromEntries(payload.posts.map(p=>[p.id,p]));
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Content-Type":"application/json","Accept":"application/json","Cache-Control":"no-cache"};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(n){
            const r=await fetch("https://music98.news/api/desk?finalrewrite="+Date.now()+"_"+n,{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            return r.json();
          }
          (async()=>{
            const d=await get(0);
            const others=JSON.stringify(d.posts.filter(p=>!ids.includes(p.id)));
            const meta={};
            for(const id of ids){
              const p=d.posts.find(x=>x.id===id);
              if(!p||p.status!=="live") throw Error("TARGET_NOT_LIVE_"+id);
              meta[id]=JSON.stringify(Object.fromEntries(Object.entries(p).filter(([k])=>!["body","excerpt"].includes(k))));
              p.body=byId[id].body;
              p.excerpt=byId[id].excerpt;
            }
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers:h,body:JSON.stringify({posts:d.posts,touched:ids})});
            if(!s.ok) throw Error("SAVE_"+s.status);
            for(let i=1;i<=20;i++){
              await sleep(2000);
              const a=await get(i);
              const ok=ids.every(id=>{
                const p=a.posts.find(x=>x.id===id);
                return p&&p.body===byId[id].body&&p.excerpt===byId[id].excerpt;
              });
              if(!ok) continue;
              if(JSON.stringify(a.posts.filter(p=>!ids.includes(p.id)))!==others) throw Error("OTHER_POST_CHANGED");
              for(const id of ids){
                const p=a.posts.find(x=>x.id===id);
                const m=JSON.stringify(Object.fromEntries(Object.entries(p).filter(([k])=>!["body","excerpt"].includes(k))));
                if(m!==meta[id]) throw Error("METADATA_CHANGED_"+id);
              }
              console.log("FINAL_REWRITES_APPLIED");
              return;
            }
            throw Error("KV_VERIFY_TIMEOUT");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Verify exact live bodies after propagation
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          python scripts/editorial_readthrough.py --post shakira26amazonmadrid --confirm-full-read
          python scripts/editorial_readthrough.py --post auvictoriafol26r1 --confirm-full-read
          python scripts/post.py gate shakira26amazonmadrid
          python scripts/post.py gate auvictoriafol26r1
          python scripts/post.py verify shakira26amazonmadrid
          python scripts/post.py verify auvictoriafol26r1
