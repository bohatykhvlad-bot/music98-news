name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate editorial workflow scripts and canon
        run: |
          python -m py_compile scripts/editorial_readthrough.py scripts/post.py scripts/preflight.py scripts/test_editorial_readthrough.py scripts/check_agent_write_path.py
          python scripts/check_agent_write_path.py
          python scripts/editorial_readthrough.py --help | grep -q -- "--phase"
          python scripts/post.py --help | grep -q -- "--phase"
          python scripts/post.py --help | grep -q -- "create"
          python scripts/post.py --help | grep -q -- "preflight"
          python scripts/test_editorial_readthrough.py
          test "$(wc -l < music98-agent-operating-canon.md)" -le 280
          grep -qi "HUMAN QUALITY BARRIER" music98-agent-operating-canon.md
          grep -qi "ENDINGS" music98-agent-operating-canon.md
          for f in AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md; do
            grep -q "music98-agent-operating-canon.md" "$f"
          done
          python - <<'PY'
          import ast
          from pathlib import Path
          tree=ast.parse(Path("scripts/gate.py").read_text(encoding="utf-8"))
          for node in ast.walk(tree):
              if isinstance(node,ast.Assign) and any(isinstance(t,ast.Name) and t.id=="VERIFIED_DATES" for t in node.targets):
                  keys=[k.value for k in node.value.keys if isinstance(k,ast.Constant) and isinstance(k.value,str)]
                  assert len(keys)==len(set(keys)), "duplicate VERIFIED_DATES keys"
                  break
          else:
              raise AssertionError("VERIFIED_DATES registry missing")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  verify-spotify-live:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independently fetch, parse and compare live Spotify Top 50
        run: node scripts/refresh-spotify-ranking.mjs
      - name: Validate generated source fingerprint and all ranked rows
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import {verifiedSpotifySnapshot} from "./functions/lib/spotify-chart.js"; const j=JSON.parse(fs.readFileSync("public/data/spotify-chart.json","utf8")); const v=verifiedSpotifySnapshot(j); if(!v || v.tracks.length!==100)process.exit(1); console.log("VERIFIED_LIVE_SOURCE",j.chartDate,j.provider,j.mirrorMatched,j.fingerprint);'

  verify-daily-global-live:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read official global daily song rankings
        run: |
          node scripts/refresh-apple-ranking.mjs
          node scripts/refresh-deezer-ranking.mjs
          node scripts/refresh-spotify-ranking.mjs
      - name: Check live Top 100 overlap across all three platforms
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {mergeKey} from "./functions/lib/chart-identity.js";
          const sources=["apple-chart.json","spotify-chart.json","deezer-chart.json"].map(f=>
            JSON.parse(fs.readFileSync("public/data/"+f,"utf8")));
          const [a,s,d]=sources.map(x=>new Set(x.tracks.map(t=>mergeKey(t.title,t.artist))));
          const triple=[...a].filter(k=>s.has(k)&&d.has(k));
          const pairs=[...new Set([...a,...s,...d])].filter(k=>[a,s,d].filter(set=>set.has(k)).length===2);
          console.log("FULL_TOP100_INTERSECTION",JSON.stringify({
            dates:sources.map(x=>x.chartDate||x.sourceDate),
            sourceLengths:sources.map(x=>x.tracks.length),
            triple:triple.length,double:pairs.length,
            triplePreview:triple.slice(0,12)
          }));
          // Provide all 300 source rows for a reviewed identity/edition mismatch audit.
          console.log("FULL_TOP100_ROWS",JSON.stringify(sources.map((v,i)=>({
            source:["A","S","D"][i],date:v.chartDate||v.sourceDate,
            tracks:v.tracks.map(t=>[t.pos,t.title,t.artist])
          }))));
          NODE
      - name: Compare the original Deezer chart endpoint with the curated playlist
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {mergeKey} from "./functions/lib/chart-identity.js";
          const a=JSON.parse(fs.readFileSync("public/data/apple-chart.json","utf8"));
          const s=JSON.parse(fs.readFileSync("public/data/spotify-chart.json","utf8"));
          const apple=new Set(a.tracks.map(x=>mergeKey(x.title,x.artist)));
          const spotify=new Set(s.tracks.map(x=>mergeKey(x.title,x.artist)));
          for(const limit of [100,200]){
            try{
              const url="https://api.deezer.com/chart/0/tracks?limit="+limit;
              const res=await fetch(url,{headers:{"user-agent":"Mozilla/5.0"},
                signal:AbortSignal.timeout(14000)});
              if(!res.ok)throw Error("HTTP "+res.status);
              const j=await res.json();
              if(j.error)throw Error(JSON.stringify(j.error));
              const tracks=(j.data||[]).map((x,i)=>({
                pos:x.position||i+1,title:x.title_short||x.title,artist:x.artist?.name||""
              }));
              const triple=tracks.filter(x=>apple.has(mergeKey(x.title,x.artist)) &&
                spotify.has(mergeKey(x.title,x.artist)));
              const pairA=tracks.filter(x=>apple.has(mergeKey(x.title,x.artist))).length;
              const pairS=tracks.filter(x=>spotify.has(mergeKey(x.title,x.artist))).length;
              console.log("ORIGINAL_DEEZER_CHART_COMPARISON",JSON.stringify({
                requested:limit,count:tracks.length,total:j.total,next:!!j.next,
                appleOverlap:pairA,spotifyOverlap:pairS,triple:triple.length,
                triplePreview:triple.slice(0,15),firstFive:tracks.slice(0,5)
              }));
            }catch(e){console.log("ORIGINAL_DEEZER_CHART_UNAVAILABLE",limit,String(e));}
          }
          NODE
      - name: Build a daily edition using isolated in-memory history
        run: |
          node scripts/build-daily-chart-preview.mjs /tmp/daily-top50.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-global-source-snapshots
          path: |
            public/data/apple-chart.json
            public/data/deezer-chart.json
            public/data/spotify-chart.json
            /tmp/daily-top50.json
