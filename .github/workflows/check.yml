name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: One-time strict Popular rebuild and production verification
        shell: bash
        run: |
          set -euo pipefail
          base="https://music98.news/api/__m98-popular-strict-rebuild-72df1c"

          reset=""
          for i in $(seq 1 12); do
            if reset="$(curl -fsS --max-time 60 "$base?task=popular&reset=1")"; then
              echo "$reset"
              break
            fi
            sleep 5
          done
          test -n "$reset"

          complete="$(BODY="$reset" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(str(bool(d.get("complete"))).lower())')"
          artists="$(BODY="$reset" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(int(d.get("artists") or 0))')"
          found="$(BODY="$reset" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(int(d.get("found") or 0))')"
          echo "popular reset complete=$complete artists=$artists found=$found"

          for i in $(seq 1 12); do
            if [ "$complete" = "true" ] && [ "$artists" -ge 30 ]; then
              break
            fi
            body="$(curl -fsS --max-time 60 "$base?task=popular")"
            echo "$body"
            complete="$(BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(str(bool(d.get("complete"))).lower())')"
            artists="$(BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(int(d.get("artists") or 0))')"
            found="$(BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(int(d.get("found") or 0))')"
            echo "popular step=$i complete=$complete artists=$artists found=$found"
            sleep 1
          done
          test "$complete" = "true"
          test "$artists" -ge 30

          tour_complete="false"
          for i in $(seq 1 10); do
            body="$(curl -fsS --max-time 90 "$base?task=tours")"
            echo "$body"
            tour_complete="$(BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(str(bool(d.get("complete"))).lower())')"
            idx="$(BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(int(d.get("index") or 0))')"
            total="$(BODY="$body" python -c 'import json,os; d=json.loads(os.environ["BODY"]); print(int(d.get("total") or 0))')"
            echo "tours step=$i complete=$tour_complete index=$idx total=$total"
            if [ "$tour_complete" = "true" ]; then
              break
            fi
            sleep 1
          done
          test "$tour_complete" = "true"

          curl -fsS --max-time 30 'https://music98.news/api/concerts?mode=popular&v=popular-v6&verify=strict-final' > /tmp/popular.json
          python -c 'import json; d=json.load(open("/tmp/popular.json")); a=d.get("artists") or []; assert d.get("version")=="popular-v4", d; assert d.get("eligibility")=="ticketmaster_event_payload_gt_0", d; assert len(a)==30, len(a); assert all(x.get("eventConfirmed") is True and int(x.get("shows") or 0)>0 for x in a), a; print("verified_strict_popular=",len(a))'

          python -c 'import json; d=json.load(open("/tmp/popular.json")); [print(x["id"]) for x in d["artists"]]' > /tmp/artist_ids
          verified=0
          while IFS= read -r id; do
            curl -fsS --max-time 45 -G --data-urlencode "attractionId=$id" --data-urlencode "verify=strict-final" 'https://music98.news/api/concerts' > /tmp/tour.json
            count="$(python -c 'import json; d=json.load(open("/tmp/tour.json")); print(len(d.get("events") or []))')"
            if [ "$count" -lt 1 ]; then
              echo "artist $id returned zero real events"
              cat /tmp/tour.json
              exit 1
            fi
            verified=$((verified+1))
          done < /tmp/artist_ids
          test "$verified" -eq 30
          echo "verified_artist_event_lists=$verified"

          curl -fsS --max-time 30 'https://music98.news/concerts-app.js?v=20260929-28' > /tmp/concerts-app.js
          grep -q 'music98:concert-popular:v6' /tmp/concerts-app.js
          grep -q 'ticketmaster_event_payload_gt_0' /tmp/concerts-app.js
          grep -q '.buy.press .buy-label{font-size:12px}' /tmp/concerts-app.js
          if grep -q '.buy.press .buy-label{transform:' /tmp/concerts-app.js; then
            echo "Buy Tickets text is still transform-scaled"
            exit 1
          fi

          headers="$(curl -fsSI --max-time 30 'https://music98.news/concerts-app.js?v=20260929-28')"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | tr -d '\r' | grep -qi '^cache-control:.*no-store'
      - run: npm run check
