name: concert live smoke

on:
  push:
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "functions/api/concerts.js"
      - "public/concerts-app.js"
      - "public/index.html"
      - ".github/workflows/concert-live-smoke.yml"

permissions:
  contents: read

jobs:
  popular-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed Popular event-confirmed ranking contract
        run: |
          python - <<'PY'
          import json, time, urllib.request

          url="https://music98.news/api/concerts?mode=popular&v=popular-v13&contractcheck="+str(int(time.time()*1000))
          req=urllib.request.Request(url,headers={
              "User-Agent":"music98-popular-contract/1.0",
              "Cache-Control":"no-cache",
              "Pragma":"no-cache",
              "Accept":"application/json",
          })
          with urllib.request.urlopen(req,timeout=25) as r:
              data=json.loads(r.read().decode("utf-8"))
          artists=data.get("artists") or []
          names=[str(a.get("name","")) for a in artists]
          summary={
              "algorithm":data.get("algorithm"),
              "source":data.get("source"),
              "warming":data.get("warming"),
              "count":len(artists),
              "validatedCount":data.get("validatedCount"),
              "builtAt":data.get("builtAt"),
              "names":names,
          }
          print("POPULAR_CONTRACT",json.dumps(summary,ensure_ascii=False))
          assert data.get("algorithm")=="rank-ordered-event-query-v2", summary
          assert data.get("identityValidation")=="primary-attraction-v3", summary
          assert data.get("source")=="spotify_monthly_listeners", summary
          if data.get("warming"):
              assert 0<len(artists)<=30, summary
          else:
              assert len(artists)==30, summary
          assert len({str(a.get("id","")) for a in artists})==len(artists), summary
          assert all(a.get("eventConfirmed") is True and int(a.get("shows") or 0)>0 for a in artists), summary
          PY

  live:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Verify direct Concerts shell, cache headers and shared bundle
        run: |
          python - <<'PY'
          import re, urllib.request, time

          def get(url):
              req=urllib.request.Request(url,headers={
                  "User-Agent":"music98-live-smoke/1.0",
                  "Cache-Control":"no-cache",
                  "Pragma":"no-cache",
              })
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,{k.lower():v for k,v in r.headers.items()},r.read().decode("utf-8","replace")

          for attempt in range(12):
              try:
                  status,h,html=get("https://music98.news/concerts")
                  assert status==200
                  assert "no-store" in h.get("cache-control","").lower()
                  assert h.get("cf-cache-status","").upper()!="HIT"
                  assert h.get("x-m98-concerts-shell")=="index"
                  assert "<title>Concerts Near You - music98.news</title>" in html
                  assert '<meta property="og:title" content="Concerts Near You - music98.news">' in html
                  assert '<link rel="canonical" href="https://music98.news/concerts">' in html
                  direct_src=re.search(r'<script src="(/concerts-app\.js\?v=[^"]+)" defer></script>',html)
                  assert direct_src
                  assert direct_src.group(1)=="/concerts-app.js?v=20261008-02"
                  _,_,home=get("https://music98.news/")
                  home_src=re.search(r'<script src="(/concerts-app\.js\?v=[^"]+)" defer></script>',home)
                  assert home_src and direct_src.group(1)==home_src.group(1)
                  _,jh,js=get("https://music98.news"+direct_src.group(1))
                  assert 'applyConcertArt(img,originalArt,"event")' in js
                  assert re.search(r"(?m)^\\s+grid\\.append\\(img,main\\);\\s*\\n\\s+body\\.appendChild\\(grid\\);",js)
                  assert "dragging.\\\\n  grid.append" not in js
                  assert 'root.className="pop-card"' in js
                  assert 'img.className="pop-thumb"' in js
                  assert 'applyConcertArt(img,item.image||"/logo.png","icon")' in js
                  assert "function browserResampleConcertArt(img,preset)" in js
                  assert 'imageSmoothingQuality="high"' in js
                  assert "popupImage" not in js
                  assert "compactSameConcertImage" not in js
                  assert "ticket-alt" not in js
                  assert "no-store" in jh.get("cache-control","").lower()
                  assert jh.get("cf-cache-status","").upper()!="HIT"
                  assert 'mode:"markets"' in js or 'mode:"markets",' in js
                  print("DIRECT_CONCERTS_PASS",{"attempt":attempt+1,"cacheControl":h.get("cache-control"),"cfCacheStatus":h.get("cf-cache-status"),"bundle":direct_src.group(1)})
                  break
              except Exception as e:
                  print("DIRECT_CONCERTS_WAIT",{"attempt":attempt+1,"error":repr(e)})
                  if attempt==11: raise
                  time.sleep(60)
          PY

      - name: Verify deployed world map and cached Popular 30
        run: |
          python - <<'PY'
          import json, time, urllib.request

          BASE="https://music98.news/api/concerts"
          def get(mode, version):
              url=f"{BASE}?mode={mode}&v={version}&livecheck={int(time.time()*1000)}"
              req=urllib.request.Request(url,headers={
                  "User-Agent":"music98-live-smoke/1.0",
                  "Cache-Control":"no-cache",
                  "Accept":"application/json",
              })
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          last={}
          for attempt in range(12):
              try:
                  markets=get("markets","concert-markets-v7")
                  popular=get("popular","popular-v13")
                  countries={str(x.get("countryCode","")).upper() for x in markets.get("markets",[])}
                  world_ok=(
                      markets.get("version")=="concert-markets-v4"
                      and "US" in countries
                      and "AE" in countries
                      and bool(countries & {"GB","FR","DE","IT","ES","NL"})
                  )
                  artists=popular.get("artists") or []
                  popular_ok=(
                      popular.get("algorithm")=="rank-ordered-event-query-v2"
                      and popular.get("identityValidation")=="primary-attraction-v3"
                      and popular.get("source")=="spotify_monthly_listeners"
                      and len(artists)==30
                      and all(a.get("eventConfirmed") is True and int(a.get("shows") or 0)>0 for a in artists)
                  )
                  last={
                      "attempt":attempt+1,
                      "mapVersion":markets.get("version"),
                      "marketCount":len(markets.get("markets") or []),
                      "countries":sorted(countries),
                      "popularCount":len(artists),
                      "popularWarming":popular.get("warming"),
                      "popularAlgorithm":popular.get("algorithm"),
                      "popularSource":popular.get("source"),
                      "popularNames":[a.get("name") for a in artists],
                  }
                  print("LIVE_CHECK",json.dumps(last,ensure_ascii=False))
                  if world_ok and popular_ok:
                      print("LIVE_CONCERTS_PASS",json.dumps(last,ensure_ascii=False))
                      raise SystemExit(0)
              except Exception as e:
                  last={"attempt":attempt+1,"error":repr(e)}
                  print("LIVE_CHECK_ERROR",json.dumps(last))
              time.sleep(60)

          print("LIVE_CONCERTS_FAIL",json.dumps(last,ensure_ascii=False))
          raise SystemExit(1)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture clean-browser desktop and 390px Concerts acceptance
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p concert-acceptance
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage \
            --remote-debugging-port=9222 --user-data-dir=/tmp/music98-cdp about:blank \
            >/tmp/music98-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/version >/dev/null && break
            sleep 1
          done

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function newTarget(){
            const r=await fetch("http://127.0.0.1:9222/json/new?about:blank",{method:"PUT"});
            if(!r.ok) throw new Error("target create "+r.status);
            return r.json();
          }
          class CDP{
            constructor(url){
              this.ws=new WebSocket(url);
              this.seq=0; this.pending=new Map();
              this.ready=new Promise((resolve,reject)=>{
                this.ws.addEventListener("open",resolve,{once:true});
                this.ws.addEventListener("error",reject,{once:true});
              });
              this.ws.addEventListener("message",e=>{
                const m=JSON.parse(e.data);
                if(!m.id) return;
                const p=this.pending.get(m.id); if(!p) return;
                this.pending.delete(m.id);
                m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);
              });
            }
            async send(method,params={}){
              await this.ready;
              const id=++this.seq;
              const p=new Promise((resolve,reject)=>this.pending.set(id,{resolve,reject}));
              this.ws.send(JSON.stringify({id,method,params}));
              return p;
            }
            close(){try{this.ws.close();}catch{}}
          }
          async function evaluate(c,expression){
            const r=await c.send("Runtime.evaluate",{expression,awaitPromise:true,returnByValue:true});
            if(r.exceptionDetails) throw new Error(r.exceptionDetails.text||"evaluate failed");
            return r.result?.value;
          }
          const statsExpr=`(()=>{
            const host=document.querySelector("music98-concerts");
            const map=host?._concertMap;
            if(!map || !map.isStyleLoaded()) return null;
            let rendered=[];
            try{rendered=map.queryRenderedFeatures({layers:["capital-points"]})||[];}catch(e){}
            const keys=new Set(rendered.map(f=>[
              String(f.properties?.name||""),
              String(f.properties?.stateCode||""),
              String(f.properties?.countryCode||"")
            ].join("|")));
            let sourceCount=null;
            try{
              const d=map.getSource("hubs")?._data;
              sourceCount=Array.isArray(d?.features)?d.features.length:null;
            }catch(e){}
            const center=map.getCenter();
            return {
              href:location.href,title:document.title,
              canonical:document.querySelector('link[rel="canonical"]')?.href||"",
              bundle:document.querySelector('script[src^="/concerts-app.js"]')?.getAttribute("src")||"",
              zoom:map.getZoom(),center:[center.lng,center.lat],
              sourceCount,visibleMarkerCount:keys.size
            };
          })()`;

          async function waitConcerts(c,timeout=30000){
            const deadline=Date.now()+timeout;
            while(Date.now()<deadline){
              const v=await evaluate(c,statsExpr).catch(()=>null);
              if(v && Number(v.sourceCount)>=80) return v;
              await sleep(500);
            }
            throw new Error("concert map did not become ready");
          }
          async function shot(c,path){
            const r=await c.send("Page.captureScreenshot",{format:"png",fromSurface:true,captureBeyondViewport:false});
            fs.writeFileSync(path,Buffer.from(r.data,"base64"));
          }
          async function openCase({name,width,height,fromHome=false}){
            const t=await newTarget(),c=new CDP(t.webSocketDebuggerUrl);
            await c.send("Page.enable");
            await c.send("Runtime.enable");
            await c.send("Network.enable");
            await c.send("Network.setCacheDisabled",{cacheDisabled:true});
            await c.send("Emulation.setDeviceMetricsOverride",{
              width,height,deviceScaleFactor:1,mobile:width<=400,screenWidth:width,screenHeight:height
            });
            await c.send("Page.navigate",{url:fromHome?"https://music98.news/":"https://music98.news/concerts"});
            const deadline=Date.now()+25000;
            while(Date.now()<deadline){
              const ready=await evaluate(c,'document.readyState==="complete"').catch(()=>false);
              if(ready) break;
              await sleep(250);
            }
            if(fromHome){
              await evaluate(c,`(()=>{
                const b=document.querySelector('#nav .nav-btn[data-tab="concerts"]');
                if(!b) throw new Error("Concerts nav missing");
                b.click(); return location.pathname;
              })()`);
            }
            const initial=await waitConcerts(c);
            let oldCamera=null,newCamera=null;
            if(width<=400){
              await evaluate(c,`(()=>{const m=document.querySelector("music98-concerts")?._concertMap;m.jumpTo({center:[8,27],zoom:1.55});return true})()`);
              await sleep(700); oldCamera=await evaluate(c,statsExpr);
              await evaluate(c,`(()=>{const m=document.querySelector("music98-concerts")?._concertMap;m.jumpTo({center:[5,18],zoom:0});return true})()`);
              await sleep(700); newCamera=await evaluate(c,statsExpr);
            }
            await shot(c,`concert-acceptance/${name}.png`);
            const out={name,width,height,fromHome,initial,oldCamera,newCamera};
            c.close();
            return out;
          }

          const results=[];
          results.push(await openCase({name:"direct-desktop",width:1440,height:1000}));
          results.push(await openCase({name:"home-click-desktop",width:1440,height:1000,fromHome:true}));
          results.push(await openCase({name:"direct-mobile-390",width:390,height:844}));
          results.push(await openCase({name:"home-click-mobile-390",width:390,height:844,fromHome:true}));

          async function openWeekndMarkerCase(){
            const t=await newTarget(),c=new CDP(t.webSocketDebuggerUrl);
            await c.send("Page.enable");
            await c.send("Runtime.enable");
            await c.send("Network.enable");
            await c.send("Network.setCacheDisabled",{cacheDisabled:true});
            await c.send("Emulation.setDeviceMetricsOverride",{width:1440,height:1000,deviceScaleFactor:1,mobile:false,screenWidth:1440,screenHeight:1000});
            await c.send("Page.navigate",{url:"https://music98.news/concerts"});
            await waitConcerts(c);
            const listDeadline=Date.now()+30000;
            let clicked=false;
            while(Date.now()<listDeadline){
              clicked=await evaluate(c,`(()=>{
                const root=document.querySelector("music98-concerts")?.shadowRoot;
                if(!root) return false;
                const card=[...root.querySelectorAll(".tour-card")].find(el=>el.querySelector(".tour-name")?.textContent?.trim()==="The Weeknd") || root.querySelector(".tour-card");
                if(!card) return false;
                card.querySelector(".tour-row")?.click();
                return true;
              })()`).catch(()=>false);
              if(clicked) break;
              await sleep(500);
            }
            if(!clicked) throw new Error("No confirmed Popular artist row found");
            const markerDeadline=Date.now()+30000;
            let markerState=null;
            while(Date.now()<markerDeadline){
              markerState=await evaluate(c,`(()=>{
                const host=document.querySelector("music98-concerts");
                const map=host?._concertMap;
                const root=host?.shadowRoot;
                const d=map?.getSource("artist-events")?._data;
                const features=Array.isArray(d?.features)?d.features:[];
                return {
                  featureCount:features.length,
                  coordinates:features.map(f=>f.geometry?.coordinates),
                  subtitle:root?.querySelector("#sideSub")?.textContent||"",
                  status:root?.querySelector("#sideStatus")?.textContent||""
                };
              })()`).catch(()=>null);
              if((markerState?.featureCount||0)>0) break;
              await sleep(500);
            }
            await shot(c,"concert-acceptance/weeknd-marker.png");
            c.close();
            if(!markerState || markerState.featureCount<1) throw new Error("Selected artist marker was not drawn: "+JSON.stringify(markerState));
            return markerState;
          }

          const weekndMarker=await openWeekndMarkerCase();
          results.push({name:"weeknd-marker",marker:weekndMarker});

          const directD=results[0].initial,clickD=results[1].initial;
          const directM=results[2].initial,clickM=results[3].initial;
          if(directD.bundle!==clickD.bundle || directM.bundle!==clickM.bundle) throw new Error("bundle mismatch");
          if(directD.title!=="Concerts Near You - music98.news" || clickD.title!=="Concerts Near You - music98.news") throw new Error("title mismatch");
          if(directD.canonical!=="https://music98.news/concerts" || clickD.canonical!=="https://music98.news/concerts") throw new Error("canonical mismatch");
          if((results[2].newCamera?.visibleMarkerCount||0)<(results[2].oldCamera?.visibleMarkerCount||0)) throw new Error("mobile world overview regressed");

          fs.writeFileSync("concert-acceptance/stats.json",JSON.stringify(results,null,2));
          console.log("BROWSER_ACCEPTANCE",JSON.stringify(results));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concert-live-acceptance
          path: concert-acceptance/
          if-no-files-found: warn

