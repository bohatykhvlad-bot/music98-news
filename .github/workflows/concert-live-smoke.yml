name: concert live smoke

on:
  push:
    paths:
      - "worker.js"
      - "wrangler.toml"
      - "functions/api/concerts.js"
      - "public/concerts-app.js"
      - ".github/workflows/concert-live-smoke.yml"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify direct Concerts shell, cache headers and shared bundle
        run: |
          python - <<'PY'
          import re, urllib.request, time

          def get(url):
              req=urllib.request.Request(url,headers={
                  "User-Agent":"music98-live-smoke/1.0",
                  "Cache-Control":"no-cache",
                  "Pragma":"no-cache",
              })
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,{k.lower():v for k,v in r.headers.items()},r.read().decode("utf-8","replace")

          for attempt in range(12):
              try:
                  status,h,html=get("https://music98.news/concerts")
                  assert status==200
                  assert "no-store" in h.get("cache-control","").lower()
                  assert h.get("cf-cache-status","").upper()!="HIT"
                  assert h.get("x-m98-concerts-shell")=="index"
                  assert "<title>Concerts Near You - music98.news</title>" in html
                  assert '<meta property="og:title" content="Concerts Near You - music98.news">' in html
                  assert '<link rel="canonical" href="https://music98.news/concerts">' in html
                  direct_src=re.search(r'<script src="(/concerts-app\.js\?v=[^"]+)" defer></script>',html)
                  assert direct_src
                  _,_,home=get("https://music98.news/")
                  home_src=re.search(r'<script src="(/concerts-app\.js\?v=[^"]+)" defer></script>',home)
                  assert home_src and direct_src.group(1)==home_src.group(1)
                  _,jh,js=get("https://music98.news"+direct_src.group(1))
                  assert "no-store" in jh.get("cache-control","").lower()
                  assert jh.get("cf-cache-status","").upper()!="HIT"
                  assert 'mode:"markets"' in js or 'mode:"markets",' in js
                  print("DIRECT_CONCERTS_PASS",{"attempt":attempt+1,"cacheControl":h.get("cache-control"),"cfCacheStatus":h.get("cf-cache-status"),"bundle":direct_src.group(1)})
                  break
              except Exception as e:
                  print("DIRECT_CONCERTS_WAIT",{"attempt":attempt+1,"error":repr(e)})
                  if attempt==11: raise
                  time.sleep(60)
          PY

      - name: Verify deployed world map and cached Popular 30
        run: |
          python - <<'PY'
          import json, time, urllib.request

          BASE="https://music98.news/api/concerts"
          def get(mode, version):
              url=f"{BASE}?mode={mode}&v={version}&livecheck={int(time.time()*1000)}"
              req=urllib.request.Request(url,headers={
                  "User-Agent":"music98-live-smoke/1.0",
                  "Cache-Control":"no-cache",
                  "Accept":"application/json",
              })
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))

          last={}
          for attempt in range(12):
              try:
                  markets=get("markets","concert-markets-v7")
                  popular=get("popular","popular-v9")
                  countries={str(x.get("countryCode","")).upper() for x in markets.get("markets",[])}
                  world_ok=(
                      markets.get("version")=="concert-markets-v4"
                      and "US" in countries
                      and "AE" in countries
                      and bool(countries & {"GB","FR","DE","IT","ES","NL"})
                  )
                  artists=popular.get("artists") or []
                  popular_ok=(
                      len(artists)==30
                      and all(a.get("eventConfirmed") is True and int(a.get("shows") or 0)>0 for a in artists)
                  )
                  last={
                      "attempt":attempt+1,
                      "mapVersion":markets.get("version"),
                      "marketCount":len(markets.get("markets") or []),
                      "countries":sorted(countries),
                      "popularCount":len(artists),
                      "popularWarming":popular.get("warming"),
                  }
                  print("LIVE_CHECK",json.dumps(last,ensure_ascii=False))
                  if world_ok and popular_ok:
                      print("LIVE_CONCERTS_PASS",json.dumps(last,ensure_ascii=False))
                      raise SystemExit(0)
              except Exception as e:
                  last={"attempt":attempt+1,"error":repr(e)}
                  print("LIVE_CHECK_ERROR",json.dumps(last))
              time.sleep(60)

          print("LIVE_CONCERTS_FAIL",json.dumps(last,ensure_ascii=False))
          raise SystemExit(1)
          PY
