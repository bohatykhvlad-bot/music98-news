name: covers

# Обложки Apple для чарта: iTunes API из Cloudflare отвечает через раз, поэтому файл
# public/data/covers.json собирается здесь - с обычного IP Apple отвечает всегда.
# Воркер читает этот файл и запоминает обложку по песне, так что на сайте она
# не меняется день ото дня.

on:
  schedule:
    - cron: "20 2 * * *" # 05:20 по Киеву
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Собрать Apple-обложки текущего чарта
        run: node scripts/build-covers.mjs
      - name: Закоммитить, если изменилось
        run: |
          git config user.name "music98 covers bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/covers.json
          if git diff --cached --quiet; then
            echo "обложки без изменений"
            exit 0
          fi
          git commit -m "covers: ежедневное обновление Apple-обложек"
          git push
