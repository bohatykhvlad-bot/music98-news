name: Daily Top 50

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild Top 50
        run: python3 scripts/update_top50.py
      - name: Commit if the list changed
        run: |
          git config user.name "music98-bot"
          git config user.email "bot@music98.news"
          git add data/top50.json index.html
          git diff --cached --quiet && echo "No chart changes" && exit 0
          git commit -m "Update daily Top 50"
          git push
