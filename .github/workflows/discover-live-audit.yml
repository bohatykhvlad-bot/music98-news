name: Discover live deployment audit
on:
  push:
    branches: [main]
    paths:
      - public/index.html
      - public/discover-app.js
      - public/discover-ambient.js
      - public/discover-catalog-policy.js
      - public/data/discover-albums.json
      - scripts/audit-discover-live.mjs
      - .github/workflows/discover-live-audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discover-live-audit
  cancel-in-progress: true
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the deployed primary Discover UI and complete catalog
        run: node scripts/audit-discover-live.mjs
