name: Ella final cleanup 2026-10-05
on:
  push:
    branches:
      - editorial/ella-sixth-proofread-20261004
    paths:
      - .github/workflows/ella-final-cleanup-20261005.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: \${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed Ella cleanup to Draft only
        shell: bash
        run: |
          set -o pipefail
          python editorial/apply-ella-cleanup-20261005.py | tee /tmp/ella-cleanup.log
      - name: Record successful verification
        shell: bash
        run: |
          cp /tmp/ella-cleanup.log editorial/ella-cleanup-success-20261005.txt
          git config user.name "music98 editorial bot"
          git config user.email "actions@users.noreply.github.com"
          git add editorial/ella-cleanup-success-20261005.txt
          git commit -m "editorial: verify Ella final cleanup" || true
          git push origin HEAD:editorial/ella-sixth-proofread-20261004
