name: Ella final text-only save
on:
  push:
    branches: [editorial/ella-full-review-selective-20261004]
    paths: [.github/workflows/ella-final-four-draft-job.yml]
permissions:
  contents: read
jobs:
  safe-draft-save:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python editorial/apply-ella-final-four.py
