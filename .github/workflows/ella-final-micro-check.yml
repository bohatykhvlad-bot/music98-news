name: Ella final micro editorial gate
on:
  push:
    branches: [editorial/ella-final-micro-20261004]
    paths:
      - editorial/ella-third-pass-20261004.md
      - .github/workflows/ella-final-micro-check.yml
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Ella prose, source media, gate and preflight without writing desk
        shell: bash
        run: |
          python - <<'PY'
          import re,sys,json
          from pathlib import Path
          from collections import Counter
          sys.path.insert(0,'scripts')
          from gate import check_post
          from preflight import check
          raw=Path('editorial/ella-third-pass-20261004.md').read_text().strip()
          title,body=raw.split('\n\n',1)
          title=title.removeprefix('# ')
          first=body.split('. Country radio',1)[0]+'.'
          media=re.findall(r'^\[(?:photo|apple|youtube|ig|tiktok|instagram):[^\n]+$',body,re.M)
          expected=[
            '[apple:song:1844932149:1844932150]',
            '[photo:photos/ella-dandelion-caylee-2026-2730x3631-original.jpg|Caylee Robillard|https://www.cayleerobillard.com/|50% 46.5%|1]',
            '[youtube:nUsrYVxrDwI]',
            '[youtube:Dm2TSMerGPQ]',
            '[youtube:i1IX4Dusi9k]',
            '[apple:album:1869436835]',
            '[apple:song:1062400323:1062400330]',
            '[youtube:238Z4YaAr1g]',
            '[youtube:4QIZE708gJ4]',
            '[photo:photos/ella-langley-live-caylee-robillard-2026.jpg|Caylee Robillard|https://cayleerobillard.com/|50% 50%|1]',
          ]
          if media!=expected:raise SystemExit('MEDIA_LAYOUT_REGRESSION')
          paragraphs=[x for x in body.split('\n\n') if x and not x.startswith('[')]
          assert len(paragraphs)==21,(len(paragraphs),'prose paragraph count')
          assert all(len(x.split())>=40 for i,x in enumerate(paragraphs) if i!=6),'unexpected prose fragment'
          assert 25<=len(paragraphs[6].split())<=40, 'Easter egg note should be compact'
          assert 85<=len(first)<=170,len(first)
          assert paragraphs[0].startswith('Ella Langley'), 'feature lede must promise feature topic'
          assert 'I-40' not in paragraphs[-1], 'old repeated ending retained'
          assert all(';' not in p and '—' not in p for p in paragraphs)
          assert "Nielsen's 2016" not in body and 'roughly 6%' not in body
          assert 'In 2023' in body and '19 weeks at No. 1' in body
          assert 'country clubs' not in body
          assert 'before its pop-radio audience reached anything close' not in body
          assert 'sits comfortably alongside that unresolved history' not in body
          assert 'expect one' not in body
          assert 'The personal history makes the partnership' not in body
          assert 'The distinction is useful precisely because' not in body
          assert 'By the Hot 100 chart dated October 3' in body
          assert 'the harder decision to leave' not in body
          assert 'It was an unusual moment in which a genre' not in body
          assert paragraphs[-1].endswith('She finishes the album alone with a song her family used to sing together.')
          words=re.findall(r"[a-z']+",' '.join(paragraphs).lower())
          counts=Counter(tuple(words[i:i+4]) for i in range(len(words)-3))
          repeated=[(' '.join(g),n) for g,n in counts.items() if n>=3]
          if repeated:raise SystemExit('TRIPLE_4GRAM_REPETITION '+str(repeated[:12]))
          post={'id':'ella26choosintexas','type':'feature','artist':'Ella Langley','title':title,
            'status':'draft','body':body,'excerpt':first,
            'cover':{'kind':'img','src':'photos/ella-dandelion-caylee-2026-2730x3631-original.jpg',
              'credit':'Caylee Robillard','creditUrl':'https://cayleerobillard.com/'}}
          baseline={**post,'body':'\n\n'.join(expected)}
          fails,warns,infos=check_post(post,True)
          print('ELLA_GATE_FAIL_CODES='+','.join(a for a,b in fails))
          print('ELLA_GATE_FAIL_DETAILS='+json.dumps(fails,ensure_ascii=False)[:2000])
          print('ELLA_GATE_WARN_CODES='+','.join(a for a,b in warns))
          print('ELLA_GATE_WARN_TEXT='+json.dumps(warns,ensure_ascii=False)[:2500])
          if fails:raise SystemExit('STRICT_GATE_FAILED')
          if not check(post,baseline,10,1300):raise SystemExit('PREFLIGHT_FAILED')
          print('ELLA_EDITORIAL_PASS paragraphs='+str(len(paragraphs))+' words='+str(len(words))+
            ' media='+str(len(media))+' excerpt='+str(len(first))+' repeated_4grams=0')
          PY
