name: Apply final Ella micros to Cloudflare Draft
on:
  push:
    branches: [main]
    paths: [.github/workflows/ella-final-micro-sync-20261004.yml]
permissions:
  contents: read
jobs:
  save-ella-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/ella-final-micro-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved Ella micro-edits preserving all photo framing and other posts
        run: python editorial/apply-ella-final-micro.py
