name: Ella final copy-fix QA
on:
  push:
    branches: [editorial/ella-full-review-selective-20261004]
    paths: [.github/workflows/ella-final-touch-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      DRY_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gate, excerpt and preflight
        run: python editorial/ella-final-touch-review.py
