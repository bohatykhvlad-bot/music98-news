name: Ella post-save read-only verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ella-post-save-verify-20261004.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify remote saved draft checksum, excerpt and unchanged media manifest
        shell: bash
        run: |
          python - <<'PY'
          import os,json,hashlib,re,urllib.request
          secret=os.getenv('ADMIN_PASSWORD')
          if not secret:raise SystemExit('EDITOR_CREDENTIAL_UNAVAILABLE')
          req=urllib.request.Request('https://music98.news/api/desk',
            headers={'X-Admin-Key':secret,'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=35) as response:posts=json.load(response)['posts']
          matches=[x for x in posts if x.get('id')=='ella26choosintexas']
          if len(matches)!=1:raise SystemExit('TARGET_MISSING')
          p=matches[0];body=p.get('body','')
          digest=hashlib.sha256(body.encode()).hexdigest()
          expected='60d5723e0f4a384e55a5eb7e3541b245f72c21be09638efa309f3f54ac40a4f2'
          media=re.findall(r'\[(?:photo|youtube|apple|ig|instagram|tiktok):[^\]]+\]',body)
          photo=[x for x in media if x.startswith('[photo:')]
          if p.get('status')!='draft' or digest!=expected or len(media)!=10 or len(photo)!=2:
            raise SystemExit('REMOTE_SAVED_DRAFT_MISMATCH status='+str(p.get('status'))+' sha='+digest+' media='+str(len(media)))
          assert p.get('title')=="The Ella Langley Phenomenon and Country's New Boom"
          assert body.startswith(p.get('excerpt') or '')
          assert len(p['excerpt'])>=85 and len(p['excerpt'])<=170
          assert photo[0].startswith('[photo:photos/ella-dandelion-caylee-2026-2730x3631-original.jpg|Caylee Robillard|')
          assert photo[1].startswith('[photo:photos/ella-langley-live-caylee-robillard-2026.jpg|Caylee Robillard|')
          print('SAVED_DRAFT_VERIFIED status=draft sha='+digest+' media=10 photos=2 excerpt=literal')
          PY
      - name: Run real remote gate against currently saved Draft
        shell: bash
        run: |
          set +e
          python scripts/gate.py --post ella26choosintexas --json > /tmp/ella-postsave-gate.json
          outcome=$?
          set -e
          python - <<'PY'
          import json
          data=json.load(open('/tmp/ella-postsave-gate.json'))
          for post in data.get('report',[]):
            print('REMOTE_GATE_FAIL_CODES='+','.join(x[0] for x in post.get('fails',[])))
            print('REMOTE_GATE_WARN_CODES='+','.join(x[0] for x in post.get('warns',[])))
          PY
          test "$outcome" -eq 0
      - name: Run real remote preflight against currently saved Draft
        shell: bash
        run: |
          python scripts/preflight.py --post ella26choosintexas --expected-media 10 --min-words 1300
