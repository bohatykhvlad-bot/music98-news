name: Ella reader-context Draft sync
on:
  push:
    branches: [editorial/ella-full-review-selective-20261004]
    paths: [.github/workflows/ella-reader-context-sync.yml]
permissions:
  contents: read
jobs:
  sync-ella-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and save reader-context Ella Draft only
        run: python editorial/ella-reader-context-sync.py
# Reader-context revision checked against editorial gate
