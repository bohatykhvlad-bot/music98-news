name: Ella feature candidate local editorial checks
on:
  push:
    branches:
      - editorial/ella-langley-95-review-20261004
    paths:
      - editorial/ella-langley-2026-longread-review.md
      - .github/workflows/ella-review-95-local.yml
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local canonical gate and preflight on proposal, no desk read or write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re,sys
          sys.path.insert(0,'scripts')
          from gate import check_post
          from preflight import check
          raw=Path('editorial/ella-langley-2026-longread-review.md').read_text()
          title,body=raw.split('\n\n',1)
          title=title.removeprefix('# ').strip()
          body=body.rstrip()
          first=body.split('. ')[0]+'.'
          media=re.findall(r'^\[(?:photo|apple|youtube|instagram|tiktok):[^\]]+\]$',body,re.M)
          expected=[
            '[apple:song:1844932149:1844932150]',
            '[photo:photos/ella-dandelion-caylee-2026-2730x3631-original.jpg|Caylee Robillard|https://www.cayleerobillard.com/|50% 46.5%|1]',
            '[youtube:nUsrYVxrDwI]',
            '[youtube:Dm2TSMerGPQ]',
            '[youtube:i1IX4Dusi9k]',
            '[apple:album:1869436835]',
            '[apple:song:1062400323:1062400330]',
            '[youtube:238Z4YaAr1g]',
            '[youtube:4QIZE708gJ4]',
            '[photo:photos/ella-langley-live-caylee-robillard-2026.jpg|Caylee Robillard|https://cayleerobillard.com/|50% 50%|1]',
          ]
          if media!=expected:raise SystemExit('MEDIA_EDIT_ABORT')
          if len(first)<85 or len(first)>170:raise SystemExit('EXCERPT_LENGTH_ABORT '+str(len(first)))
          # Known credit from the review baseline. The live cover still requires
          # separate authenticated verification before applying edits.
          cover={'kind':'img','src':'photos/ella-dandelion-caylee-2026-2730x3631-original.jpg','credit':'Caylee Robillard','creditUrl':'https://cayleerobillard.com/'}
          post={'id':'ella26choosintexas','type':'feature','artist':'Ella Langley','title':title,'status':'draft','body':body,'excerpt':first,'cover':cover}
          # Preflight media compare against the approved 10-marker manifest.
          baseline={**post,'body':'\n\n'.join(expected)}
          fails,warns,info=check_post(post,True)
          print('LOCAL_GATE_FAIL_CODES='+','.join(x[0] for x in fails))
          print('LOCAL_GATE_FAIL_DETAILS='+json.dumps(fails,ensure_ascii=False)[:1800])
          print('LOCAL_GATE_WARN_CODES='+','.join(x[0] for x in warns))
          print('LOCAL_GATE_WARN_DETAILS='+json.dumps(warns,ensure_ascii=False)[:2200])
          if fails:raise SystemExit('LOCAL_GATE_FAIL')
          if not check(post,baseline,10,1300):raise SystemExit('LOCAL_PREFLIGHT_FAIL')
          print('LOCAL_GATE_PASS LOCAL_PREFLIGHT_PASS')
          print('NOTE_THIS_IS_A_PUBLIC_BRANCH_PROPOSAL_NOT_A_SAVED_CLOUDFLARE_DRAFT')
          PY
