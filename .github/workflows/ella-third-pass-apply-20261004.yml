name: Apply Ella third-pass Draft only
on:
  push:
    branches: [main]
    paths: [.github/workflows/ella-third-pass-apply-20261004.yml]
permissions:
  contents: read
jobs:
  safe-ella-editorial-update:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/ella-third-pass-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Save verified Ella text and excerpt without touching owner photo crop
        run: python editorial/apply-ella-third-pass-draft.py
