name: Emergency export two live posts
on:
  push:
    branches: [main]
    paths: [.github/workflows/emergency-export-two-posts.yml]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Export exact live copy
        run: |
          node <<'NODE'
          const fs=require("fs");
          const ids=["shakira26amazonmadrid","auvictoriafol26r1"];
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Accept":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const r=await fetch("https://music98.news/api/desk?emergency="+Date.now(),{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            const j=await r.json();
            const posts=ids.map(id=>j.posts.find(p=>p.id===id));
            if(posts.some(p=>!p)) throw Error("MISSING");
            fs.writeFileSync(".github/emergency-two-live.json",JSON.stringify({posts},null,2));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
          git config user.name "music98-bot"
          git config user.email "music98-bot@users.noreply.github.com"
          git add .github/emergency-two-live.json
          git commit -m "Export exact live copies for emergency editorial repair"
          git push
