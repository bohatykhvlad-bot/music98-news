name: Final micro polish Shakira and Victoria
on:
  push:
    branches: [main]
    paths: [.github/workflows/final-micro-polish-two-posts.yml]
permissions:
  contents: read
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply only four agreed copy edits
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const ids=["shakira26amazonmadrid","auvictoriafol26r1"];
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Content-Type":"application/json","Accept":"application/json","Cache-Control":"no-cache"};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(n){
            const r=await fetch("https://music98.news/api/desk?micropolish="+Date.now()+"_"+n,{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            return r.json();
          }
          (async()=>{
            const d=await get(0);
            const sh=d.posts.find(p=>p.id===ids[0]);
            const vi=d.posts.find(p=>p.id===ids[1]);
            if(!sh||!vi||sh.status!=="live"||vi.status!=="live") throw Error("TARGET_NOT_LIVE");
            const others=JSON.stringify(d.posts.filter(p=>!ids.includes(p.id)));
            const meta={};
            for(const id of ids){
              const p=d.posts.find(x=>x.id===id);
              meta[id]=JSON.stringify(Object.fromEntries(Object.entries(p).filter(([k])=>k!=="body")));
            }

            const shOld1="The decision also carried some history of its own. ";
            if(!sh.body.includes(shOld1)) throw Error("SHAKIRA_BRIDGE_NOT_FOUND");
            sh.body=sh.body.replace(shOld1,"");

            const shOld2="The Madrid version therefore connected that earlier cover with Shakira's original catalog nearly three decades later.";
            const shNew2="Madrid was the first time Shakira and Dua Lipa performed the song together.";
            if(!sh.body.includes(shOld2)) throw Error("SHAKIRA_EXPLAINER_NOT_FOUND");
            sh.body=sh.body.replace(shOld2,shNew2);

            const viOld1='"Reach Out" moves into sleek club R&B, she has said she wrote "You Hurt Me Too" in the style of a James Bond theme, and "Juicy" carries more of the yacht-rock idea that shaped the album\'s earliest version.';
            const viNew1='"Reach Out" moves into sleek club R&B. She has said she wrote "You Hurt Me Too" in the style of a James Bond theme, while "Juicy" carries more of the yacht-rock idea that shaped the album\'s earliest version.';
            if(!vi.body.includes(viOld1)) throw Error("VICTORIA_LONG_SENTENCE_NOT_FOUND");
            vi.body=vi.body.replace(viOld1,viNew1);

            const viOld2="The album now moves into its live chapter. The tour opens October 27 in Raleigh and runs through December 17 in San Francisco.";
            const viNew2="The *Frequency Of Love* Tour opens October 27 in Raleigh and runs through December 17 in San Francisco.";
            if(!vi.body.includes(viOld2)) throw Error("VICTORIA_TOUR_BRIDGE_NOT_FOUND");
            vi.body=vi.body.replace(viOld2,viNew2);

            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers:h,body:JSON.stringify({posts:d.posts,touched:ids})});
            if(!s.ok) throw Error("SAVE_"+s.status);

            for(let i=1;i<=20;i++){
              await sleep(2000);
              const a=await get(i);
              const sh2=a.posts.find(p=>p.id===ids[0]), vi2=a.posts.find(p=>p.id===ids[1]);
              if(!sh2||!vi2||sh2.body!==sh.body||vi2.body!==vi.body) continue;
              if(JSON.stringify(a.posts.filter(p=>!ids.includes(p.id)))!==others) throw Error("OTHER_POST_CHANGED");
              for(const id of ids){
                const p=a.posts.find(x=>x.id===id);
                const m=JSON.stringify(Object.fromEntries(Object.entries(p).filter(([k])=>k!=="body")));
                if(m!==meta[id]) throw Error("NON_BODY_FIELD_CHANGED_"+id);
              }
              console.log("MICRO_POLISH_APPLIED");
              return;
            }
            throw Error("KV_VERIFY_TIMEOUT");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Build exact staged copies for preflight
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          node <<'NODE'
          const fs=require("fs");
          const ids=["shakira26amazonmadrid","auvictoriafol26r1"];
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Accept":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const r=await fetch("https://music98.news/api/desk?audit="+Date.now(),{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            const d=await r.json();
            const posts=ids.map(id=>d.posts.find(p=>p.id===id));
            if(posts.some(p=>!p)) throw Error("MISSING");
            fs.writeFileSync("/tmp/two-live.json",JSON.stringify({posts},null,2));
            const staged=JSON.parse(JSON.stringify({posts}));
            staged.posts.forEach(p=>p.status="draft");
            fs.writeFileSync("/tmp/two-staged.json",JSON.stringify(staged,null,2));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Mandatory second readthrough exact live bodies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/editorial_readthrough.py --post shakira26amazonmadrid --file /tmp/two-live.json --confirm-full-read
          python scripts/editorial_readthrough.py --post auvictoriafol26r1 --file /tmp/two-live.json --confirm-full-read
      - name: Gate exact live bodies
        shell: python
        run: |
          import importlib.util,json,sys
          spec=importlib.util.spec_from_file_location("gate","scripts/gate.py")
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g);g.CHECK_IDS=False
          data=json.load(open("/tmp/two-live.json",encoding="utf-8"))
          bad=False
          for p in data["posts"]:
              fails,warns,info=g.check_post(p,strict=True)
              print("POST",p["id"])
              for k,v in info:
                  if k in ("length","dates","numbers"): print("INFO",k,v)
              for k,v in warns: print("WARN",k,v)
              for k,v in fails: print("FAIL",k,v)
              print("GATE","PASS" if not fails else "FAIL")
              bad=bad or bool(fails)
          if bad: sys.exit(1)
      - name: Preflight exact bodies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight.py --post shakira26amazonmadrid --file /tmp/two-staged.json --expected-media 1 --min-words 300
          python scripts/preflight.py --post auvictoriafol26r1 --file /tmp/two-staged.json --expected-media 1 --min-words 450
      - name: Verify public state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/post.py verify shakira26amazonmadrid
          python scripts/post.py verify auvictoriafol26r1
