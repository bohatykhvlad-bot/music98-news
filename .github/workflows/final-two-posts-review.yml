name: Final clean rewrite review and apply
on:
  push:
    branches: [main]
    paths:
      - .github/final-two-posts-rewrite.json
      - .github/workflows/final-two-posts-review.yml
      - scripts/editorial_readthrough.py
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mandatory readthrough Shakira
        run: python scripts/editorial_readthrough.py --post shakira26amazonmadrid --file .github/final-two-posts-rewrite.json --confirm-full-read
      - name: Mandatory readthrough Victoria
        run: python scripts/editorial_readthrough.py --post auvictoriafol26r1 --file .github/final-two-posts-rewrite.json --confirm-full-read
      - name: Gate both staged bodies
        shell: python
        run: |
          import importlib.util,json,sys
          spec=importlib.util.spec_from_file_location("gate","scripts/gate.py")
          g=importlib.util.module_from_spec(spec); spec.loader.exec_module(g); g.CHECK_IDS=False
          data=json.load(open(".github/final-two-posts-rewrite.json",encoding="utf-8"))
          bad=False
          for p in data["posts"]:
              fails,warns,info=g.check_post(p,strict=True)
              print("POST",p["id"])
              for k,v in warns: print("WARN",k,v)
              for k,v in fails: print("FAIL",k,v)
              print("GATE","PASS" if not fails else "FAIL")
              bad = bad or bool(fails)
          if bad: sys.exit(1)
      - name: Preflight both
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight.py --post shakira26amazonmadrid --file .github/final-two-posts-rewrite.json --expected-media 1 --min-words 280
          python scripts/preflight.py --post auvictoriafol26r1 --file .github/final-two-posts-rewrite.json --expected-media 1 --min-words 430
