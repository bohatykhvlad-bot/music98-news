name: Impact Ticketmaster affiliate link audit
on:
  push:
    paths:
      - "functions/api/concerts.js"
      - "public/concerts-app.js"
      - "public/concerts-raster-fallback.js"
      - ".github/workflows/impact-ticketmaster-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-affiliate-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live Buy Tickets destinations for Impact tracking
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, collections, time
          queries=[
              ("Berlin","DE"),
              ("Paris","FR"),
              ("New York","US"),
          ]
          publisher="4932692"
          seen=set()
          hosts=collections.Counter()
          examples=[]
          counts={"affiliate":0,"direct_ticketmaster":0,"other":0}
          for city,country in queries:
              url="https://music98.news/api/concerts?"+urllib.parse.urlencode(
                  {"city":city,"countryCode":country,"impactAudit":str(int(time.time()))})
              req=urllib.request.Request(url,headers={
                  "Accept":"application/json","Cache-Control":"no-cache",
                  "User-Agent":"music98-impact-audit/1.0"
              })
              try:
                  with urllib.request.urlopen(req,timeout=28) as response:
                      data=json.load(response)
              except Exception as err:
                  print("AUDIT_FETCH_FAILED",city,str(err))
                  continue
              rows=data.get("events") or []
              print("AUDIT_CITY",city,"events",len(rows))
              for row in rows:
                  raw=str(row.get("url") or "").strip()
                  if not raw or raw in seen:
                      continue
                  seen.add(raw)
                  p=urllib.parse.urlsplit(raw)
                  host=(p.hostname or "").lower()
                  hosts[host]+=1
                  affiliate=host.endswith(".evyy.net") and (
                      "/c/"+publisher+"/" in p.path or p.path.startswith("/c/"+publisher))
                  if affiliate: kind="affiliate"
                  elif host.startswith("ticketmaster.") or ".ticketmaster." in host: kind="direct_ticketmaster"
                  else: kind="other"
                  counts[kind]+=1
                  if len(examples)<18:
                      examples.append({"city":city,"kind":kind,"host":host,
                          "publisher_id_matches":affiliate,
                          "path_family":"/c/..." if p.path.startswith("/c/") else p.path[:48],
                          "query_keys":sorted(urllib.parse.parse_qs(p.query).keys())})
          print("IMPACT_AUDIT",json.dumps({
              "counts":counts,"hosts":dict(hosts),"examples":examples,
              "sampled_unique_urls":len(seen)},ensure_ascii=False))
          for city,country in [("New York","US"),("Berlin","DE")]:
              url="https://music98.news/api/concerts?"+urllib.parse.urlencode({"city":city,"countryCode":country})
              req=urllib.request.Request(url,headers={"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=28) as response:
                  subset=json.load(response).get("events") or []
              affiliate_urls=[x.get("url") for x in subset if (x.get("url") or "").startswith("https://ticketmaster.evyy.net/c/4932692/")]
              if affiliate_urls:
                  track=urllib.parse.urlsplit(affiliate_urls[0])
                  params=urllib.parse.parse_qs(track.query)
                  dest=urllib.parse.urlsplit(params.get("u",[""])[0])
                  print("KNOWN_TRACKING_TEMPLATE",json.dumps({"market":country,"host":track.netloc,"path":track.path,
                    "query_keys":sorted(params),"deep_link_host":dest.netloc,"deep_link_protocol":dest.scheme}))
          if counts["direct_ticketmaster"]:
              print("::warning::Affiliate tracking missing for",counts["direct_ticketmaster"],
                "Ticketmaster destinations. Verify local Impact contracts and API link wrapping.")
          assert len(seen)>0,"no concert URLs were sampled"
          assert counts["affiliate"]>0,"no Impact tracking links found in live concert event URLs"
          PY
