name: inspect-spotify-alternative-sources
on:
  push:
    paths:
      - "scripts/audit-spotify-alternates.mjs"
      - ".github/workflows/inspect-spotify-alternatives.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Inspect public Spotify chart alternatives
        run: node scripts/audit-spotify-alternates.mjs
