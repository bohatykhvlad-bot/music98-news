name: live-cover-check

on:
  push:
    paths:
      - ".github/workflows/live-cover-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare live cover deploy
        run: |
          node - <<'NODE'
          const expected = {
            "Loser|Tame Impala":"Music211/v4/5d/6e/6a/5d6e6a13-76a9-1532-3335-050520e795a8",
            "drop dead|Olivia Rodrigo":"Music221/v4/36/57/6b/36576b81-785b-d02c-00ed-d7362fec7688",
            "September|Earth, Wind & Fire":"Music115/v4/5c/8e/19/5c8e191d-b458-fc29-54ef-bd9367835044",
            "I Just Might|Bruno Mars":"Music211/v4/1c/14/0e/1c140ef6-b94a-1207-77d8-f0c94075bd8e",
            "Pink Blush|Dolly Babe":"Music221/v4/a1/e5/21/a1e521a1-2eab-8a76-2824-36c3978b975d",
          };
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          for(let attempt=1; attempt<=30; attempt++){
            try{
              const r=await fetch("https://music98.news/api/top50?livecover="+Date.now(),{
                headers:{"cache-control":"no-cache","user-agent":"music98-live-cover-check/1.0"}
              });
              const j=await r.json();
              const got={};
              for(const t of j.tracks||[]){
                const k=t.title+"|"+t.artist;
                if(expected[k]) got[k]=t.art||"";
              }
              const okRev=j.rev==="feat-v30";
              const bad=Object.entries(expected).filter(([k,needle])=>!(got[k]||"").includes(needle));
              console.log("attempt",attempt,"rev",j.rev,"bad",JSON.stringify(bad.map(x=>x[0])));
              if(okRev && bad.length===0){
                console.log("LIVE COVER VERIFY PASS",JSON.stringify(got));
                process.exit(0);
              }
            }catch(e){ console.log("check error",String(e)); }
            await sleep(10000);
          }
          throw new Error("live deploy did not converge to repaired covers in time");
          NODE
