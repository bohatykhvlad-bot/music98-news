name: Live TikTok renderer smoke
on:
  push:
    branches: [main]
    paths: [.github/workflows/live-tiktok-renderer-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify deployed site has immediate TikTok player behavior
        shell: python
        run: |
          import urllib.request, time
          url="https://music98.news/?tiktok-smoke=20261005"
          last=""
          for attempt in range(12):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  last=r.read().decode("utf-8","replace")
              ok=("tiktok.com/player/v1/" in last and
                  'TikTok couldn\'t be loaded.' in last and
                  '.tk-retry:hover,.tk-open:hover{background:var(--accent)' in last and
                  '.yembed.tk iframe{opacity:0}' not in last and
                  '_tkTimer' not in last)
              print("ATTEMPT",attempt+1,"STATUS",ok,"LEN",len(last))
              if ok:
                  print("LIVE_TIKTOK_RENDERER_OK")
                  break
              time.sleep(10)
          else:
              raise SystemExit("LIVE_TIKTOK_RENDERER_STALE_OR_INVALID")
