name: music98 mechanical draft check
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Existing draft ID to check mechanically
        required: true
        type: string
permissions:
  contents: read
jobs:
  check-post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require configured editor secret
        run: |
          test -n "$ADMIN_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Mechanical gate
        env:
          POST_ID: ${{ inputs.post_id }}
        run: python scripts/post.py gate "$POST_ID"
      - name: Payload/state preflight
        env:
          POST_ID: ${{ inputs.post_id }}
        run: python scripts/post.py preflight "$POST_ID"
      - name: Editorial warning
        run: |
          echo "PASS here does NOT mean the prose is editorially ready."
          echo "A current POST_EDIT_FULL_READ + HUMAN QUALITY PASS is still mandatory before write/publish."
