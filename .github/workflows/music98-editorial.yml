name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Desk list
        run: python scripts/post.py list
      - name: TEMP resolve TSUNAMI assets
        run: |
          python - <<'PY'
          import json, re, struct, urllib.parse, urllib.request
          UA={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=60).read()
          q=urllib.parse.urlencode({"term":"SOFI TUKKER OneRepublic TSUNAMI","entity":"song","country":"US","limit":25})
          data=json.loads(get("https://itunes.apple.com/search?"+q))
          for x in data.get("results",[]):
              if x.get("trackName","").upper()=="TSUNAMI":
                  print("APPLE", json.dumps({k:x.get(k) for k in ["artistName","collectionName","collectionId","trackId","trackViewUrl","collectionViewUrl","releaseDate","primaryGenreName"]}, ensure_ascii=False))
          page=get("https://www.sofitukker.com/").decode("utf-8","replace")
          urls=[]
          for u in re.findall(r'https?[^"\'<> ]+', page):
              u=u.replace("&amp;","&")
              if "wp-content/uploads" in u and ("Duo-DSP" in u or "press" in u.lower()):
                  urls.append(u)
          print("OFFICIAL_IMAGE_URLS")
          for u in sorted(set(urls)):
              print(u)
          photo="https://www.universalmusic.ca/wp-content/uploads/sites/1843/2026/09/Screenshot-2026-09-25-at-2.18.12-PM.png"
          raw=get(photo)
          print("PRESS_BYTES",len(raw))
          if raw[:8]==b'\x89PNG\r\n\x1a\n':
              w,h=struct.unpack(">II",raw[16:24]); print("PRESS_DIMS",w,h)
          open("/tmp/tsunami-press.png","wb").write(raw)
          PY
          file /tmp/tsunami-press.png
      - name: Inspect Fireflies media
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://www.dropbox.com/scl/fo/3b5x15fece0gdmyaxe0n8/ABBEEwylW6nVnCf3DF52rCk?rlkey=oxpvy17mb6nurbb13321itr5e&st=me4uptj5&dl=1"
          urllib.request.urlretrieve(url, "/tmp/fireflies-media.zip")
          PY
          unzip -l /tmp/fireflies-media.zip | head -100
      - name: Gate requested post
        if: ${{ inputs.post_id != '' }}
        run: python scripts/post.py gate "${{ inputs.post_id }}"
