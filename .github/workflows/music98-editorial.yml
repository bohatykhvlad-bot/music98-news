name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Repair Taylor post
        run: python scripts/repair_taylor.py
      - name: Desk list
        run: python scripts/post.py list
      - name: Gate repaired post
        run: python scripts/post.py gate "autay25r1"
