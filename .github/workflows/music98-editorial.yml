name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Desk list
        run: python scripts/post.py list
      - name: Fix Taylor Encore
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/taylor_fix.py
      - name: Taylor snapshot after fix
        run: python scripts/post.py show autay25r1
      - name: Taylor gate
        run: python scripts/post.py gate autay25r1
      - name: Verify cover
        run: |
          code=$(curl -sS -o /tmp/cover.jpg -w '%{http_code}' https://music98.news/photos/taylor-swift-encore-sept-2026.jpg)
          file /tmp/cover.jpg
          echo "COVER HTTP: $code"
          test "$code" = "200"
      - name: Gate requested post
        if: ${{ inputs.post_id != '' }}
        run: python scripts/post.py gate "${{ inputs.post_id }}"
