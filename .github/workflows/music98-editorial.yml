name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Desk list
        run: python scripts/post.py list

      - name: TEMP TAYLOR INSPECTION
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = "https://music98.news/api/desk"
          req = urllib.request.Request(url, headers={"X-Admin-Key": os.environ["ADMIN_PASSWORD"], "Accept":"application/json"})
          data = json.load(urllib.request.urlopen(req, timeout=90))
          out = []
          for p in data.get("posts", []):
              s = json.dumps(p, ensure_ascii=False).lower()
              if "taylor swift" in s or ("showgirl" in s and "taylor" in s):
                  out.append(p)
          with open("tmp-taylor-post.json","w",encoding="utf-8") as fh:
              json.dump(out, fh, ensure_ascii=False, indent=2)
          print("Taylor posts:", len(out))
          PY

      - name: TEMP COMMIT TAYLOR INSPECTION
        run: |
          git config user.name "music98-bot"
          git config user.email "music98-bot@users.noreply.github.com"
          git add tmp-taylor-post.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: temporary Taylor post inspection"
          git push
      - name: Gate requested post
        if: ${{ inputs.post_id != '' }}
        run: python scripts/post.py gate "${{ inputs.post_id }}"
