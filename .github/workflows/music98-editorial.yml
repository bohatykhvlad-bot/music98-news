name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Apply Taylor Swift release draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'Taylor') }}
        run: python scripts/apply_taylor_release.py
      - name: Desk list
        run: python scripts/post.py list
      - name: Gate requested post
        if: ${{ inputs.post_id != '' }}
        run: python scripts/post.py gate "${{ inputs.post_id }}"

# Taylor Swift draft runner is intentionally retained for the current editorial task.

