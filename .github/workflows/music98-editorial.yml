name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Desk list
        run: python scripts/post.py list
      - name: TEMP fetch official TSUNAMI cover candidate
        run: |
          mkdir -p .editorial
          python - <<'PY'
          import urllib.request
          u="https://www.sofitukker.com/wp-content/uploads/sites/20199/2026/03/Duo-DSP-1-main-press-image-2-1-compressed-scaled.jpg"
          r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          raw=urllib.request.urlopen(r,timeout=60).read()
          open(".editorial/tsunami-cover-candidate.jpg","wb").write(raw)
          print("bytes",len(raw))
          PY
          file .editorial/tsunami-cover-candidate.jpg
          git config user.name "music98 editorial"
          git config user.email "editorial@music98.news"
          git add .editorial/tsunami-cover-candidate.jpg
          git diff --cached --quiet || git commit -m "temp: stage TSUNAMI cover candidate"
          git push
      - name: Draft Fireflies release
        run: python scripts/draft_fireflies.py
      - name: Gate requested post
        if: ${{ inputs.post_id != '' }}
        run: python scripts/post.py gate "${{ inputs.post_id }}"
