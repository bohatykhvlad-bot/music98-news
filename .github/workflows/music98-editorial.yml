name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Inspect source-cover browser resampling eligibility
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[concert-cors-probe]') }}
        run: python scripts/diagnose_ticketmaster_cover_cors.py
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Stage Leon Bridges cover visual QC
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[leon-cover-qc]') }}
        run: |
          python -m pip install --quiet Pillow gdown
          python scripts/stage_leon_cover_qc.py
      - name: Upload Leon Bridges cover visual QC
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[leon-cover-qc]') }}
        uses: actions/upload-artifact@v4
        with:
          name: leon-cover-qc
          path: leon-cover-qc/
          if-no-files-found: error
      - name: Stage LISA cover visual QC
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lisa-cover-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/stage_lisa_cover_qc.py
      - name: Upload LISA cover visual QC
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lisa-cover-qc]') }}
        uses: actions/upload-artifact@v4
        with:
          name: lisa-cover-qc
          path: lisa-cover-qc/
          if-no-files-found: error
      - name: Draft Ella Choosin Texas longread text
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[draft-ella-longread-text]') }}
        run: python scripts/draft_ella_choosin_texas_longread.py
      - name: Revise Ella Choosin Texas full draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[revise-ella-longread-full]') }}
        run: python scripts/revise_ella_choosin_texas_full_draft.py
      - name: Polish Ella Choosin Texas draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[polish-ella-longread-final]') }}
        run: python scripts/polish_ella_choosin_texas_draft.py
      - name: Inspect Ella Oct 2 original photo candidates
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-oct02-photo-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella_oct02_photo_investigation.py
      - name: Verify Ella corrected photo links and end layout without writing
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-color-credit-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella_correct_color_photo_attribution_final.py --audit
      - name: Save Ella ICC-corrected cover and photographer credits
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-color-credit-save]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella_correct_color_photo_attribution_final.py --save
      - name: Review Caylee original live electric guitar Ella photo before draft substitution
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-caylee-live-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-caylee-live-option-qc.py
      - name: Inspect Keylee Baque and Andrew Wendowski 2026 original Ella photos
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-indie2026-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-keylee-andrew-photo-qc.py
      - name: Inspect Kirk Stauffer's original 2026 Ella SXSW stage gallery
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-kirk2026-qc]') }}
        run: |
          python -m pip install --quiet Pillow beautifulsoup4
          python scripts/ella-kirk-2026-stage-qc.py
      - name: QC original Ella Flickr and Wikimedia live guitar photo candidates
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-flickr-commons-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-flickr-commons-source-qc.py
      - name: Audit native full-frame Ella photos against latest existing draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-originals-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-20261002-uncropped-originals.py --audit
      - name: Save all Ella original photos only in verified existing draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-originals-save]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-20261002-uncropped-originals.py --save
      - name: Audit full-frame originals before changing Ella article photos
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-full-original-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-full-original-photo-source-audit.py
          git config user.name "music98 image audit"
          git config user.email "editorial@music98.news"
          git add .editorial/ella-oct02-original-source-geometry.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified full-frame source dimensions for Ella final photo"
            git push
          fi
      - name: Audit Ella 2026 final article photo replacement and exact 16:9 crop
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-photo2026-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-2026-last-photo-swap.py --audit
          git config user.name "music98 photo QC"
          git config user.email "editorial@music98.news"
          git add .editorial/ella-2026-selected-final-photo-preview.b64
          if ! git diff --cached --quiet; then
            git commit -m "Verify Ella official Sony 2026 final photo at actual article framing"
            git push
          fi
      - name: Save selected Ella 2026 photograph in existing draft only
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-photo2026-save]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-2026-last-photo-swap.py --save
      - name: Review official 2026 Sony Ella photos for final story image
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-photo2026-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-2026-new-last-photo-qc.py
          git config user.name "music98 editorial QC"
          git config user.email "editorial@music98.news"
          git add .editorial/ella-2026-new-final-photo-qc-small.b64 .editorial/ella-2026-new-final-photo-qc.json
          if ! git diff --cached --quiet; then
            git commit -m "Visual 16:9 source photo QC for 2026 Ella replacement"
            git push
          fi
      - name: Inspect new Ella source photo crop and guarded draft editorial changes
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-editorial-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-20261002-editorial-review.py --audit
          git config user.name "music98 editorial photo QC"
          git config user.email "editorial@music98.news"
          git add .editorial/ella-20261002-new-last-photo-preview.b64
          if ! git diff --cached --quiet; then
            git commit -m "Review Ella original native 16:9 final photo crop"
            git push
          fi
      - name: Save reviewed Ella copy and landscape performance photograph in draft only
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-editorial-save]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-20261002-editorial-review.py --save
      - name: Audit Ella native guitar photo and source-corrected prose
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-native-final-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-save-native-guitar-oct02.py --audit
      - name: Save native concert photo to existing Ella Draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-native-final-save]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-save-native-guitar-oct02.py --save
      - name: Inspect native concert photo originals
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-native-photo-audit]') }}
        run: |
          python -m pip install --quiet Pillow beautifulsoup4
          python scripts/ella_find_original_live_guitar.py
      - name: Audit original Ella portrait ICC profile
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-icc-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/audit_ella_color_profile_20261002.py
      - name: Audit final Ella layout and source photographs
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-finalize-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella_finalize_editorial_oct02.py --audit
      - name: Save final Ella article in Draft only
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-finalize-save]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella_finalize_editorial_oct02.py --save
      - name: Preview final Ella hero and concert 16 by 9 crops
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-final-crops]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-stage-final-image-crops.py
      - name: Inspect replacement Ella cover and concert photo
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-final-photo-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella-final-photo-qc.py
      - name: Audit LINKIN PARK contextual update
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lp20261002-audit]') }}
        run: python scripts/revise_lp_context_20261002.py --audit
      - name: Save verified LINKIN PARK editorial update
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lp20261002-save]') }}
        run: python scripts/revise_lp_context_20261002.py --save
      - name: Audit LINKIN PARK film-title repetition
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lp-title-audit]') }}
        run: python scripts/reduce_lp_unshatter_repeats_oct02.py --audit
      - name: Save reduced LINKIN PARK title repetition
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lp-title-save]') }}
        run: python scripts/reduce_lp_unshatter_repeats_oct02.py --save
      - name: Read current LINKIN PARK text without changes
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lp20261002-inspect]') }}
        run: python scripts/audit_lp_20261002_readonly.py
      - name: Audit Dolly song and Ella draft state
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-dolly-audit]') }}
        run: python scripts/ella-dolly-audit.py
      - name: Audit Ella October 2 draft without writing
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-oct02-audit]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella_oct02_finish.py --audit
      - name: Save Ella October 2 draft with strict gates
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-oct02-save-draft]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/ella_oct02_finish.py --save-draft
      - name: Stage Ella longread visual QC
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-longread-qc]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/stage_ella_longread_qc.py
      - name: Upload Ella longread visual QC
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[ella-longread-qc]') }}
        uses: actions/upload-artifact@v4
        with:
          name: ella-longread-qc
          path: ella-longread-qc/
          if-no-files-found: error
      - name: Desk list
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desk-list]')) }}
        run: python scripts/post.py list
      - name: TEMP fetch official TSUNAMI cover candidate
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p .editorial
          python - <<'PY'
          import urllib.request
          u="https://www.sofitukker.com/wp-content/uploads/sites/20199/2026/03/Duo-DSP-1-main-press-image-2-1-compressed-scaled.jpg"
          r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          raw=urllib.request.urlopen(r,timeout=60).read()
          open(".editorial/tsunami-cover-candidate.jpg","wb").write(raw)
          print("bytes",len(raw))
          PY
          file .editorial/tsunami-cover-candidate.jpg
          git config user.name "music98 editorial"
          git config user.email "editorial@music98.news"
          git add .editorial/tsunami-cover-candidate.jpg
          git diff --cached --quiet || git commit -m "temp: stage TSUNAMI cover candidate"
          git push
      - name: Inspect John Legend official wide covers
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import io, re, urllib.request
          from PIL import Image
          urls=[
            "https://johnlegend.com/img/hero-0011.webp",
            "https://johnlegend.com/img/ghost-0040.webp",
            "https://johnlegend.com/img/muse-inside-l.webp",
            "https://johnlegend.com/img/muse-inside-r.webp",
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              raw=urllib.request.urlopen(req,timeout=60).read()
              im=Image.open(io.BytesIO(raw))
              print("CANDIDATE", url, im.size, len(raw), im.format)
              if url.endswith("hero-0011.webp"):
                  print("HERO_INFO", dict(im.info))
                  try:
                      exif=im.getexif()
                      print("HERO_EXIF", {str(k):str(v) for k,v in exif.items()})
                  except Exception as e:
                      print("HERO_EXIF_ERROR", repr(e))
          page=urllib.request.urlopen(
              urllib.request.Request("https://johnlegend.com/",headers={"User-Agent":"Mozilla/5.0"}),
              timeout=60
          ).read().decode("utf-8","replace")
          for pat in ("hero-0011.webp","photographer","photo credit","credit"):
              print("PAGE_FIND", pat, [m.start() for m in re.finditer(re.escape(pat), page, re.I)][:20])
          i=page.find("hero-0011.webp")
          if i>=0:
              print("HERO_HTML_CONTEXT", page[max(0,i-700):i+900].replace("\n"," "))
          PY
      - name: Draft September 30 news and release
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[sep30-drafts]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/draft_sep30_news_release.py
      - name: Draft September 30 news and release v2
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[sep30-drafts-v2]') }}
        run: |
          python -m pip install --quiet Pillow gdown
          python scripts/draft_sep30_news_release_v2.py
      - name: Publish Fireflies after final review
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-fireflies]') }}
        run: |
          python scripts/post.py gate "aujlfire28r1"
          python scripts/post.py publish "aujlfire28r1"
          python scripts/post.py verify "aujlfire28r1"
      - name: Revise Fireflies live
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[revise-fireflies]') }}
        run: python scripts/revise_fireflies_live.py
      - name: Resolve VMA winner photos
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[vma-assets]') }}
        run: python scripts/vma_pick_winner_photos.py
      - name: Draft 2026 VMA results
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[vma-draft]') }}
        run: python scripts/draft_vmas_2026_results.py
      - name: Inspect VMA live
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[vma-live-inspect]') }}
        run: python scripts/inspect_vmas_live.py
      - name: Audit dash usage
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[dash-audit]') }}
        run: python scripts/audit_dash_usage.py
      - name: Apply artist-title hyphen style
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[artist-title-style]') }}
        run: python scripts/apply_artist_title_hyphen.py
      - name: Inspect release fields
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[release-fields]') }}
        run: python scripts/inspect_release_fields.py
      - name: Check live concerts integration
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[concerts-check]') }}
        run: python scripts/check_concerts_live.py
      - name: Revise VMA live
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[vma-live]') }}
        run: python scripts/update_vmas_2026_live.py
      - name: Draft final September 30 pair
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[sep30-final-pair]') }}
        run: |
          python -m pip install --quiet Pillow gdown
          python scripts/draft_sep30_final_pair.py
      - name: Revise LINKIN PARK Unshatter draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lp-unshatter-revise]') }}
        run: python scripts/revise_linkin_unshatter_draft.py
      - name: Revise Linkin Park draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[revise-linkin-park-draft]') }}
        run: python scripts/revise_linkin_park_draft.py
      - name: Clean Linkin Park duplicate
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cleanup-linkin-park]') }}
        run: python scripts/cleanup_linkin_park_post.py
      - name: Revise LISA residency draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[revise-lisa-residency]') }}
        run: |
          python -m pip install --quiet Pillow gdown
          python scripts/revise_lisa_residency_draft.py
      - name: Create Ella Langley Choosin Texas feature draft
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[create-ella-texas-feature]') }}
        run: python scripts/create_ella_choosin_texas_feature.py
      - name: Pin LISA live post
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pin-lisa]') }}
        run: python scripts/pin_lisa_live.py
      - name: Inspect SaWaDiKa photo candidates
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lisa-photo-check]') }}
        run: |
          python -m pip install --quiet Pillow
          python scripts/check_lisa_sawadika_candidates.py
      - name: Gate requested post
        if: ${{ inputs.post_id != '' }}
        run: python scripts/post.py gate "${{ inputs.post_id }}"
