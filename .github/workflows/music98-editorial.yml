name: music98 editorial runner

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/music98-editorial.yml"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post ID to gate (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  editorial:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare environment
        run: |
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Check runner
        run: |
          python --version
          test -f scripts/post.py
          test -f scripts/gate.py
      - name: Desk list
        run: python scripts/post.py list
      - name: TEMP fetch official TSUNAMI cover candidate
        run: |
          mkdir -p .editorial
          python - <<'PY'
          import urllib.request
          u="https://www.sofitukker.com/wp-content/uploads/sites/20199/2026/03/Duo-DSP-1-main-press-image-2-1-compressed-scaled.jpg"
          r=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          raw=urllib.request.urlopen(r,timeout=60).read()
          open(".editorial/tsunami-cover-candidate.jpg","wb").write(raw)
          print("bytes",len(raw))
          PY
          file .editorial/tsunami-cover-candidate.jpg
          git config user.name "music98 editorial"
          git config user.email "editorial@music98.news"
          git add .editorial/tsunami-cover-candidate.jpg
          git diff --cached --quiet || git commit -m "temp: stage TSUNAMI cover candidate"
          git push
      - name: Inspect John Legend official wide covers
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          import io, re, urllib.request
          from PIL import Image
          urls=[
            "https://johnlegend.com/img/hero-0011.webp",
            "https://johnlegend.com/img/ghost-0040.webp",
            "https://johnlegend.com/img/muse-inside-l.webp",
            "https://johnlegend.com/img/muse-inside-r.webp",
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              raw=urllib.request.urlopen(req,timeout=60).read()
              im=Image.open(io.BytesIO(raw))
              print("CANDIDATE", url, im.size, len(raw), im.format)
              if url.endswith("hero-0011.webp"):
                  print("HERO_INFO", dict(im.info))
                  try:
                      exif=im.getexif()
                      print("HERO_EXIF", {str(k):str(v) for k,v in exif.items()})
                  except Exception as e:
                      print("HERO_EXIF_ERROR", repr(e))
          page=urllib.request.urlopen(
              urllib.request.Request("https://johnlegend.com/",headers={"User-Agent":"Mozilla/5.0"}),
              timeout=60
          ).read().decode("utf-8","replace")
          for pat in ("hero-0011.webp","photographer","photo credit","credit"):
              print("PAGE_FIND", pat, [m.start() for m in re.finditer(re.escape(pat), page, re.I)][:20])
          i=page.find("hero-0011.webp")
          if i>=0:
              print("HERO_HTML_CONTEXT", page[max(0,i-700):i+900].replace("\n"," "))
          PY
      - name: Publish Fireflies after final review
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-fireflies]') }}
        run: |
          python scripts/post.py gate "aujlfire28r1"
          python scripts/post.py publish "aujlfire28r1"
          python scripts/post.py verify "aujlfire28r1"
      - name: Revise Fireflies live
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[revise-fireflies]') }}
        run: python scripts/revise_fireflies_live.py
      - name: Probe official VMA press assets
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[vma-assets]') }}
        run: python scripts/vma_asset_probe.py
      - name: Gate requested post
        if: ${{ inputs.post_id != '' }}
        run: python scripts/post.py gate "${{ inputs.post_id }}"
