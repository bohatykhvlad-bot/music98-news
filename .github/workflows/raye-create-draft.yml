name: RAYE editorial draft final verification
on:
  push:
    branches:
      - editorial/raye-royal-albert-hall-2026-draft
    paths:
      - .github/workflows/raye-create-draft.yml
      - .github/editorial-drafts/raye-royal-albert-hall-2026.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: raye-royal-albert-hall-draft
  cancel-in-progress: false
jobs:
  create-draft:
    if: github.ref_name == 'editorial/raye-royal-albert-hall-2026-draft'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify editorial credentials and payload
        run: |
          test -n "$ADMIN_PASSWORD"
          python -m py_compile scripts/post.py scripts/gate.py scripts/preflight.py scripts/editorial_readthrough.py
          python - <<'PY'
          import json
          p=json.load(open('.github/editorial-drafts/raye-royal-albert-hall-2026.json',encoding='utf-8'))
          assert p['id']=='raye26royalalbertsymphony'
          assert p['status']=='draft' and p['type']=='news'
          assert p['body'].startswith(p['excerpt'])
          assert '[youtube:Iy2FoVeIUXs]' in p['body']
          print('PAYLOAD VALIDATED: RAYE ONLY, DRAFT ONLY')
          PY
      - name: Readthrough of exact final editorial payload
        run: |
          python scripts/editorial_readthrough.py --post raye26royalalbertsymphony --file .github/editorial-drafts/raye-royal-albert-hall-2026.json --phase post-edit --confirm-full-read
      - name: Local mechanical preflight
        run: |
          python scripts/preflight.py --post raye26royalalbertsymphony --file .github/editorial-drafts/raye-royal-albert-hall-2026.json --min-words 400
      - name: Verify saved Cloudflare draft using guarded reader
        run: |
          python scripts/post.py show raye26royalalbertsymphony > /tmp/raye-saved-post.txt
          grep -q 'status draft' /tmp/raye-saved-post.txt
      - name: Post-save read-back and double mechanical gate
        run: |
          python scripts/post.py preflight raye26royalalbertsymphony
          python scripts/post.py gate raye26royalalbertsymphony
          python - <<'PY'
          import json,sys
          sys.path.insert(0,'scripts')
          from post import desk_read
          desk=desk_read()
          expected=json.load(open('.github/editorial-drafts/raye-royal-albert-hall-2026.json',encoding='utf-8'))
          found=[p for p in desk['posts'] if p.get('id')==expected['id']]
          assert len(found)==1 and found[0]['status']=='draft'
          for f in ['title','body','excerpt','cover']:
              assert found[0][f]==expected[f],f
          print('POST_SAVE_VERIFIED id='+expected['id']+' status=draft body_matches=true cover_matches=true live=false')
          PY
