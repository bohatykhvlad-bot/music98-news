name: RAYE read-only live correction audit
on:
  push:
    branches: [editorial/raye-royal-albert-hall-rewrite-20261011]
    paths:
      - .github/workflows/raye-live-postfix-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare exact saved article hash, media and cover against reviewed content
        shell: python
        run: |
          import os,hashlib,re,sys
          sys.path.insert(0,'scripts')
          from post import desk_read
          expected='b703db952e4ccb7324d75d027e390e365b285d674107b28c77a1707c255f08af'
          posts=desk_read()['posts']
          p=next((q for q in posts if q.get('id')=='raye26royalalbertsymphony'),None)
          if not p or p.get('status')!='live':raise SystemExit('NOT_LIVE')
          body=p.get('body') or ''
          actual=hashlib.sha256(body.encode()).hexdigest()
          if actual!=expected:raise SystemExit('LIVE_BODY_HASH_MISMATCH '+actual)
          parts=body.split('\n\n')
          medias=re.findall(r'\[(?:photo|youtube|apple|instagram|ig|tiktok|tickets):[^\]]+\]',body,re.I)
          if len(medias)!=1 or not re.fullmatch(r'\[youtube:[A-Za-z0-9_-]{11}\]',medias[0]):raise SystemExit('MEDIA_MISMATCH')
          if parts.index(medias[0])!=3:raise SystemExit('MEDIA_NOT_AFTER_THIRD_PARAGRAPH')
          if 'Poland' in body or 'not footage' in body or 'not a rehearsal' in body:raise SystemExit('OLD_CLAIMS_REMAIN')
          if not body.startswith(p.get('excerpt') or ''):raise SystemExit('EXCERPT_NOT_LITERAL_PREFIX')
          cover=p.get('cover') or {}
          if cover.get('src')!='photos/raye-radoslaw-zydowicz-lodz-live-2026.jpg' or cover.get('creditUrl')!='https://rozentuzjazmowany.pl/':raise SystemExit('COVER_CHANGED')
          print('RAYE_LIVE_AUDIT_PASS status=live sha256='+actual+' paragraphs='+str(len(parts)-1)+' media_after_paragraph=3 cover=preserved old_phrases=absent')
      - name: Check public feed, cover JPEG and YouTube embed
        run: python scripts/post.py verify raye26royalalbertsymphony
