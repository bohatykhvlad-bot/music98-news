name: RAYE restrained human-voice editorial polish
on:
  push:
    branches: [editorial/raye-royal-albert-hall-rewrite-20261011]
    paths:
      - editorial-drafts/raye-royal-albert-hall-2026-10-11.md
      - .github/workflows/raye-orchestral-lede-fix.yml
permissions:
  contents: read
jobs:
  revise-existing-live-text:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
      POST_ID: raye26royalalbertsymphony
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register verified facts for editorial gate
        run: |
          python scripts/post.py register "October 15" "Official Simon Jones PR 9 October: RAYE Royal Albert Hall general tickets on sale 15 October 2026"
          python scripts/post.py register "January 2023" "Official Charts: RAYE Escapism with 070 Shake first topped UK singles chart in January 2023"
      - name: Verify unchanged published source, preserve metadata and prepare copy
        shell: python
        run: |
          import hashlib,os,re,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from post import desk_read,_local_gate,_local_preflight
          pid=os.environ['POST_ID']
          current=[p for p in desk_read()['posts'] if p.get('id')==pid]
          if len(current)!=1:raise SystemExit('RAYE_NOT_UNIQUE')
          p=current[0]
          if p.get('status')!='live' or p.get('type')!='news':raise SystemExit('RAYE_NOT_LIVE_NEWS')
          if p.get('title')!='RAYE Announces One-Night Orchestral Show at Royal Albert Hall':raise SystemExit('RAYE_TITLE_CHANGED')
          cover=p.get('cover') or {}
          if cover.get('src')!='photos/raye-radoslaw-zydowicz-lodz-live-2026.jpg' or cover.get('creditUrl')!='https://rozentuzjazmowany.pl/':raise SystemExit('RAYE_COVER_CHANGED')
          path=Path('editorial-drafts/raye-royal-albert-hall-2026-10-11.md')
          editorial_source=path.read_text('utf-8')
          part=editorial_source.split('## Article body\n\n',1)[1].split('\n\n## Existing media and credit',1)[0].strip()
          paras=[x.strip() for x in part.split('\n\n') if x.strip()]
          if len(paras)!=7 or any(len(x.split())<58 for x in paras):raise SystemExit('RAYE_PARAGRAPH_STRUCTURE_CHANGED')
          media=re.findall(r'\[(?:youtube|photo|apple|instagram|ig|tiktok|tickets):[^\]]+\]',p.get('body') or '',re.I)
          if media!=['[youtube:Iy2FoVeIUXs]']:raise SystemExit('RAYE_MEDIA_CHANGED')
          updated='\n\n'.join(paras[:3]+media+paras[3:])
          old=updated
          edits=[
            ("She began playing new songs on tour before the album came out, using the live shows to work out how they should sound on the finished record.", "She played some of the songs on tour before the album was released, listening to audience reactions as she worked out how the studio versions should sound."),
            ("They exchanged ideas until the recording included an orchestra.", "They developed the song together, and the recording features an orchestra."),
            ("She called the finished song \"unapologetically cinematic.\"", "She called it \"unapologetically cinematic.\""),
            ("The full album went to No. 1 in the UK.", "The album later reached No. 1 in the UK."),
            ("The announcement included a new Abbey Road Studios performance of \"I Will Overcome.\" with the London Symphony Orchestra.", "RAYE also released an Abbey Road Studios performance of \"I Will Overcome.\" with the London Symphony Orchestra."),
            ("Earlier this year, RAYE played the song for an ELLE journalist and called it \"big and dramatic.\"", "In an ELLE interview earlier this year, she played the song and called it \"big and dramatic.\""),
            ("She explained lyrics about how people hide their pain, followed by an admission that she is struggling but believes she will get through it.", "She explained a verse in which the narrator admits she is struggling but still believes she will somehow get through it."),
            ("The song follows a short opening scene about a woman alone in Paris.", "On the album, the song follows a spoken introduction about a woman alone in Paris."),
            ("Unlike that earlier show, which reworked existing recordings, the new concert is built around material that already incorporates orchestral arrangements in the studio.", "This time, she is bringing songs that already feature orchestral arrangements in the versions released on her latest album."),
            ("Before she could release an album of her own, RAYE spent years writing songs for other artists, including Beyoncé and Charli XCX.", "RAYE spent years writing songs for other artists, including Beyoncé and Charli XCX, before releasing her debut album."),
            ("After publicly criticizing years of delays in 2021, she left the label to work independently.", "After criticizing the delays publicly in 2021, she left the label to work independently."),
            ("On *This Music May Contain Hope.*, RAYE wrote from a different place. She told ELLE she had composed most of it sober and no longer used alcohol to bury difficult feelings.", "RAYE told ELLE she wrote most of *This Music May Contain Hope.* sober, having stopped using alcohol to bury difficult feelings."),
            ("Its opening autumn chapter explores the urge to fix loneliness with a drink or a relationship.", "The album's autumn section explores the temptation to drink or start a relationship rather than face loneliness."),
            ("She spoke about learning to spend an evening by herself, something she once found difficult.", "She said being alone had once made her sad, but she was now learning to enjoy her own company instead."),
          ]
          for before,after in edits:
              if old.count(after)!=1:raise SystemExit('RAYE_REWRITE_MISSING_OR_DUPLICATE '+before[:40])
              old=old.replace(after,before,1)
          original=(p.get('body') or '').strip()
          if old!=original:raise SystemExit('RAYE_LIVE_BODY_CHANGED_OR_UNRELATED_EDIT_ABORT')
          if original.split('\n\n')[3]!=media[0] or updated.split('\n\n')[3]!=media[0]:raise SystemExit('RAYE_VIDEO_POSITION_CHANGED')
          excerpt="RAYE will return to London's Royal Albert Hall on October 23 for a one-night orchestral concert."
          if (p.get('excerpt') or '').strip()!=excerpt or not updated.startswith(excerpt):raise SystemExit('RAYE_EXCERPT_CHANGED')
          if len(updated.split())<400:raise SystemExit('RAYE_ARTICLE_TOO_SHORT')
          for banned in ('in full','every song','second album'):
              if banned in updated:raise SystemExit('RAYE_UNWANTED_LEDE_CLAIM')
          if not _local_gate(dict(p,body=updated,excerpt=excerpt)):raise SystemExit('RAYE_LOCAL_GATE_FAILED')
          candidate=dict(p,body=updated,excerpt=excerpt,status='draft')
          if not _local_preflight(candidate,baseline=p,expected_media=1,min_words=400):raise SystemExit('RAYE_LOCAL_PREFLIGHT_FAILED')
          Path('/tmp/raye-polished.txt').write_text(updated,encoding='utf-8')
          Path('/tmp/raye-polished-sha.txt').write_text(hashlib.sha256(updated.encode()).hexdigest(),encoding='utf-8')
          print('RAYE_TARGETED_REWRITE_VALIDATED paragraphs=7 edits='+str(len(edits))+' words='+str(len(updated.split())))
      - name: Full pre-edit and post-edit editorial readthrough
        shell: bash
        run: |
          python scripts/post.py editorial "$POST_ID" --phase pre-edit
          python scripts/post.py editorial "$POST_ID" --phase post-edit --body-file /tmp/raye-polished.txt --title "RAYE Announces One-Night Orchestral Show at Royal Albert Hall"
      - name: Guarded live text update, no change to cover or video
        shell: bash
        run: |
          python scripts/post.py set "$POST_ID" --body-file /tmp/raye-polished.txt --excerpt "RAYE will return to London's Royal Albert Hall on October 23 for a one-night orchestral concert."
      - name: Post-save gate and exact live verification
        shell: bash
        run: |
          python scripts/post.py gate "$POST_ID"
          python scripts/post.py verify "$POST_ID"
          python - <<'PY'
          import hashlib,os,sys
          sys.path.insert(0,'scripts')
          from post import desk_read
          p=next((x for x in desk_read()['posts'] if x.get('id')==os.environ['POST_ID']),None)
          if not p or p.get('status')!='live':raise SystemExit('RAYE_NOT_LIVE')
          actual=p.get('body') or ''
          expected=open('/tmp/raye-polished-sha.txt').read().strip()
          if hashlib.sha256(actual.encode()).hexdigest()!=expected:raise SystemExit('RAYE_LIVE_HASH_MISMATCH')
          if actual.split('\n\n')[3]!='[youtube:Iy2FoVeIUXs]':raise SystemExit('RAYE_VIDEO_MOVED')
          if (p.get('excerpt') or '')!="RAYE will return to London's Royal Albert Hall on October 23 for a one-night orchestral concert.":raise SystemExit('RAYE_EXCERPT_CHANGED')
          cover=p.get('cover') or {}
          if cover.get('src')!='photos/raye-radoslaw-zydowicz-lodz-live-2026.jpg' or cover.get('creditUrl')!='https://rozentuzjazmowany.pl/':raise SystemExit('RAYE_COVER_CHANGED_AFTER')
          print('RAYE_HUMAN_VOICE_LIVE_VERIFIED '+expected)
          PY
