name: RAYE photo source audit
on:
  push:
    branches: [editorial/raye-royal-albert-hall-2026-draft]
    paths: [.github/workflows/raye-photo-source-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe original images and agency asset HTML
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, re, html, struct
          urls={
            'DORK_O2_CONFETTI':'https://tgtumixhqhzrjubppeep.supabase.co/storage/v1/object/public/media/migrated/legacy/2026/329de3d442d8-raye_o2_arena_frances_beach-16.jpg',
            'DORK_READING':'https://readdork.com/reviews/live/reading-leeds-2026-raye',
            'LISTEN_HARDER':'https://listenharder.com/clients/raye/',
            'ORIGINAL_PREVIOUS':'https://prcdn.freetls.fastly.net/release_image/55377/1691/55377-1691-efa29c5aaf67fc596beb31d2beef6fb4-1500x1000.jpg',
            'DORK_O2_PAGE':'https://readdork.com/reviews/live/raye-at-the-o2-arena-2026',
          }
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=28) as r:
                data=r.read(7_000_000); ct=r.headers.get('content-type','')
              print('ASSET',name,'BYTES',len(data),'TYPE',ct,'URL',url)
              if 'image/' in ct:
                try:
                  from io import BytesIO
                  f=BytesIO(data)
                  assert f.read(2)==b'\xff\xd8'
                  while True:
                    b=f.read(1)
                    if not b:break
                    if b!=b'\xff': continue
                    marker=f.read(1)[0]
                    if marker in (0xd8,0xd9,0x01) or 0xd0<=marker<=0xd7:continue
                    n=struct.unpack('>H',f.read(2))[0]
                    if marker in (0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9):
                      x=f.read(5); print('DIM',name,int.from_bytes(x[3:5],'big'),int.from_bytes(x[1:3],'big'));break
                    f.seek(n-2,1)
                except Exception as e:print('JPEG_DIM_ERROR',name,str(e)[:120])
              elif 'html' in ct:
                h=html.unescape(data.decode('utf-8','ignore'))
                m=re.findall(r'(?:src|href|content)=["\']([^"\']+\.(?:jpg|jpeg|png|webp)(?:\?[^"\']*)?)["\']',h,re.I)
                hits=[x for x in m if any(t in x.lower() for t in ['raye','photo','press','2026','frances','otcher'])]
                print('IMAGE_LINKS',name,repr(hits[:30]))
                if name=='LISTEN_HARDER':
                  for token in ['Press Photo','Aliyah Otchere','Press Photos']:
                    i=h.find(token);print('HTML_CONTEXT',token,h[max(0,i-950):i+550].replace(chr(10),' ')[:1500])
            except Exception as e:print('ASSET_ERROR',name,type(e).__name__,str(e)[:240])
          PY
