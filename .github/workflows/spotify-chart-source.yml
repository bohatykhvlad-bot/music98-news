name: spotify-chart-source
on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-spotify-ranking.mjs"
      - "functions/lib/spotify-chart.js"
      - "functions/lib/spotify-source.js"
      - "functions/api/spotify-source.js"
      - "worker.js"
      - ".github/workflows/spotify-chart-source.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: spotify-chart-source
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate Musicrank Spotify Global Top 200
        run: node scripts/refresh-spotify-ranking.mjs
      - name: Publish validated Musicrank source edition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "music98 spotify source bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/spotify-chart.json
          if git diff --cached --quiet; then
            echo "Spotify source unchanged"
            gh workflow run apple-chart-source.yml --ref main
            exit 0
          fi
          git commit -m "chart: refresh Musicrank Spotify Top 200"
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              gh workflow run apple-chart-source.yml --ref main
              exit 0
            fi
            sleep 4
          done
          exit 1
