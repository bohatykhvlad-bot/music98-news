name: spotify-chart-source
on:
  push:
    branches: [main]
    paths:
      - "scripts/refresh-spotify-ranking.mjs"
      - "functions/lib/spotify-chart.js"
      - ".github/workflows/spotify-chart-source.yml"
  schedule:
    # More checks improve recovery when Spotify and its independent mirror publish at different times.
    # Every publish still requires 50 verified ranks; these runs use GitHub Actions, not Worker requests.
    - cron: "55 1,5,9,13,17,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: spotify-chart-source
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare public Spotify Top 50 sources (or validate Musicrank independently)
        run: node scripts/refresh-spotify-ranking.mjs
      - name: Publish only completely validated source edition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "music98 spotify source bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/spotify-chart.json
          if git diff --cached --quiet; then
            echo "Spotify source unchanged"
            exit 0
          fi
          git commit -m "chart: independently verified Spotify Top 50"
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              # GITHUB_TOKEN pushes cannot trigger downstream push workflows.
              # workflow_dispatch is explicitly supported for this token.
              gh workflow run apple-data.yml --ref main
              exit 0
            fi
            sleep 4
          done
          exit 1
