name: Tate McRae Housewife draft only
on:
  push:
    branches: [main]
    paths:
      - editorial/staged/tate-housewife-20261020.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  save-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate official Sony photo and create draft with full gates
        run: |
          python -m pip -q install Pillow
          python - <<'PY'
          import io, json, sys, urllib.request
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,'scripts')
          import post
          from datetime import datetime,timezone
          pid='tate-housewife-20261020'
          draft=Path('editorial/staged/tate-housewife-20261020.json')
          item=json.loads(draft.read_text(encoding='utf-8'))
          assert item['id']==pid and item['status']=='draft'
          assert item['type']=='news' and '[youtube:DPEodkHzH-s]' in item['body']
          assert item['cover']['credit']=='Pierre-Ange Carlotti'
          existing=next((p for p in post.desk_read()['posts'] if str(p.get('id'))==pid),None)
          if existing:
              assert existing.get('status')=='draft','Refusing to touch published content'
              assert existing.get('title')==item['title'],'Different draft with same ID'
              print('DRAFT_ALREADY_EXISTS',pid,'status=draft')
              raise SystemExit(0)
          source='https://prowly-prod.s3.eu-west-1.amazonaws.com/uploads/landing_page_image/image/712103/8a34a3c9391896971de9de7b6366bb08.jpg'
          req=urllib.request.Request(source,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=45) as response:
              data=response.read()
              ctype=response.headers.get('Content-Type','')
          image=Image.open(io.BytesIO(data))
          print('OFFICIAL_SONY_PRESS_PHOTO','size=',image.size,'bytes=',len(data),'content_type=',ctype)
          assert image.format=='JPEG'
          assert max(image.size)>=1920,'Official download is below preferred minimum resolution'
          assert len(data)>200000,'Downloaded press photo too small'
          item['cover']['src']=post.import_photo(source,'tate-housewife-pierre-ange-carlotti.jpg')
          staged=Path('/tmp/music98-tate-housewife-staged.json')
          staged.write_text(json.dumps(item,ensure_ascii=False,indent=2),encoding='utf-8')
          saved=post.cmd_create(str(staged))
          assert saved.get('status')=='draft' and saved.get('body')==item['body']
          assert saved.get('cover',{}).get('src')==item['cover']['src']
          assert saved.get('excerpt')==item['excerpt']
          post.cmd_preflight(pid)
          print('SAVED_DRAFT_VERIFIED',pid,'status=draft','media=youtube:DPEodkHzH-s')
          PY