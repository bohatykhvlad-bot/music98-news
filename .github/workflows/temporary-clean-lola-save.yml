name: Temporary clean Lola guarded save 
on:
  push:
    paths:
      - .github/workflows/temporary-clean-lola-save.yml
      - .github/staging/lola-clean-rebuild.json
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure editor key
        run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT full read of current saved Lola
        run: python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: POST-EDIT human-quality barrier on from-scratch candidate
        run: python scripts/editorial_readthrough.py --post lola26ebtour --file .github/staging/lola-clean-rebuild.json --phase post-edit --confirm-full-read
      - name: Extract exact approved body
        shell: python
        run: |
          import json
          from pathlib import Path
          p=json.loads(Path(".github/staging/lola-clean-rebuild.json").read_text(encoding="utf-8"))
          Path("/tmp/lola-clean.txt").write_text(p["body"],encoding="utf-8")
      - name: Text-only guarded save preserving current cover
        run: python scripts/post.py set lola26ebtour --body-file /tmp/lola-clean.txt --title "Lola Young Announces 2027 Everything Begins Tour" --excerpt "Lola Young has announced the Everything Begins Tour, a 17-date North American run that will bring her back to the United States and Canada in spring 2027."
      - name: Verify exact saved Lola
        run: |
          python scripts/post.py gate lola26ebtour
          python scripts/post.py preflight lola26ebtour
          python scripts/post.py show lola26ebtour
