name: Temporary clean Quavo guarded save
on:
  push:
    paths:
      - .github/workflows/temporary-clean-quavo-save.yml
      - .github/staging/quavo-clean-rebuild.json
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure editor key
        run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT full read of current saved Quavo
        run: python scripts/post.py editorial quavo26qromelife --phase pre-edit
      - name: POST-EDIT human-quality barrier on from-scratch candidate
        run: python scripts/editorial_readthrough.py --post quavo26qromelife --file .github/staging/quavo-clean-rebuild.json --phase post-edit --confirm-full-read --allow technical-credit --reason "Pharrell Williams' album-wide role is central to the QRÖMELIFE story"
      - name: Extract exact approved body
        shell: python
        run: |
          import json
          from pathlib import Path
          p=json.loads(Path(".github/staging/quavo-clean-rebuild.json").read_text(encoding="utf-8"))
          Path("/tmp/quavo-clean.txt").write_text(p["body"],encoding="utf-8")
      - name: Text-only guarded save preserving current cover
        run: python scripts/post.py set quavo26qromelife --body-file /tmp/quavo-clean.txt --title "QRÖMELIFE" --excerpt "Quavo has released *QRÖMELIFE*, a 14-track solo album executive produced by Pharrell Williams and the follow-up to 2023's *Rocket Power*."
      - name: Verify exact saved Quavo
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py preflight quavo26qromelife
          python scripts/post.py show quavo26qromelife
