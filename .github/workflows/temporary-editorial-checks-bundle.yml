name: Temporary editorial checks bundle
on:
  push:
    paths:
      - .github/workflows/temporary-editorial-checks-bundle.yml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build editorial checks bundle
        run: |
          mkdir -p /tmp/music98-editorial-checks/scripts /tmp/music98-editorial-checks/tests /tmp/music98-editorial-checks/.github/workflows
          cp music98-agent-operating-canon.md /tmp/music98-editorial-checks/
          cp scripts/editorial_readthrough.py /tmp/music98-editorial-checks/scripts/
          cp scripts/gate.py /tmp/music98-editorial-checks/scripts/
          cp scripts/preflight.py /tmp/music98-editorial-checks/scripts/
          cp scripts/test_editorial_readthrough.py /tmp/music98-editorial-checks/scripts/
          cp scripts/check_agent_write_path.py /tmp/music98-editorial-checks/scripts/
          cp tests/editorial-readthrough.test.mjs /tmp/music98-editorial-checks/tests/
          cp .github/workflows/check.yml /tmp/music98-editorial-checks/.github/workflows/
          cd /tmp
          zip -qr music98-editorial-checks.zip music98-editorial-checks
      - uses: actions/upload-artifact@v4
        with:
          name: music98-editorial-checks
          path: /tmp/music98-editorial-checks.zip
          if-no-files-found: error
