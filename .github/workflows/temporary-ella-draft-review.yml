name: Temporary encrypted Ella draft review
on:
  push:
    paths:
      - .github/workflows/temporary-ella-draft-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Securely export Ella article for editorial review
        shell: bash
        run: |
          node <<'NODE'
          const { publicEncrypt, constants, randomBytes, createCipheriv } = require("node:crypto");
          const { brotliCompressSync } = require("node:zlib");
          const pub = "-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA4LhEoCL0IP4H/Q05KOFt\nnn/8NDTUkdHJ3abvkGuPWCfHGpjsZa9zh6QzqPHSZPLVUsuU2k4RzRYvYpTmhCz2\nv96Wv5Iy8b8d4jy/qAjAfjB9VyWVg2JJjBaFWLdUWDb6eyd0sMQM1RBLH8PP1EcJ\n2AmW3uLffmfxhK5zVO4uxpr9/oYikpYsxereEu/kvVyLr0nUXUJj/jvDPs8eRTB+\nH9G+yM8iidJutmzkI+crApqYKVjoj70L2UG+mXZTr1Ol7JhxFi6PFjsOKy+OhF/H\nwzldFqGAJKbYdjpWFkTJ6N59xg/F2VoA8P8Bf/UtgCcevbRSIF1AREOfPDwZi8wS\nK5INhSk3efNJJqXDHv0g8swfR3E7Gp2XN3cAO/t2TeW3axz9H08vZs6XQP8oDC9N\njJNwzbP9RLFw1uzv8RpYG682a30OTfgaq7aPQC18wrxdN2htpTiv+qcxhYuUTeeI\nm285QkaW5Wg4NX+pZLJM5uoXRs8JOdg4T3dNHXn+C0CDAgMBAAE=\n-----END PUBLIC KEY-----";
          (async () => {
            const key = process.env.ADMIN_PASSWORD || "";
            if (!key) { console.log("ELLA_READER: ADMIN_PASSWORD_UNCONFIGURED"); process.exit(2); }
            const r = await fetch("https://music98.news/api/desk", {headers:{"X-Admin-Key":key,"Accept":"application/json"}});
            if (!r.ok) { console.log("ELLA_READER: AUTH_OR_FETCH_ERROR HTTP_" + r.status); process.exit(3); }
            const j=await r.json(); if(!Array.isArray(j.posts)){console.log("ELLA_READER: INVALID_RESPONSE");process.exit(4)}
            const matched=j.posts.filter(p=>/ella langley|choosin.g texas/i.test(p.title||""));
            if(matched.length!==1){console.log("ELLA_READER: MATCH_COUNT_" + matched.length + " TOTAL_" + j.posts.length);process.exit(5)}
            const p=matched[0];
            const fields={id:p.id,type:p.type,title:p.title,status:p.status,date:p.date,publishAt:p.publishAt,artist:p.artist,excerpt:p.excerpt,body:p.body,cover:p.cover,media:p.media,photos:p.photos};
            const packed=brotliCompressSync(Buffer.from(JSON.stringify(fields),"utf8"));
            const secret=randomBytes(32), iv=randomBytes(12), cipher=createCipheriv("aes-256-gcm",secret,iv);
            const ciphertext=Buffer.concat([cipher.update(packed),cipher.final()]),tag=cipher.getAuthTag();
            const wrapped=publicEncrypt({key:pub,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"},secret);
            console.log("ELLA_READER: ENCRYPTED_OK ARTICLE_WILL_NOT_BE_LOGGED");
            const output=Buffer.concat([Buffer.from("M98E01"),wrapped,iv,tag,ciphertext]).toString("base64");
            console.log("M98_ENCRYPTED_ARTICLE="+output);
          })().catch(()=>{console.log("ELLA_READER: UNEXPECTED_ERROR");process.exit(6)});
          
          NODE
