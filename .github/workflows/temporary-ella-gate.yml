name: Temporary Ella editorial gate
on:
  push:
    paths:
      - .github/workflows/temporary-ella-gate.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify reviewed Ella draft against site editorial gate
        shell: bash
        run: |
          test -n "$ADMIN_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          chmod 600 .env
          set +e
          python scripts/gate.py --post ella26choosintexas > /tmp/ella_gate_result.log 2>&1
          outcome=$?
          set -e
          GATE_OUTCOME="$outcome" python - <<'PY'
          import os,re
          from pathlib import Path
          s=Path('/tmp/ella_gate_result.log').read_text(errors='replace')
          issues=[]
          for line in s.splitlines():
              t=line.strip()
              if t.startswith(('X ','! ')):
                  m=re.match(r'[X!]\s+([a-zA-Z][a-zA-Z0-9-]+)',t)
                  if m: issues.append(m.group(1))
          print('ELLA_GATE:', 'PASS' if os.environ['GATE_OUTCOME']=='0' else 'FAIL')
          fails=[];warns=[];detail=[]
          for line in s.splitlines():
              t=line.strip()
              m=re.match(r'([X!])\s+([a-zA-Z][a-zA-Z0-9-]+)\s+(.+)',t)
              if not m:continue
              severity,code,message=m.groups()
              (fails if severity=='X' else warns).append(code)
              if code=='date-unregistered':
                  token=re.search(r"'([^']+)' is not",message)
                  if token:detail.append('date='+token.group(1))
              if code in ('short-paragraph','text-wall','thin-finale'):
                  loc=re.search(r'paragraph[s]? [0-9]+(?:-[0-9]+)?(?: is [0-9]+ words)?',message)
                  if loc:detail.append(code+' '+loc.group(0))
          print('ELLA_GATE_FAIL_CODES:',','.join(fails) if fails else 'none')
          print('ELLA_GATE_WARN_CODES:',','.join(warns) if warns else 'none')
          print('ELLA_GATE_SAFE_DETAILS:', '; '.join(detail))
          print('ELLA_GATE_LOG_LINES:',len(s.splitlines()))
          PY
          exit "$outcome"

# Re-run private editorial check after verified date registry update.

      - name: Audit saved Ella last photo metadata without revealing draft text
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const key=process.env.ADMIN_PASSWORD;
            const res=await fetch("https://music98.news/api/desk",{headers:{"X-Admin-Key":key},cache:"no-store"});
            if(!res.ok)throw Error("desk fetch "+res.status);
            const obj=await res.json();
            const p=obj.posts.find(p=>p.id==="ella26choosintexas");
            if(!p)throw Error("draft missing");
            const matches=[...(p.body||"").matchAll(/\[photo:([^|\]]+)\|([^|\]]+)\|([^\]]*)\]/g)];
            const last=matches[matches.length-1];
            console.log("ELLA_AUDIT STATUS="+p.status+" PHOTO_COUNT="+matches.length);
            console.log("ELLA_AUDIT LAST_PHOTO_URL="+(last?.[1]||"none"));
            console.log("ELLA_AUDIT LAST_PHOTO_AUTHOR="+(last?.[2]||"none"));
            console.log("ELLA_AUDIT LAST_PHOTO_CREDIT_URL="+(last?.[3]||"none"));
            console.log("ELLA_AUDIT BODY_PARAGRAPHS="+String(p.body||"").split("\n\n").length);
          })().catch(e=>{console.log("ELLA_AUDIT_ERROR "+e.message);process.exitCode=1});
          NODE
