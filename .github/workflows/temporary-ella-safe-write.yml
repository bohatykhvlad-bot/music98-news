name: Temporary Ella secure update
on:
  push:
    paths:
      - .github/workflows/temporary-ella-safe-write.yml
      - .github/ella-reviewed-update.enc.b64
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate securely wrapped transport key and photo probe
        shell: bash
        if: ${{ !hashFiles('.github/ella-reviewed-update.enc.b64') }}
        run: |
          node <<'NODE'
          const {scryptSync,publicEncrypt,constants}=require("node:crypto");
          const pub="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAy0aRjULcX0D9rJu+WUuK\nEPOHzokW0hECKkWIsqyC745iEvKuJS+COWU1tdWHIoB7dWaqGcCzmD+s4kuMKUaK\nYpwjrcYOgWwjVV2COWo6Ox4fdZceYDiuQid+ZZc6lWe2LTcEWRS2F0NhQaIiyoin\nYVHTpWG6OYY1+PE6n4LxEK3XGj6jlUXra30PB06eLwxt7wmmXcw0qg7YVNKAQcMm\nAyoVumhCe2yDZlG0r4qAYoxcCCEORc37qxBDDBLZq9spfv/5ZjUPVVBYXPgZOUDA\nIxiUKTE3YV1XaR8mSrJgGUnc2OtsB52efoUCW8MaD2JmHYLXkU4z2cGGUw2Ht7qc\nUYNdLnD2U9n2rAajQX1EF4hoDafrekIYYgu8gReVMc9An5sWpJd0JuXgE/WM+PWh\najfeQF5oLFywum2fQbJl7omHg/I7l9VrTPCUiV6Ha6vmSsLg2I1sGDDDpFoH3a+S\n9Wj/67AZ7woo9ajy8T1mqzTOc0Rsm/3zwoyca+0devijAgMBAAE=\n-----END PUBLIC KEY-----";
          (async()=>{
          const secret=process.env.ADMIN_PASSWORD;
          if(!secret)throw Error("ADMIN_PASSWORD unavailable");
          const key=scryptSync(secret,"music98-ella-editorial-2026-10-03-v2",32);
          const wrapped=publicEncrypt({key:pub,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"},key);
          console.log("ELLA_DERIVED_KEY_WRAPPED="+wrapped.toString("base64"));
          for(const name of ["EllaLangley_01.jpg","EllaLangley_02.jpg","EllaLangley_01-1024x640.jpg"]){
          const url="https://charlatan.ca/wp-content/uploads/2026/07/"+name;
          try{const r=await fetch(url,{headers:{"User-Agent":"Mozilla/5.0"}});if(!r.ok){console.log("PHOTO_PROBE "+name+" HTTP "+r.status);continue;}
          const arr=new Uint8Array(await r.arrayBuffer());
          let width=0,height=0;
          for(let i=2;i<arr.length-9;){if(arr[i]!==255){i++;continue;}const marker=arr[i+1],seg=(arr[i+2]<<8)|arr[i+3];if([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9].includes(marker)){height=(arr[i+5]<<8)|arr[i+6];width=(arr[i+7]<<8)|arr[i+8];break}i+=2+Math.max(2,seg)}
          console.log("PHOTO_PROBE "+name+" HTTP "+r.status+" TYPE "+r.headers.get("content-type")+" BYTES "+arr.length+" DIM "+width+"x"+height);
          }catch(e){console.log("PHOTO_PROBE "+name+" ERROR "+e.name)}
          }
          })().catch(e=>{console.log("KEY_OR_PROBE_ERROR "+String(e.message).slice(0,100));process.exit(1)});
          
          NODE
      - name: Apply authenticated encrypted Ella-only editorial patch
        if: ${{ hashFiles('.github/ella-reviewed-update.enc.b64') != '' }}
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("node:fs");
          const {scryptSync,createDecipheriv,createHash}=require("node:crypto");
          const {brotliDecompressSync}=require("node:zlib");
          const sha=s=>createHash("sha256").update(s).digest("hex");
          (async()=>{
            const secret=process.env.ADMIN_PASSWORD;
            if(!secret)throw Error("NO_EDITOR_CREDENTIAL");
            const key=scryptSync(secret,"music98-ella-editorial-2026-10-03-v2",32);
            const raw=Buffer.from(fs.readFileSync(".github/ella-reviewed-update.enc.b64","utf8").trim(),"base64");
            if(raw.length<64||raw.subarray(0,9).toString()!=="M98PATCH1")throw Error("WRONG_PATCH_FORMAT");
            const iv=raw.subarray(9,21),encrypted=raw.subarray(21);
            const cipher=createDecipheriv("aes-256-gcm",key,iv);
            cipher.setAuthTag(encrypted.subarray(encrypted.length-16));
            const packed=Buffer.concat([cipher.update(encrypted.subarray(0,encrypted.length-16)),cipher.final()]);
            const patch=JSON.parse(brotliDecompressSync(packed).toString("utf8"));
            if(patch.id!=="ella26choosintexas"||patch.originalStatus!=="draft")throw Error("WRONG_ARTICLE");
            const headers={"X-Admin-Key":secret,"Accept":"application/json","Content-Type":"application/json"};
            const get=async()=>{
              const r=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
              if(!r.ok)throw Error("GET_DESK_"+r.status);
              const j=await r.json();if(!Array.isArray(j.posts))throw Error("INVALID_DESK");
              return j;
            };
            const before=await get();
            const post=before.posts.find(p=>p.id===patch.id);
            if(!post||post.status!=="draft")throw Error("ARTICLE_NOT_DRAFT");
            if(sha(post.body||"")!==patch.originalBodySHA256)throw Error("DRAFT_EDITED_SINCE_REVIEW_NO_OVERWRITE");
            const snapshot=JSON.stringify(before.posts.filter(p=>p.id!==patch.id));
            const coverSnapshot=JSON.stringify(post.cover);
            const media=(post.body.match(/\[(?:photo|youtube|apple|tiktok|instagram):/g)||[]).length;
            const paragraphs=post.body.split("\n\n");
            for(const op of patch.changes.slice().sort((a,b)=>b.start-a.start)){
               if(!Number.isInteger(op.start)||!Number.isInteger(op.end)||op.start<0||op.end<op.start||op.end>paragraphs.length||!Array.isArray(op.new)||!op.new.every(x=>typeof x==="string"))throw Error("BAD_PATCH");
               paragraphs.splice(op.start,op.end-op.start,...op.new);
            }
            const updated=paragraphs.join("\n\n");
            if(sha(updated)!==patch.updatedBodySHA256)throw Error("PATCH_OUTPUT_MISMATCH");
            if(!updated.startsWith(patch.excerpt))throw Error("EXCERPT_NO_LONGER_LITERAL");
            if((updated.match(/\[(?:photo|youtube|apple|tiktok|instagram):/g)||[]).length!==media)throw Error("MEDIA_COUNT_CHANGED");
            const photo=updated.match(/\[photo:(https:\/\/[^|]+)\|Miriam Visser\|/);
            if(!photo)throw Error("NO_NEW_GUITAR_PHOTO");
            const image=await fetch(photo[1],{method:"HEAD"});
            if(!image.ok)throw Error("PHOTO_NOT_ACCESSIBLE_"+image.status);
            post.body=updated;post.excerpt=patch.excerpt;
            if(JSON.stringify(post.cover)!==coverSnapshot)throw Error("COVER_CHANGED");
            const saved=await fetch("https://music98.news/api/desk",{method:"POST",headers,body:JSON.stringify({posts:before.posts})});
            if(!saved.ok)throw Error("SAVE_FAILED_"+saved.status);
            const after=await get(),target=after.posts.find(p=>p.id===patch.id);
            if(!target||target.status!=="draft"||sha(target.body||"")!==patch.updatedBodySHA256||target.excerpt!==patch.excerpt)throw Error("POST_SAVE_VERIFY_FAILED");
            if(JSON.stringify(after.posts.filter(p=>p.id!==patch.id))!==snapshot)throw Error("NON_TARGET_POST_CHANGED");
            if(JSON.stringify(target.cover)!==coverSnapshot)throw Error("COVER_CHANGED_AFTER");
            console.log("ELLA_DRAFT_UPDATE VERIFIED ID "+patch.id+" ORIGINALS_UNCHANGED true STATUS draft PARAGRAPHS "+target.body.split("\n\n").length+" PHOTO_SOURCE_REACHABLE true");
          })().catch(e=>{console.error("ELLA_DRAFT_UPDATE FAILED "+String(e.message).slice(0,150));process.exit(1)});
          
          NODE
