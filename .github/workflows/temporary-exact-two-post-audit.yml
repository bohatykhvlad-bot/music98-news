name: Temporary exact two-post audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-exact-two-post-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare exact current live copies
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          python scripts/post.py show shakira26amazonmadrid > /tmp/shakira-show.txt
          python scripts/post.py show auvictoriafol26r1 > /tmp/victoria-show.txt
          node <<'NODE'
          const fs=require("fs");
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Accept":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const r=await fetch("https://music98.news/api/desk?audit="+Date.now(),{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            const d=await r.json();
            const ids=["shakira26amazonmadrid","auvictoriafol26r1"];
            const posts=ids.map(id=>d.posts.find(p=>p.id===id));
            if(posts.some(p=>!p)) throw Error("MISSING");
            fs.writeFileSync("/tmp/current-two-live.json",JSON.stringify({posts},null,2));
            const staged=JSON.parse(JSON.stringify({posts}));
            staged.posts.forEach(p=>p.status="draft");
            fs.writeFileSync("/tmp/current-two-staged.json",JSON.stringify(staged,null,2));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Print exact current Shakira body
        run: cat /tmp/shakira-show.txt
      - name: Print exact current Victoria body
        run: cat /tmp/victoria-show.txt
      - name: Mandatory second readthrough on exact live bodies
        shell: bash
        run: |
          set -euo pipefail
          python scripts/editorial_readthrough.py --post shakira26amazonmadrid --file /tmp/current-two-live.json --confirm-full-read
          python scripts/editorial_readthrough.py --post auvictoriafol26r1 --file /tmp/current-two-live.json --confirm-full-read
      - name: Gate both exact current live bodies
        shell: python
        run: |
          import importlib.util,json,sys
          spec=importlib.util.spec_from_file_location("gate","scripts/gate.py")
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g);g.CHECK_IDS=False
          data=json.load(open("/tmp/current-two-live.json",encoding="utf-8"))
          bad=False
          for p in data["posts"]:
              fails,warns,info=g.check_post(p,strict=True)
              print("POST",p["id"])
              for k,v in info:
                  if k in ("length","dates","numbers"): print("INFO",k,v)
              for k,v in warns: print("WARN",k,v)
              for k,v in fails: print("FAIL",k,v)
              print("GATE","PASS" if not fails else "FAIL")
              bad=bad or bool(fails)
          if bad: sys.exit(1)
      - name: Preflight staged Shakira exact body
        continue-on-error: true
        run: python scripts/preflight.py --post shakira26amazonmadrid --file /tmp/current-two-staged.json --expected-media 1 --min-words 300
      - name: Preflight staged Victoria exact body
        continue-on-error: true
        run: python scripts/preflight.py --post auvictoriafol26r1 --file /tmp/current-two-staged.json --expected-media 1 --min-words 450
