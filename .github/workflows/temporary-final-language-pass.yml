name: Temporary final language pass
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-final-language-pass.yml]
permissions:
  contents: write
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update only the two requested drafts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const revisions = {
            shakira26amazonmadrid: {
              excerpt: `Shakira's October 3 Madrid concert became Amazon Music's most-viewed livestream by a female artist, with Dua Lipa joining her for a surprise acoustic duet on "Antología."`,
              body: `Shakira's October 3 Madrid concert became Amazon Music's most-viewed livestream by a female artist, with Dua Lipa joining her for a surprise acoustic duet on "Antología." Amazon announced the record the following day but did not publish a viewer total.

The show streamed worldwide through Amazon Music, Prime Video and Twitch, making it Shakira's first full-concert global livestream. The record is specific to Amazon Music rather than an all-platform viewing record. Within that category, no female artist has drawn a larger livestream audience on the service. The broadcast was also the centerpiece of Amazon Music's 2026 Women Shaping Latin Music campaign.

The concert took place at Shakira Stadium, the temporary venue built inside Madrid's Iberdrola Music complex for the residency. It can hold more than 50,000 people. Dua Lipa joined Shakira for an acoustic "Antología," the ballad from Shakira's 1995 album *Pies Descalzos*. Dua had already performed the song at her Bogotá concert in 2025, but Madrid was the first time the two sang it together.

[ig:p:DeFRhLolil0|@shakira|https://www.instagram.com/p/DeFRhLolil0/]

Shakira opened the Madrid residency on September 18. It was announced as three shows, expanded to 12, and on October 5 Live Nation added a 13th and final date for October 12 after further demand. The previously announced October 9, 10 and 11 concerts remain on the schedule before that final night.

The residency has been built around more than the concerts themselves. Alongside the temporary stadium, organizers created Macondo Park, a surrounding site with exhibitions, workshops and programming centered on Latin culture. The October 3 stream carried one of those Madrid nights to a global audience, while the record itself remains an Amazon Music distinction. The final Madrid show is set for October 12, ending a residency that started as three announced dates and grew to 13.`
            },
            auvictoriafol26r1: {
              excerpt: `Victoria Monét has released her second album *Frequency Of Love*, a 22-song record that moves between R&B, house, funk and acoustic soul.`,
              body: `Victoria Monét has released her second album *Frequency Of Love*, a 22-song record that moves between R&B, house, funk and acoustic soul. Released October 2, it is her first full-length since *JAGUAR II*, which won Best R&B Album as Monét took Best New Artist at the 2024 Grammys.

Between those records, Monét went to culinary school. She graduated from the Institute of Culinary Education in May 2026 and completed an externship at Verse L.A. while rehearsing for Bruno Mars' European stadium tour. She has said cooking helped her reconnect with making something simply because she wanted to make it after the long promotional stretch that followed her Grammy breakthrough.

At first, *Frequency Of Love* was supposed to lean much harder into yacht rock. Monét got there by tracing the musicians who played on records by Michael Jackson and Quincy Jones, which sent her deeper into Toto and the sound around it. Culinary school kept widening the palette. On pasta days she listened to Italian music. When the class made Jamaican food, she listened to Jamaican music. The album followed that curiosity instead of staying inside one style.

A few songs make the range clear without turning the record into a guest list. "Reach Out," produced by KAYTRANADA and D'Mile, heads toward the dance floor. "That's Why I Love You" with Bruno Mars draws on bolero-pop, while the SZA collaboration "See You In My Dreams" settles into hazier R&B. "Reach Out" also has a longer history. Monét recorded it around the period when the *JAGUAR II* deluxe edition was being assembled, then held it back because she thought it deserved more than a bonus-track slot. Dave Meyers directed the video at the Salk Institute in La Jolla.

[youtube:h99lQg2zSl0]

The title does not describe a record of uncomplicated love songs. Monét has talked about romance here alongside heartbreak, risk, self-love and motherhood. Her daughter Hazel Monét appears with Leon Thomas on "You Mean The World To Me," giving the album a family connection without separating that song from the rest of its emotional range.

The track count changes by format. Apple Music and Sony list 22 songs for the digital album, while Monét's official store describes the first-edition CD and standard vinyl pressings as 17-track releases. Anyone buying a physical copy will therefore get a shorter sequence than the full digital version.

Monét begins the *Frequency Of Love* Tour on October 27 in Raleigh, with the announced North American run ending December 17 in San Francisco. She is also launching the Frequency Of Love Foundation, which plans youth programs around food, agriculture, cooking and wellness. Its workshops are designed to connect food with science, gut health, brain function and creativity. Fans buying tour tickets can add $1 at checkout to support the foundation's community garden programs.`
            }
          };
          const key=process.env.ADMIN_PASSWORD;
          if(!key) throw Error("NO_ADMIN_PASSWORD");
          const headers={"X-Admin-Key":key,"Accept":"application/json","Content-Type":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const g=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
            if(!g.ok) throw Error("GET_"+g.status);
            const data=await g.json();
            const ids=Object.keys(revisions);
            const beforeOthers=JSON.stringify((data.posts||[]).filter(p=>!ids.includes(p.id)));
            for(const id of ids){
              const matches=data.posts.filter(p=>p.id===id);
              if(matches.length!==1 || matches[0].status!=="draft") throw Error("TARGET_NOT_UNIQUE_DRAFT_"+id);
              matches[0].body=revisions[id].body;
              matches[0].excerpt=revisions[id].excerpt;
            }
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers,body:JSON.stringify({posts:data.posts,touched:ids})});
            if(!s.ok) throw Error("SAVE_"+s.status);
            const v=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
            const after=await v.json();
            if(JSON.stringify(after.posts.filter(p=>!ids.includes(p.id)))!==beforeOthers) throw Error("OTHER_POST_CHANGED");
            for(const id of ids){
              const got=after.posts.find(p=>p.id===id);
              if(!got || got.status!=="draft" || got.body!==revisions[id].body || got.excerpt!==revisions[id].excerpt) throw Error("VERIFY_"+id);
            }
            console.log("TWO_DRAFTS_UPDATED_AND_VERIFIED");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Run gate and preflight for Shakira
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          python scripts/post.py gate shakira26amazonmadrid
          MUSIC98_KEY="$ADMIN_PASSWORD" python scripts/preflight.py --post shakira26amazonmadrid --expected-media 1 --min-words 300
      - name: Run gate and preflight for Victoria
        shell: bash
        run: |
          set -euo pipefail
          python scripts/post.py gate auvictoriafol26r1
          MUSIC98_KEY="$ADMIN_PASSWORD" python scripts/preflight.py --post auvictoriafol26r1 --expected-media 1 --min-words 450
