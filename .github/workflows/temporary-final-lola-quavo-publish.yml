name: Temporary final Lola Quavo editorial publish
# rerun after Lola gate-language correction
on:
  push:
    paths:
      - .github/workflows/temporary-final-lola-quavo-publish.yml
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PRE-EDIT current Lola
        run: python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: PRE-EDIT current Quavo
        run: python scripts/post.py editorial quavo26qromelife --phase pre-edit
      - name: Lola final full read pass one
        run: python scripts/editorial_readthrough.py --post lola26ebtour --file .github/staging/lola-20261007-final.json --phase post-edit --confirm-full-read
      - name: Lola final full read pass two
        run: python scripts/editorial_readthrough.py --post lola26ebtour --file .github/staging/lola-20261007-final.json --phase post-edit --confirm-full-read
      - name: Quavo final full read pass one
        run: python scripts/editorial_readthrough.py --post quavo26qromelife --file .github/staging/quavo-20261007-final.json --phase post-edit --confirm-full-read
      - name: Quavo final full read pass two
        run: python scripts/editorial_readthrough.py --post quavo26qromelife --file .github/staging/quavo-20261007-final.json --phase post-edit --confirm-full-read --allow technical-credit --reason "Pharrell Williams' album-wide creative role is central and appears once"
      - name: Save final Lola draft
        run: python scripts/post.py replace-draft lola26ebtour --file .github/staging/lola-20261007-final.json
      - name: Save final Quavo draft and official cover
        run: python scripts/post.py replace-draft quavo26qromelife --file .github/staging/quavo-20261007-final.json --allow technical-credit --reason "Pharrell Williams' album-wide creative role is central and appears once"
      - name: Lola gate
        run: python scripts/post.py gate lola26ebtour
      - name: Lola preflight
        run: python scripts/post.py preflight lola26ebtour
      - name: Quavo gate
        run: python scripts/post.py gate quavo26qromelife
      - name: Quavo preflight
        run: python scripts/post.py preflight quavo26qromelife
      - name: Publish Lola
        run: python scripts/post.py publish lola26ebtour
      - name: Publish Quavo
        run: python scripts/post.py publish quavo26qromelife
      - name: Verify Lola
        run: python scripts/post.py verify lola26ebtour
      - name: Verify Quavo
        run: python scripts/post.py verify quavo26qromelife
