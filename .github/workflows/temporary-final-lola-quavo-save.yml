name: Temporary final Lola Quavo editorial save
on:
  push:
    paths:
      - .github/workflows/temporary-final-lola-quavo-save.yml
      - .github/staging/lola-editorial-final.json
      - .github/staging/quavo-editorial-final.json
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure editor key
        run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env

      - name: PRE-EDIT full read current Lola
        run: python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: PRE-EDIT full read current Quavo
        run: python scripts/post.py editorial quavo26qromelife --phase pre-edit

      - name: POST-EDIT human-quality barrier Lola
        run: python scripts/editorial_readthrough.py --post lola26ebtour --file .github/staging/lola-editorial-final.json --phase post-edit --confirm-full-read
      - name: POST-EDIT human-quality barrier Quavo
        run: python scripts/editorial_readthrough.py --post quavo26qromelife --file .github/staging/quavo-editorial-final.json --phase post-edit --confirm-full-read --allow technical-credit --reason "Pharrell Williams' album-wide role is central to the release story"

      - name: Extract approved bodies
        shell: python
        run: |
          import json
          from pathlib import Path
          for src,dst in [
              (".github/staging/lola-editorial-final.json","/tmp/lola-final.txt"),
              (".github/staging/quavo-editorial-final.json","/tmp/quavo-final.txt"),
          ]:
              p=json.loads(Path(src).read_text(encoding="utf-8"))
              Path(dst).write_text(p["body"],encoding="utf-8")

      - name: Save Lola text only
        run: python scripts/post.py set lola26ebtour --body-file /tmp/lola-final.txt --title "Lola Young Announces 2027 Everything Begins Tour" --excerpt "Lola Young has announced the Everything Begins Tour, a 17-date North American headline run scheduled for spring 2027 and her first full tour of the region since she cleared her live calendar in 2025."

      - name: Verify saved Lola
        run: |
          python scripts/post.py gate lola26ebtour
          python scripts/post.py preflight lola26ebtour
          python scripts/post.py show lola26ebtour

      - name: Save Quavo text only
        run: python scripts/post.py set quavo26qromelife --body-file /tmp/quavo-final.txt --title "QRÖMELIFE" --excerpt "Quavo has released *QRÖMELIFE*, his third solo album, a 14-track record executive produced by Pharrell Williams and developed with him over more than a year and a half."

      - name: Verify saved Quavo
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py preflight quavo26qromelife
          python scripts/post.py show quavo26qromelife
