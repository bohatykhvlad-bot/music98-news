name: Temporary final Lola Quavo verify
on:
  push:
    paths:
      - .github/workflows/temporary-final-lola-quavo-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Fresh Lola read and checks
        run: |
          python scripts/post.py gate lola26ebtour
          python scripts/post.py preflight lola26ebtour
          python scripts/post.py show lola26ebtour
      - name: Fresh Quavo read and checks
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py preflight quavo26qromelife
          python scripts/post.py show quavo26qromelife
