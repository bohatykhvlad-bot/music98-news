name: Temporary final prose reread and live update
on:
  push:
    paths:
      - .github/workflows/temporary-final-prose-reread.yml
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Read current live versions
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Read exact replacement versions
        run: |
          python scripts/post.py editorial quavo26qromelife --body-file .github/staging/quavo-prose-cleanup.txt --title "QRÖMELIFE" --phase post-edit
          python scripts/post.py editorial lola26ebtour --body-file .github/staging/lola-prose-cleanup.txt --title "Lola Young Announces 2027 Everything Begins Tour" --phase post-edit
      - name: Update Quavo text
        run: |
          python scripts/post.py set quavo26qromelife --body-file .github/staging/quavo-prose-cleanup.txt --title "QRÖMELIFE" --excerpt "Quavo has released *QRÖMELIFE*, a 14-track solo album that follows 2023's *Rocket Power*."
      - run: sleep 70
      - name: Refresh Lola read stamps
        run: |
          python scripts/post.py editorial lola26ebtour --phase pre-edit
          python scripts/post.py editorial lola26ebtour --body-file .github/staging/lola-prose-cleanup.txt --title "Lola Young Announces 2027 Everything Begins Tour" --phase post-edit
      - name: Update Lola text
        run: |
          python scripts/post.py set lola26ebtour --body-file .github/staging/lola-prose-cleanup.txt --title "Lola Young Announces 2027 Everything Begins Tour" --excerpt "Lola Young has announced the Everything Begins Tour, a 17-date North American headline run set for spring 2027."
      - run: sleep 70
      - name: Full reread of exact saved live versions
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Final checks
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py gate lola26ebtour
          python scripts/post.py verify quavo26qromelife
          python scripts/post.py verify lola26ebtour
