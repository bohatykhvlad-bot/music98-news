name: Temporary final prose cleanup and Teddy title fix
on:
  push:
    paths:
      - .github/workflows/temporary-final-prose-teddy-fix.yml
      - .github/staging/quavo-final-clean.txt
      - .github/staging/lola-final-clean.txt
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env

      - name: Full PRE-EDIT read of exact live texts
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit

      - name: Full POST-EDIT read of proposed texts
        run: |
          python scripts/post.py editorial quavo26qromelife --body-file .github/staging/quavo-final-clean.txt --title "QRÖMELIFE" --phase post-edit
          python scripts/post.py editorial lola26ebtour --body-file .github/staging/lola-final-clean.txt --title "Lola Young Announces 2027 Everything Begins Tour" --phase post-edit

      - name: Save Quavo
        run: |
          python scripts/post.py set quavo26qromelife \
            --body-file .github/staging/quavo-final-clean.txt \
            --title "QRÖMELIFE" \
            --excerpt "Quavo has released *QRÖMELIFE*, a 14-track solo album that follows 2023's *Rocket Power*. The earlier record stayed close to the grief after Takeoff's death."

      - run: sleep 70

      - name: Refresh Lola stamps and save
        run: |
          python scripts/post.py editorial lola26ebtour --phase pre-edit
          python scripts/post.py editorial lola26ebtour --body-file .github/staging/lola-final-clean.txt --title "Lola Young Announces 2027 Everything Begins Tour" --phase post-edit
          python scripts/post.py set lola26ebtour \
            --body-file .github/staging/lola-final-clean.txt \
            --title "Lola Young Announces 2027 Everything Begins Tour" \
            --excerpt "Lola Young has announced the Everything Begins Tour, a 17-date North American headline run set for spring 2027."

      - run: sleep 70

      - name: Correct Teddy Swims single title only
        shell: python
        run: |
          import json,os,time,urllib.request
          key=os.environ["ADMIN_PASSWORD"].strip()
          url="https://music98.news/api/desk"
          headers={"X-Admin-Key":key,"Accept":"application/json","Content-Type":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"}
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=60) as r: d=json.loads(r.read().decode())
          p=next((x for x in d.get("posts",[]) if str(x.get("id"))=="aurts21r1"),None)
          if not p: raise SystemExit("Teddy post missing")
          if p.get("status")!="live" or p.get("type")!="release" or str(p.get("rtype")).lower()!="single" or p.get("artist")!="Teddy Swims":
              raise SystemExit("Teddy identity/state mismatch")
          if p.get("title") not in ("UGLY","Perfect Man"): raise SystemExit("unexpected Teddy title")
          if "Perfect Man" not in str(p.get("body") or ""): raise SystemExit("Perfect Man not present in Teddy body")
          p["title"]="Perfect Man"
          data=json.dumps({"posts":d["posts"]},ensure_ascii=True).encode()
          req=urllib.request.Request(url,data=data,headers=headers,method="POST")
          with urllib.request.urlopen(req,timeout=90) as r:
              out=json.loads(r.read().decode())
          if not out.get("ok"): raise SystemExit("Teddy write failed")
          print("TEDDY_TITLE_WRITE ok")

      - run: sleep 70

      - name: Final full reread and gates
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py gate lola26ebtour
          python scripts/post.py verify quavo26qromelife
          python scripts/post.py verify lola26ebtour

      - name: Exact raw residue audit and Teddy verification
        shell: python
        run: |
          import json,os,re,urllib.request
          key=os.environ["ADMIN_PASSWORD"].strip()
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r: d=json.loads(r.read().decode())
          ent=re.compile(r"&(?:#\d+|#x[0-9A-Fa-f]+|[A-Za-z][A-Za-z0-9]+);")
          for pid in ("quavo26qromelife","lola26ebtour"):
              p=next(x for x in d["posts"] if str(x.get("id"))==pid)
              for field in ("title","excerpt","body"):
                  s=str(p.get(field) or "")
                  if ent.search(s) or re.search(r"\\[nrt]",s) or "\u00a0" in s or "\u200b" in s:
                      raise SystemExit(f"{pid} {field}: residue detected")
              print("RAW_CLEAN",pid)
          t=next(x for x in d["posts"] if str(x.get("id"))=="aurts21r1")
          if t.get("title")!="Perfect Man" or t.get("rtype")!="Single":
              raise SystemExit("Teddy title verification failed")
          print("TEDDY_VERIFIED title=Perfect Man rtype=Single")
