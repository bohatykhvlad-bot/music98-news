name: Temporary final Quavo teaser cleanup
on:
  push:
    paths:
      - .github/workflows/temporary-final-quavo-teaser-cleanup.yml
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT current Quavo
        run: python scripts/post.py editorial quavo26qromelife --phase pre-edit
      - name: POST-EDIT exact Quavo final
        run: python scripts/post.py editorial quavo26qromelife --body-file .github/staging/quavo-final-teaser-cleanup.txt --title "QRÖMELIFE" --phase post-edit
      - name: Save Quavo final body and teaser
        run: |
          python scripts/post.py set quavo26qromelife \
            --body-file .github/staging/quavo-final-teaser-cleanup.txt \
            --title "QRÖMELIFE" \
            --excerpt "Quavo has released *QRÖMELIFE*, a 14-track solo album that follows 2023's *Rocket Power*. The earlier record was shaped far more directly by Takeoff's death."
      - run: sleep 70
      - name: Final full reread of both live texts
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Gate and verify both
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py gate lola26ebtour
          python scripts/post.py verify quavo26qromelife
          python scripts/post.py verify lola26ebtour
