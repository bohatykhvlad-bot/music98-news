name: Temporary fix Ella ASCII quotes
on:
  push:
    paths:
      - .github/workflows/temporary-fix-ella-ascii-quotes.yml
      - .github/scripts/fix_ella_ascii_quotes.py
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/fix_ella_ascii_quotes.py
