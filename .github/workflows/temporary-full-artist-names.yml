name: Temporary full artist names
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-full-artist-names.yml]
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Update two live posts
        run: |
          node <<'NODE'
          const ids=["shakira26amazonmadrid","auvictoriafol26r1"];
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Content-Type":"application/json","Accept":"application/json"};
          (async()=>{
            const r=await fetch("https://music98.news/api/desk",{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET");
            const d=await r.json();
            const sh=d.posts.find(p=>p.id===ids[0]);
            const vi=d.posts.find(p=>p.id===ids[1]);
            if(!sh||!vi) throw Error("MISSING");
            sh.body=sh.body.split("Dua had").join("Dua Lipa had");
            sh.body=sh.body.split("introduced Dua by").join("introduced Dua Lipa by");
            vi.body=vi.body.split("Monét ").join("Victoria Monét ");
            vi.body=vi.body.split("Monét's").join("Victoria Monét's");
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers:h,body:JSON.stringify({posts:d.posts,touched:ids})});
            if(!s.ok) throw Error("SAVE");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
