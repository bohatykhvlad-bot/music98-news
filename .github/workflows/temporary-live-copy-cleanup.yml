name: Temporary Victoria physical-edition paragraph fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-live-copy-cleanup.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Replace only Victoria physical-edition paragraph
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const id="auvictoriafol26r1";
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Content-Type":"application/json","Accept":"application/json","Cache-Control":"no-cache"};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(n){
            const r=await fetch("https://music98.news/api/desk?physicalfix="+Date.now()+"_"+n,{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            return r.json();
          }
          (async()=>{
            const d=await get(0);
            const p=d.posts.find(x=>x.id===id);
            if(!p||p.status!=="live") throw Error("TARGET_NOT_LIVE");
            const other=JSON.stringify(d.posts.filter(x=>x.id!==id));
            const meta=JSON.stringify(Object.fromEntries(Object.entries(p).filter(([k])=>k!=="body")));
            const old="The digital edition runs 22 songs, while the first-edition CD and standard vinyl contain 17.";
            const neu="The digital edition runs 22 songs, while the first-edition CD and standard vinyl contain 17. The vinyl comes on two discs and includes a double-sided poster.";
            if(!p.body.includes(old)) throw Error("TARGET_PARAGRAPH_NOT_FOUND");
            p.body=p.body.replace(old,neu);
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers:h,body:JSON.stringify({posts:d.posts,touched:[id]})});
            if(!s.ok) throw Error("SAVE_"+s.status);
            for(let i=1;i<=12;i++){
              await sleep(2000);
              const a=await get(i);
              const q=a.posts.find(x=>x.id===id);
              if(q&&q.body===p.body){
                if(JSON.stringify(a.posts.filter(x=>x.id!==id))!==other) throw Error("OTHER_POST_CHANGED");
                const meta2=JSON.stringify(Object.fromEntries(Object.entries(q).filter(([k])=>k!=="body")));
                if(meta2!==meta) throw Error("NON_BODY_FIELD_CHANGED");
                console.log("VICTORIA_PHYSICAL_PARAGRAPH_VERIFIED");
                return;
              }
            }
            throw Error("VERIFY_TIMEOUT");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
