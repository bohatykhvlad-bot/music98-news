name: Temporary local editorial validation
on:
  push:
    branches: [main]
    paths:
      - .github/two-drafts-local-check.json
      - .github/workflows/temporary-local-editorial-validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run gate on exact staged drafts
        shell: python
        run: |
          import importlib.util, json, sys
          spec=importlib.util.spec_from_file_location("m98gate","scripts/gate.py")
          g=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(g)
          g.CHECK_IDS=False
          data=json.load(open(".github/two-drafts-local-check.json",encoding="utf-8"))
          bad=False
          for p in data["posts"]:
              fails,warns,info=g.check_post(p,strict=True)
              print("POST",p["id"])
              for k,v in info:
                  if k=="length": print("INFO",k,v)
              for k,v in warns: print("WARN",k,v)
              for k,v in fails: print("FAIL",k,v)
              print("GATE","PASS" if not fails else "FAIL")
              bad=bad or bool(fails)
          if bad: sys.exit(1)
      - name: Preflight Shakira without padding-only floor
        run: python scripts/preflight.py --post shakira26amazonmadrid --file .github/two-drafts-local-check.json --expected-media 1 --min-words 290
      - name: Preflight Victoria
        run: python scripts/preflight.py --post auvictoriafol26r1 --file .github/two-drafts-local-check.json --expected-media 1 --min-words 450
