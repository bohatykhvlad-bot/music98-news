name: Temporary Lola cover inspect
on:
  push:
    paths:
      - .github/workflows/temporary-lola-cover-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure editor access
        run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Read exact current Lola cover
        run: |
          python scripts/post.py dump lola26ebtour --out /tmp/lola.json
          python - <<'PY'
          import json
          p=json.load(open("/tmp/lola.json",encoding="utf-8"))
          print("LOLA_COVER_JSON="+json.dumps(p.get("cover"),ensure_ascii=False,sort_keys=True))
          print("LOLA_STATUS="+str(p.get("status")))
          print("LOLA_BODY_WORDS="+str(len((p.get("body") or "").split())))
          PY
