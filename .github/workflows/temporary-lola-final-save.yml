name: Temporary Lola final save
on:
  push:
    paths:
      - .github/workflows/temporary-lola-final-save.yml
      - .github/staging/lola-editorial-final.json
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT current Lola
        run: python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: POST-EDIT final Lola
        run: python scripts/editorial_readthrough.py --post lola26ebtour --file .github/staging/lola-editorial-final.json --phase post-edit --confirm-full-read
      - name: Extract body
        shell: python
        run: |
          import json
          from pathlib import Path
          p=json.loads(Path(".github/staging/lola-editorial-final.json").read_text(encoding="utf-8"))
          Path("/tmp/lola.txt").write_text(p["body"],encoding="utf-8")
      - name: Save text only
        run: python scripts/post.py set lola26ebtour --body-file /tmp/lola.txt --title "Lola Young Announces 2027 Everything Begins Tour" --excerpt "Lola Young has announced the Everything Begins Tour, a 17-date headline run across North America scheduled for spring 2027 and her first full itinerary in the region since 2025."
      - name: Verify saved Lola
        run: |
          python scripts/post.py gate lola26ebtour
          python scripts/post.py preflight lola26ebtour
          python scripts/post.py show lola26ebtour
