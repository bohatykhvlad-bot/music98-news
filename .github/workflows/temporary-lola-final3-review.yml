name: Temporary Lola final3 read-only review
on:
  push:
    paths:
      - .github/workflows/temporary-lola-final3-review.yml
      - .github/staging/lola-editorial-final3.json
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Human-quality barrier
        run: python scripts/editorial_readthrough.py --post lola26ebtour --file .github/staging/lola-editorial-final3.json --phase post-edit --confirm-full-read
