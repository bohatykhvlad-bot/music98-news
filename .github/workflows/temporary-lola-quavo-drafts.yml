name: Temporary Lola and Quavo drafts
on:
  push:
    paths:
      - .github/workflows/temporary-lola-quavo-drafts.yml
      - .github/scripts/save_lola_quavo_drafts.py
permissions:
  contents: read
jobs:
  save-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/scripts/save_lola_quavo_drafts.py
