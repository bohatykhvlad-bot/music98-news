name: Temporary safe Lola final publish
on:
  push:
    paths:
      - .github/workflows/temporary-lola-safe-finalize.yml
permissions:
  contents: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure credential
        shell: bash
        run: |
          test -n "$ADMIN_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Let Quavo live write propagate across KV edges
        run: sleep 70
      - name: Verify Quavo live is exact and Lola is still draft
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          qbody=Path(".github/staging/quavo-final-live-body.txt").read_text(encoding="utf-8").strip()
          want_q=hashlib.sha256(qbody.encode()).hexdigest()
          def desk():
              req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=60) as r: return json.loads(r.read().decode())
          j=desk()
          q=next((p for p in j.get("posts",[]) if str(p.get("id"))=="quavo26qromelife"),None)
          l=next((p for p in j.get("posts",[]) if str(p.get("id"))=="lola26ebtour"),None)
          if not q or q.get("status")!="live" or hashlib.sha256((q.get("body") or "").encode()).hexdigest()!=want_q:
              raise SystemExit("Quavo live state/body is not exact; refusing Lola write")
          if (q.get("cover") or {}).get("pos")!="50% 28%":
              raise SystemExit("Quavo live crop is not the approved 50% 28%")
          if not l or l.get("status")!="draft":
              raise SystemExit("Lola is not a draft before recovery")
          print("QUAVO_STABLE live exact crop=50% 28%; LOLA_STATUS draft")
      - name: PRE-EDIT exact current Lola after propagation
        run: python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Build final Lola candidate
        shell: python
        run: |
          import copy, hashlib, json, os, re, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r: desk=json.loads(r.read().decode())
          cur=next((p for p in desk.get("posts",[]) if str(p.get("id"))=="lola26ebtour"),None)
          if not cur or cur.get("status")!="draft": raise SystemExit("Lola draft missing")
          p=copy.deepcopy(cur)
          p["body"]=Path(".github/staging/lola-final-live-body.txt").read_text(encoding="utf-8").strip()
          p["title"]="Lola Young Announces 2027 Everything Begins Tour"
          p["excerpt"]="Lola Young has announced the Everything Begins Tour, a 17-date North American headline run set for spring 2027."
          p["status"]="draft"
          if (p.get("cover") or {}).get("src")!="photos/lola-young-everything-begins-2027-hr.jpg":
              raise SystemExit("unexpected Lola cover")
          wc=len(re.findall(r"\b[\w'’-]+\b",re.sub(r"\[[^\]]+\]"," ",p["body"])))
          if wc<400: raise SystemExit("Lola body below 400 words")
          Path("/tmp/lola-final.json").write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"LOLA_CANDIDATE words={wc} sha={hashlib.sha256(p['body'].encode()).hexdigest()[:12]} cover_preserved=true")
      - name: POST-EDIT full Lola read
        run: python scripts/editorial_readthrough.py --post lola26ebtour --file /tmp/lola-final.json --phase post-edit --confirm-full-read
      - name: Replace Lola draft
        run: python scripts/post.py replace-draft lola26ebtour --file /tmp/lola-final.json
      - name: Let Lola draft replacement propagate
        run: sleep 70
      - name: Verify both posts before final Lola publish
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          want={
            "quavo26qromelife":("live",Path(".github/staging/quavo-final-live-body.txt").read_text(encoding="utf-8").strip()),
            "lola26ebtour":("draft",Path(".github/staging/lola-final-live-body.txt").read_text(encoding="utf-8").strip()),
          }
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r: j=json.loads(r.read().decode())
          for pid,(status,body) in want.items():
              p=next((x for x in j.get("posts",[]) if str(x.get("id"))==pid),None)
              if not p or p.get("status")!=status or p.get("body")!=body:
                  raise SystemExit(f"{pid}: state/body mismatch before Lola publish")
              print(f"PREPUBLISH_EXACT {pid} status={status} sha={hashlib.sha256(body.encode()).hexdigest()[:12]}")
      - name: Lola final gate and preflight
        run: |
          python scripts/post.py gate lola26ebtour
          python scripts/post.py preflight lola26ebtour
      - name: Publish Lola
        run: python scripts/post.py publish lola26ebtour
      - name: Let live state propagate
        run: sleep 70
      - name: Verify both live through canonical verifier
        run: |
          python scripts/post.py verify quavo26qromelife
          python scripts/post.py verify lola26ebtour
      - name: Final exact live-state check
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          want={
            "quavo26qromelife":Path(".github/staging/quavo-final-live-body.txt").read_text(encoding="utf-8").strip(),
            "lola26ebtour":Path(".github/staging/lola-final-live-body.txt").read_text(encoding="utf-8").strip(),
          }
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r: j=json.loads(r.read().decode())
          for pid,body in want.items():
              p=next((x for x in j.get("posts",[]) if str(x.get("id"))==pid),None)
              if not p or p.get("status")!="live" or p.get("body")!=body:
                  raise SystemExit(f"{pid}: final live mismatch")
              print(f"FINAL_LIVE_EXACT {pid} sha={hashlib.sha256(body.encode()).hexdigest()[:12]} publishAt={p.get('publishAt')} cover_pos={(p.get('cover') or {}).get('pos')}")
