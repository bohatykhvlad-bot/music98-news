name: Temporary Lola source inspect
on:
  push:
    paths:
      - .github/workflows/temporary-lola-source-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch exact tour press source
        run: |
          python - <<'PY'
          import urllib.request
          from PIL import Image
          u="https://bunny-wp-pullzone-qbcmv8y9wp.b-cdn.net/wp-content/uploads/2026/10/Lola-Young-by-Harriet-K-Bols2.jpg"
          q=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(q,timeout=45) as r:
              b=r.read()
          open("/tmp/lola-press.jpg","wb").write(b)
          im=Image.open("/tmp/lola-press.jpg")
          print("LOLA_SOURCE",im.size,len(b),im.format)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lola-tour-press-original
          path: /tmp/lola-press.jpg
          if-no-files-found: error
