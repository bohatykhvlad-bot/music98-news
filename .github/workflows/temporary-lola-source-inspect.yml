name: Temporary Lola source inspect
on:
  push:
    paths:
      - .github/workflows/temporary-lola-source-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Inspect Chuff press page and fetch source candidates
        run: |
          python - <<'PY'
          import urllib.request
          from PIL import Image
          import re, urllib.parse
          page="https://chuffmedia.com/artists/lola-young"
          q=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(q,timeout=45) as r:
              h=r.read().decode("utf-8","replace")
          print("HTML_BYTES",len(h))
          for m in re.finditer(r'''(?:href|src|srcset)=["']([^"']+)["']''',h,re.I):
              val=m.group(1)
              if any(k in val.lower() for k in ("press","lola","general","dsp","drive.google","dropbox")):
                  print("CANDIDATE",urllib.parse.urljoin(page,val))
          # Raw PR-agency press shot from Lola Young's current Chuff Media artist page.
          u2="https://chuffmedia.com/images/artists/03_CC_250428_LolaYoung_0390_V1_2025-06-23-124058.jpg"
          q=urllib.request.Request(u2,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(q,timeout=45) as r:
              b2=r.read()
          open("/tmp/lola-chuff-raw.jpg","wb").write(b2)
          im2=Image.open("/tmp/lola-chuff-raw.jpg")
          print("LOLA_CHUFF_RAW",im2.size,len(b2),im2.format)
          print("LOLA_EXIF",dict(im2.getexif()))
          # Known tour press derivative, retained only as a negative control.
          u="https://bunny-wp-pullzone-qbcmv8y9wp.b-cdn.net/wp-content/uploads/2026/10/Lola-Young-by-Harriet-K-Bols2.jpg"
          q=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(q,timeout=45) as r:
              b=r.read()
          open("/tmp/lola-press.jpg","wb").write(b)
          im=Image.open("/tmp/lola-press.jpg")
          print("LOLA_NEGATIVE_CONTROL",im.size,len(b),im.format)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lola-tour-press-original
          path: |
            /tmp/lola-press.jpg
            /tmp/lola-chuff-raw.jpg
          if-no-files-found: error
