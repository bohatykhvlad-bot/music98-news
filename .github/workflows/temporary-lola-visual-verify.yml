name: Temporary Lola saved-draft visual verification
on:
  push:
    paths:
      - .github/workflows/temporary-lola-visual-verify.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture exact saved Lola cover in admin desk
        shell: bash
        run: |
          node <<'JS'
          const {spawn}=require('node:child_process');
          const fs=require('node:fs');
          const secret=process.env.ADMIN_PASSWORD;
          if(!secret) throw Error('NO_EDITOR_CREDENTIAL');
          const browser=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if(!browser) throw Error('CHROMIUM_MISSING');
          const chrome=spawn(browser,['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--remote-debugging-port=9222','--remote-allow-origins=*','--user-data-dir=/tmp/m98-lola-visual','about:blank'],{stdio:'ignore'});
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          async function main(){
            let ws;
            try{
              let pages;
              for(let i=0;i<100;i++){
                try{const r=await fetch('http://127.0.0.1:9222/json/list');if(r.ok){pages=await r.json();if(pages.some(x=>x.type==='page'))break}}catch{}
                await wait(100);
              }
              const page=pages?.find(x=>x.type==='page'); if(!page) throw Error('CDP_UNAVAILABLE');
              ws=new WebSocket(page.webSocketDebuggerUrl);
              await new Promise((ok,err)=>{ws.onopen=ok;ws.onerror=err});
              let seq=0; const pending=new Map();
              ws.onmessage=e=>{const x=JSON.parse(e.data);if(!x.id)return;const p=pending.get(x.id);if(!p)return;pending.delete(x.id);x.error?p.reject(Error(JSON.stringify(x.error))):p.resolve(x.result)};
              const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}))});
              const evalv=async expr=>(await send('Runtime.evaluate',{expression:expr,awaitPromise:true,returnByValue:true})).result?.value;
              await send('Runtime.enable'); await send('Page.enable');
              for(const width of [390,1280]){
                await send('Emulation.setDeviceMetricsOverride',{width,height:1600,deviceScaleFactor:1,mobile:width<700,screenWidth:width,screenHeight:1600});
                await send('Page.navigate',{url:'https://music98.news/admin-desk.html?visual='+Date.now()});
                await wait(700);
                await evalv(`(async()=>{document.querySelector('#key').value=${JSON.stringify(secret)};await unlockDesk();return true})()`);
                let ok=false;
                for(let i=0;i<80;i++){
                  ok=await evalv(`Array.isArray(posts)&&posts.some(p=>p.id==='lola27everythingbegins')&&!document.querySelector('#desk').classList.contains('hide')`);
                  if(ok) break; await wait(150);
                }
                if(!ok) throw Error('DESK_OR_POST_NOT_READY_'+width);
                await evalv(`(()=>{const p=posts.find(x=>x.id==='lola27everythingbegins');fillForm(p);setCropMode('main');document.querySelector('#stage').scrollIntoView({block:'center'});return {status:p.status,src:p.cover?.src,credit:p.cover?.credit,media:(p.body.match(/\\[(?:photo|youtube|apple|instagram|tiktok):/g)||[]).length}})()`);
                let info;
                for(let i=0;i<80;i++){
                  info=await evalv(`(()=>{const im=document.querySelector('#stageImg'),s=document.querySelector('#stage'),m=document.querySelector('#miniFrame');if(!im?.complete||!im.naturalWidth)return null;const sr=s.getBoundingClientRect(),mr=m.getBoundingClientRect();return {natural:[im.naturalWidth,im.naturalHeight],stage:[sr.left,sr.top,sr.width,sr.height],mini:[mr.left,mr.top,mr.width,mr.height],src:im.currentSrc,credit:document.querySelector('#credit').value,bodyMedia:document.querySelectorAll('#composer .blk').length,title:document.querySelector('#title').value}})()`);
                  if(info?.natural?.[0]) break; await wait(150);
                }
                if(!info) throw Error('COVER_NOT_RENDERED_'+width);
                if(!info.src.includes('lola-young-conor-cunningham-press-original.jpg')) throw Error('WRONG_COVER_'+width);
                if(info.credit!=='Conor Cunningham') throw Error('WRONG_CREDIT_'+width);
                if(info.bodyMedia<1) throw Error('MEDIA_NOT_RENDERED_'+width);
                console.log('LOLA_VISUAL_DOM_PASS '+JSON.stringify({width,...info}));
                for(const [kind,arr] of [['main',info.stage],['card',info.mini]]){
                  const [x,y,w,h]=arr;
                  const png=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:true,clip:{x:Math.max(0,x),y:Math.max(0,y),width:Math.ceil(w),height:Math.ceil(h),scale:1}});
                  fs.writeFileSync(`/tmp/lola-${kind}-${width}.png`,Buffer.from(png.data,'base64'));
                }
              }
            } finally { ws?.close(); chrome.kill('SIGTERM'); }
          }
          main().catch(e=>{console.error('LOLA_VISUAL_FAIL '+e.message);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lola-saved-draft-cover-desktop-mobile
          path: /tmp/lola-*.png
          if-no-files-found: error
