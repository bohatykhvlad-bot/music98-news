name: Temporary publish Shakira and Victoria
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-publish-shakira-victoria.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm or publish both posts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const ids=["shakira26amazonmadrid","auvictoriafol26r1"];
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Content-Type":"application/json","Accept":"application/json","Cache-Control":"no-cache"};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(n){
            const r=await fetch("https://music98.news/api/desk?verify="+Date.now()+"_"+n,{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            return r.json();
          }
          (async()=>{
            let d=await get(0);
            let ps=ids.map(id=>d.posts.find(p=>p.id===id));
            if(ps.some(p=>!p)) throw Error("MISSING_TARGET");
            if(ps.some(p=>!["draft","live"].includes(p.status))) throw Error("BAD_STATUS");
            const others=JSON.stringify(d.posts.filter(p=>!ids.includes(p.id)));
            if(!ps.every(p=>p.status==="live")){
              const now=Date.now();
              ps.forEach((p,i)=>{
                if(p.status==="draft"){
                  p.status="live";
                  p.publishAt=new Date(now-i*1000).toISOString();
                  p.date=p.publishAt.slice(0,10);
                }
              });
              const r=await fetch("https://music98.news/api/desk",{method:"POST",headers:h,body:JSON.stringify({posts:d.posts,touched:ids})});
              if(!r.ok) throw Error("SAVE_"+r.status);
            }
            for(let i=1;i<=20;i++){
              await sleep(i===1?2000:3000);
              const x=await get(i);
              const got=ids.map(id=>x.posts.find(p=>p.id===id));
              if(got.every(p=>p&&p.status==="live"&&p.publishAt)){
                if(JSON.stringify(x.posts.filter(p=>!ids.includes(p.id)))!==others) throw Error("OTHER_POST_CHANGED");
                console.log("PUBLISHED_CONFIRMED");
                got.forEach(p=>console.log(p.id,p.publishAt));
                return;
              }
            }
            throw Error("LIVE_NOT_CONFIRMED");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Mark verification
        run: |
          echo ok > .github/two-post-publish-ok.txt
          git config user.name "music98-bot"
          git config user.email "music98-bot@users.noreply.github.com"
          git add .github/two-post-publish-ok.txt
          git commit -m "Record confirmed Shakira and Victoria publication"
          git push
