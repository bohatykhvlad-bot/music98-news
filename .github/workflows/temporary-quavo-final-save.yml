name: Temporary Quavo final save
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-final-save.yml
      - .github/staging/quavo-editorial-final.json
permissions:
  contents: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT current Quavo
        run: python scripts/post.py editorial quavo26qromelife --phase pre-edit
      - name: POST-EDIT final Quavo
        run: python scripts/editorial_readthrough.py --post quavo26qromelife --file .github/staging/quavo-editorial-final.json --phase post-edit --confirm-full-read --allow technical-credit --reason "Pharrell Williams' album-wide role is central to the release story"
      - name: Extract body
        shell: python
        run: |
          import json
          from pathlib import Path
          p=json.loads(Path(".github/staging/quavo-editorial-final.json").read_text(encoding="utf-8"))
          Path("/tmp/quavo.txt").write_text(p["body"],encoding="utf-8")
      - name: Save text only
        run: python scripts/post.py set quavo26qromelife --body-file /tmp/quavo.txt --title "QRÖMELIFE" --excerpt "Quavo has released *QRÖMELIFE*, his third solo album, a 14-track record executive produced by Pharrell Williams and developed with him over more than a year and a half."
