name: Temporary Quavo Hypebeast inspect
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-hypebeast-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch Brian Nguyen QRÖMELIFE shoot frames
        run: |
          python - <<'PY'
          import urllib.request
          from PIL import Image
          for n in ["87A6888","87A6897","87A6907","87A6908","87A6910"]:
              u=f"https://image-cdn.hypb.st/https%3A%2F%2Fhypebeast.com%2Fimage%2F2026%2F09%2F22%2F{n}-scaled.jpg?cbr=1&fit=max&format=jpg&q=98&w=3500"
              req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=60) as r:b=r.read()
              p=f"/tmp/{n}.jpg";open(p,"wb").write(b)
              im=Image.open(p)
              print("FRAME",n,im.size,len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quavo-brian-nguyen-qromelife
          path: /tmp/87A*.jpg
          if-no-files-found: error
