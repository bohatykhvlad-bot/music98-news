name: Temporary Quavo Hypebeast visual proof
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-hypebeast-visual-proof.yml
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Brian Nguyen Quavo shoot
        run: |
          mkdir -p /tmp/proof
          for n in 87A6893 87A6879 87A6907 87A6908 87A6910; do
            curl -fL --retry 3 -o "/tmp/proof/$n.jpg" "https://hypebeast.com/image/2026/09/22/$n-scaled.jpg"
          done
          file /tmp/proof/*
          wc -c /tmp/proof/*
      - uses: actions/upload-artifact@v4
        with:
          name: quavo-brian-nguyen-hypebeast
          path: /tmp/proof/*
          if-no-files-found: error
          retention-days: 1
