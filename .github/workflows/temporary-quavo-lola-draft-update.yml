name: Temporary verified Quavo Lola draft update
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-lola-draft-update.yml
      - .github/staging/quavo-final-body.txt
      - .github/staging/lola-final-body.txt
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure editor credential
        shell: bash
        run: |
          test -n "$ADMIN_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT full reads on exact current drafts
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Build exact candidates from current draft metadata
        shell: python
        run: |
          import copy, hashlib, json, os, re, urllib.request
          from pathlib import Path

          key=os.environ["ADMIN_PASSWORD"].strip()
          req=urllib.request.Request(
              "https://music98.news/api/desk",
              headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=60) as r:
              desk=json.loads(r.read().decode("utf-8"))
          posts=desk.get("posts") or []
          spec={
            "quavo26qromelife":{
              "body":Path(".github/staging/quavo-final-body.txt").read_text(encoding="utf-8").strip(),
              "title":"QRÖMELIFE",
              "excerpt":"Quavo has released *QRÖMELIFE*, a 14-track solo album that follows 2023's *Rocket Power*. The earlier record was made much closer to Takeoff's death, while the new one leaves more room for pleasure, ambition, fatherhood and reconciliation.",
              "cover_file":"quavo-qromelife-tariq-mcallister-cover.jpg",
              "crop":{"pos":"50% 42%","zoom":1,"cardZoom":3.5,"cardX":0.82,"cardY":0.44},
              "out":"/tmp/quavo-candidate.json",
            },
            "lola26ebtour":{
              "body":Path(".github/staging/lola-final-body.txt").read_text(encoding="utf-8").strip(),
              "title":"Lola Young Announces 2027 Everything Begins Tour",
              "excerpt":"Lola Young has announced the Everything Begins Tour, a 17-date North American headline run set for spring 2027.",
              "cover_file":"lola-young-everything-begins-2027-hr.jpg",
              "crop":{"pos":"72% 48%","zoom":1,"cardZoom":2.4,"cardX":0.70,"cardY":0.48},
              "out":"/tmp/lola-candidate.json",
            },
          }
          for pid,cfg in spec.items():
              found=[p for p in posts if str(p.get("id"))==pid]
              if len(found)!=1 or found[0].get("status")!="draft":
                  raise SystemExit(f"{pid}: current post missing or not draft")
              p=copy.deepcopy(found[0])
              if len(re.findall(r"\b[\w'’-]+\b",re.sub(r"\[[^\]]+\]"," ",cfg["body"]))) < 400:
                  raise SystemExit(f"{pid}: body under 400 words")
              p["body"]=cfg["body"]
              p["title"]=cfg["title"]
              p["excerpt"]=cfg["excerpt"]
              p["status"]="draft"
              cover=p.get("cover")
              if not isinstance(cover,dict) or cover.get("kind")!="img":
                  raise SystemExit(f"{pid}: image cover missing")
              src=str(cover.get("src") or "")
              if not src.endswith(cfg["cover_file"]):
                  raise SystemExit(f"{pid}: unexpected cover source")
              for k,v in cfg["crop"].items():
                  cover[k]=v
              Path(cfg["out"]).write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding="utf-8")
              wc=len(re.findall(r"\b[\w'’-]+\b",re.sub(r"\[[^\]]+\]"," ",p["body"])))
              print(f"STAGED {pid} words={wc} sha={hashlib.sha256(p['body'].encode()).hexdigest()[:12]} cover={cfg['cover_file']} crop={cfg['crop']}")
      - name: POST-EDIT full reads on exact final bodies
        run: |
          python scripts/editorial_readthrough.py --post quavo26qromelife --file /tmp/quavo-candidate.json --phase post-edit --confirm-full-read
          python scripts/editorial_readthrough.py --post lola26ebtour --file /tmp/lola-candidate.json --phase post-edit --confirm-full-read
      - name: Replace Quavo draft through canonical guarded path
        run: python scripts/post.py replace-draft quavo26qromelife --file /tmp/quavo-candidate.json
      - name: Replace Lola draft through canonical guarded path
        run: python scripts/post.py replace-draft lola26ebtour --file /tmp/lola-candidate.json
      - name: Saved-draft gate and preflight
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py preflight quavo26qromelife
          python scripts/post.py gate lola26ebtour
          python scripts/post.py preflight lola26ebtour
      - name: Verify exact saved drafts without logging prose
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=60) as r:
              desk=json.loads(r.read().decode("utf-8"))
          for pid,path in [("quavo26qromelife","/tmp/quavo-candidate.json"),("lola26ebtour","/tmp/lola-candidate.json")]:
              saved=next((p for p in desk.get("posts",[]) if str(p.get("id"))==pid),None)
              want=json.loads(Path(path).read_text(encoding="utf-8"))
              if not saved or saved.get("status")!="draft":
                  raise SystemExit(f"{pid}: not draft after save")
              for field in ("title","excerpt","body","cover","status"):
                  if saved.get(field)!=want.get(field):
                      raise SystemExit(f"{pid}: saved field mismatch {field}")
              sha=hashlib.sha256(saved["body"].encode()).hexdigest()[:12]
              words=len(saved["body"].split())
              print(f"DRAFT_VERIFIED {pid} status=draft sha={sha} words~={words} crop_ok=true")
