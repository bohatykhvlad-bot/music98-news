name: Temporary Quavo Lola prose cleanup
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-lola-prose-cleanup.yml
      - .github/staging/quavo-prose-cleanup.txt
      - .github/staging/lola-prose-cleanup.txt
permissions:
  contents: read
jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure credential
        shell: bash
        run: |
          test -n "$ADMIN_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT reread exact live copy
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Editorial invariants on proposed copy
        shell: python
        run: |
          import re
          from pathlib import Path
          specs=[
            ("quavo",Path(".github/staging/quavo-prose-cleanup.txt").read_text(encoding="utf-8"),"Quavo",3),
            ("lola",Path(".github/staging/lola-prose-cleanup.txt").read_text(encoding="utf-8"),"Lola Young",2),
          ]
          for name,body,needle,max_count in specs:
              prose=re.sub(r"\[[^\]]+\]"," ",body)
              wc=len(re.findall(r"\b[\w'’-]+\b",prose))
              paras=[p.strip() for p in body.split("\n\n") if p.strip() and not re.fullmatch(r"\[[^\]]+\]",p.strip())]
              counts=[len(re.findall(r"\b[\w'’-]+\b",p)) for p in paras]
              n=body.count(needle)
              if wc<400: raise SystemExit(f"{name}: under 400 words")
              if any(x<55 for x in counts): raise SystemExit(f"{name}: short paragraph {counts}")
              if n>max_count: raise SystemExit(f"{name}: name repetition {needle}={n}")
              print(f"INVARIANTS {name} words={wc} paragraphs={counts} {needle}={n}")
          lola=Path(".github/staging/lola-prose-cleanup.txt").read_text(encoding="utf-8")
          if '"Everything Begins,"' not in lola or '"Everything Ends"' not in lola:
              raise SystemExit("Lola: quoted tour/tattoo wording missing in ending")
      - name: POST-EDIT full reread exact final copy
        run: |
          python scripts/post.py editorial quavo26qromelife --body-file .github/staging/quavo-prose-cleanup.txt --title "QRÖMELIFE" --phase post-edit
          python scripts/post.py editorial lola26ebtour --body-file .github/staging/lola-prose-cleanup.txt --title "Lola Young Announces 2027 Everything Begins Tour" --phase post-edit
      - name: Update Quavo live copy
        run: |
          python scripts/post.py set quavo26qromelife             --body-file .github/staging/quavo-prose-cleanup.txt             --title "QRÖMELIFE"             --excerpt "Quavo has released *QRÖMELIFE*, a 14-track solo album that follows 2023's *Rocket Power*. The earlier record was shaped much more directly by Takeoff's death and carried that grief through almost every turn."
      - name: Let Quavo write propagate
        run: sleep 70
      - name: Verify Quavo exact before touching Lola
        shell: python
        run: |
          import json,os,urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"]
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r: j=json.loads(r.read().decode())
          p=next(x for x in j["posts"] if str(x.get("id"))=="quavo26qromelife")
          want=Path(".github/staging/quavo-prose-cleanup.txt").read_text(encoding="utf-8").strip()
          if p.get("status")!="live" or p.get("body")!=want: raise SystemExit("Quavo live mismatch")
          print("QUAVO_LIVE_EXACT")
      - name: Refresh Lola PRE-EDIT stamp after propagation
        run: python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Refresh Lola POST-EDIT stamp
        run: python scripts/post.py editorial lola26ebtour --body-file .github/staging/lola-prose-cleanup.txt --title "Lola Young Announces 2027 Everything Begins Tour" --phase post-edit
      - name: Update Lola live copy
        run: |
          python scripts/post.py set lola26ebtour             --body-file .github/staging/lola-prose-cleanup.txt             --title "Lola Young Announces 2027 Everything Begins Tour"             --excerpt "Lola Young has announced the Everything Begins Tour, a 17-date North American headline run set for spring 2027."
      - name: Let Lola write propagate
        run: sleep 70
      - name: Final full reread exact saved live copy
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Final gate and public verify
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py gate lola26ebtour
          python scripts/post.py verify quavo26qromelife
          python scripts/post.py verify lola26ebtour
      - name: Final exact live body check
        shell: python
        run: |
          import hashlib,json,os,urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"]
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r: j=json.loads(r.read().decode())
          for pid,path in [
            ("quavo26qromelife",".github/staging/quavo-prose-cleanup.txt"),
            ("lola26ebtour",".github/staging/lola-prose-cleanup.txt")
          ]:
              p=next(x for x in j["posts"] if str(x.get("id"))==pid)
              want=Path(path).read_text(encoding="utf-8").strip()
              if p.get("status")!="live" or p.get("body")!=want:
                  raise SystemExit(f"{pid}: final live mismatch")
              print(f"FINAL_EXACT {pid} words={len(want.split())} sha={hashlib.sha256(want.encode()).hexdigest()[:12]}")
