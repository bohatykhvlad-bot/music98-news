name: Temporary final Quavo Lola publish
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-lola-publish.yml
      - .github/staging/quavo-final-live-body.txt
      - .github/staging/lola-final-live-body.txt
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure credential
        shell: bash
        run: |
          test -n "$ADMIN_PASSWORD"
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: PRE-EDIT read exact current drafts
        run: |
          python scripts/post.py editorial quavo26qromelife --phase pre-edit
          python scripts/post.py editorial lola26ebtour --phase pre-edit
      - name: Build final candidates from current draft metadata
        shell: python
        run: |
          import copy, hashlib, json, os, re, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          req=urllib.request.Request(
              "https://music98.news/api/desk",
              headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              desk=json.loads(r.read().decode("utf-8"))
          posts=desk.get("posts") or []
          spec={
            "quavo26qromelife":{
              "body":Path(".github/staging/quavo-final-live-body.txt").read_text(encoding="utf-8").strip(),
              "title":"QRÖMELIFE",
              "excerpt":"Quavo has released *QRÖMELIFE*, a 14-track solo album that follows 2023's *Rocket Power*. The earlier record was made much closer to Takeoff's death, while the new one leaves more room for pleasure, ambition, fatherhood and reconciliation.",
              "cover_src":"photos/quavo-qromelife-official-world-02.jpg",
              "out":"/tmp/quavo-final.json",
            },
            "lola26ebtour":{
              "body":Path(".github/staging/lola-final-live-body.txt").read_text(encoding="utf-8").strip(),
              "title":"Lola Young Announces 2027 Everything Begins Tour",
              "excerpt":"Lola Young has announced the Everything Begins Tour, a 17-date North American headline run set for spring 2027.",
              "cover_src":"photos/lola-young-everything-begins-2027-hr.jpg",
              "out":"/tmp/lola-final.json",
            },
          }
          for pid,cfg in spec.items():
              found=[p for p in posts if str(p.get("id"))==pid]
              if len(found)!=1 or found[0].get("status")!="draft":
                  raise SystemExit(f"{pid}: current post missing or not draft")
              p=copy.deepcopy(found[0])
              if p.get("artist") not in ("Quavo","Lola Young"):
                  raise SystemExit(f"{pid}: artist identity mismatch")
              cover=p.get("cover")
              if not isinstance(cover,dict) or cover.get("kind")!="img" or cover.get("src")!=cfg["cover_src"]:
                  raise SystemExit(f"{pid}: unexpected cover")
              p["body"]=cfg["body"]
              p["title"]=cfg["title"]
              p["excerpt"]=cfg["excerpt"]
              p["status"]="draft"
              if pid=="quavo26qromelife":
                  cover["pos"]="50% 28%"
              wc=len(re.findall(r"\b[\w'’-]+\b",re.sub(r"\[[^\]]+\]"," ",p["body"])))
              if wc < 400:
                  raise SystemExit(f"{pid}: under 400 words ({wc})")
              Path(cfg["out"]).write_text(json.dumps(p,ensure_ascii=False,indent=2),encoding="utf-8")
              print(f"CANDIDATE {pid} words={wc} sha={hashlib.sha256(p['body'].encode()).hexdigest()[:12]} cover_pos={cover.get('pos')} cardZoom={cover.get('cardZoom')} cardX={cover.get('cardX')} cardY={cover.get('cardY')}")
      - name: POST-EDIT full read exact final candidates
        run: |
          python scripts/editorial_readthrough.py --post quavo26qromelife --file /tmp/quavo-final.json --phase post-edit --confirm-full-read
          python scripts/editorial_readthrough.py --post lola26ebtour --file /tmp/lola-final.json --phase post-edit --confirm-full-read
      - name: Replace both drafts through guarded path
        run: |
          python scripts/post.py replace-draft quavo26qromelife --file /tmp/quavo-final.json
          python scripts/post.py replace-draft lola26ebtour --file /tmp/lola-final.json
      - name: Final saved-draft gates
        run: |
          python scripts/post.py gate quavo26qromelife
          python scripts/post.py preflight quavo26qromelife
          python scripts/post.py gate lola26ebtour
          python scripts/post.py preflight lola26ebtour
      - name: Confirm exact saved bodies and crops before publish
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              desk=json.loads(r.read().decode("utf-8"))
          for pid,path in [("quavo26qromelife","/tmp/quavo-final.json"),("lola26ebtour","/tmp/lola-final.json")]:
              got=next((p for p in desk.get("posts",[]) if str(p.get("id"))==pid),None)
              want=json.loads(Path(path).read_text(encoding="utf-8"))
              if not got or got.get("status")!="draft":
                  raise SystemExit(f"{pid}: not draft before publish")
              for field in ("title","excerpt","body","cover","status"):
                  if got.get(field)!=want.get(field):
                      raise SystemExit(f"{pid}: mismatch {field}")
              print(f"READY {pid} sha={hashlib.sha256(got['body'].encode()).hexdigest()[:12]} cover_pos={(got.get('cover') or {}).get('pos')}")
      - name: Publish both
        run: |
          python scripts/post.py publish quavo26qromelife
          python scripts/post.py publish lola26ebtour
      - name: Verify live
        run: |
          python scripts/post.py verify quavo26qromelife
          python scripts/post.py verify lola26ebtour
      - name: Confirm live state and exact bodies
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          from pathlib import Path
          key=os.environ["ADMIN_PASSWORD"].strip()
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":key,"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              desk=json.loads(r.read().decode("utf-8"))
          for pid,path in [("quavo26qromelife","/tmp/quavo-final.json"),("lola26ebtour","/tmp/lola-final.json")]:
              got=next((p for p in desk.get("posts",[]) if str(p.get("id"))==pid),None)
              want=json.loads(Path(path).read_text(encoding="utf-8"))
              if not got or got.get("status")!="live" or got.get("body")!=want.get("body") or got.get("cover")!=want.get("cover"):
                  raise SystemExit(f"{pid}: live verification mismatch")
              print(f"LIVE_EXACT {pid} sha={hashlib.sha256(got['body'].encode()).hexdigest()[:12]} cover_pos={(got.get('cover') or {}).get('pos')}")
