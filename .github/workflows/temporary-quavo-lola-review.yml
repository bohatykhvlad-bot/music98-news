name: Temporary encrypted Quavo Lola draft review
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-lola-review.yml
permissions:
  contents: read
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Securely export matching drafts
        shell: bash
        run: |
          node <<'NODE'
          const { publicEncrypt, constants, randomBytes, createCipheriv } = require('node:crypto');
          const { brotliCompressSync } = require('node:zlib');
          const pub = "-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqvw3Cd7Pr6lZTFYQBANu\n86i/pj6LsxjWiCPZP1lGmvbNJj6ULdvEZUA3A5MWW3BJDSQzwQK4phqvvN/jl45Z\nIvsgW/6xJmOra+5DI9q1z6MHpB1rByfDVhRI1FuyKRsXWapzAapMJXlGGbji8xMA\n2nnXwYUDrAS5x85E+yuA7Lk02ocUn9YVtGFmNvPKp4MxAN1jlcEWjvJMrjFI7cvn\nh8d9wOym7itUcoz5Pzp/2YBlJk32kYFYTlxg6lCAtmEFijH8Z4XuCgruTC53VcI4\nNlYVbvEpbKRuPE0hXikpe8T5NAJ03XPRsyZOg195sqduj6oSN1J78TEoPHyYDO/I\nKQhNUa7zJhLGsGHcXpXFiEB3RJrRwoVPgYpIi0NNzkm0o+rFrhHvIrPYM7WyWFqT\nO9rOdN9xTEW5PglfZxGM2pPl4VNx4mQaFswZPAlDcNgthaR0FBueccknBWZjHr3U\nND1HkKSITbCy7bJtFOBUx354Hvsz8489m2FFPIXVXHDFAgMBAAE=\n-----END PUBLIC KEY-----";
          (async () => {
            const key = process.env.ADMIN_PASSWORD || '';
            if (!key) { console.log('M98_READER: ADMIN_PASSWORD_UNCONFIGURED'); process.exit(2); }
            const r = await fetch('https://music98.news/api/desk', {headers:{'X-Admin-Key':key,'Accept':'application/json'},cache:'no-store'});
            if (!r.ok) { console.log('M98_READER: AUTH_OR_FETCH_ERROR HTTP_' + r.status); process.exit(3); }
            const j = await r.json(); if(!Array.isArray(j.posts)){console.log('M98_READER: INVALID_RESPONSE');process.exit(4)}
            const matched = j.posts.filter(p => p.status === 'draft' && /quavo|lola young/i.test([p.artist,p.title,p.body].filter(Boolean).join(' ')));
            if (!matched.length) { console.log('M98_READER: NO_MATCHING_DRAFTS TOTAL_' + j.posts.length); process.exit(5); }
            const fields = matched.map(p => ({id:p.id,type:p.type,tag:p.tag,rtype:p.rtype,title:p.title,status:p.status,date:p.date,publishAt:p.publishAt,artist:p.artist,excerpt:p.excerpt,body:p.body,cover:p.cover,media:p.media,photos:p.photos,pinned:p.pinned}));
            const packed = brotliCompressSync(Buffer.from(JSON.stringify(fields),'utf8'));
            const secret = randomBytes(32), iv = randomBytes(12), cipher = createCipheriv('aes-256-gcm',secret,iv);
            const ciphertext = Buffer.concat([cipher.update(packed),cipher.final()]), tag = cipher.getAuthTag();
            const wrapped = publicEncrypt({key:pub,padding:constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},secret);
            console.log('M98_READER: ENCRYPTED_OK MATCHES_' + matched.length);
            const output = Buffer.concat([Buffer.from('M98QL01'),wrapped,iv,tag,ciphertext]).toString('base64');
            console.log('M98_ENCRYPTED_DRAFTS=' + output);
          })().catch(e=>{console.log('M98_READER: UNEXPECTED_ERROR ' + e.name);process.exit(6)});
          NODE
