name: Temporary Quavo official visual proof
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-official-visual-proof.yml
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official QRÖMELIFE visuals
        run: |
          mkdir -p /tmp/proof
          curl -fL --retry 3 -o /tmp/proof/architecture.jpg https://www.quavohuncho.net/wp-content/uploads/sites/2353/2026/09/architecture-compressed.jpg
          curl -fL --retry 3 -o /tmp/proof/editorial.jpg https://www.quavohuncho.net/wp-content/uploads/sites/2353/2026/09/editorial-compressed.jpg
          curl -fL --retry 3 -o /tmp/proof/portrait.jpg https://www.quavohuncho.net/wp-content/uploads/sites/2353/2026/09/music-portrait-compressed.jpg
          file /tmp/proof/*
          wc -c /tmp/proof/*
      - uses: actions/upload-artifact@v4
        with:
          name: quavo-official-qromelife-visuals
          path: /tmp/proof/*
          if-no-files-found: error
          retention-days: 1
