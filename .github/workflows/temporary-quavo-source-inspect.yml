name: Temporary Quavo source inspect
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-source-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch official QRÖMELIFE site visuals
        run: |
          python - <<'PY'
          import urllib.request
          from PIL import Image
          urls={
            "editorial":"https://www.quavohuncho.net/wp-content/uploads/sites/2353/2026/09/editorial-compressed.jpg",
            "architecture":"https://www.quavohuncho.net/wp-content/uploads/sites/2353/2026/09/architecture-compressed.jpg",
            "music-portrait":"https://www.quavohuncho.net/wp-content/uploads/sites/2353/2026/09/music-portrait-compressed.jpg",
          }
          for n,u in urls.items():
              q=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(q,timeout=60) as r:b=r.read()
              p=f"/tmp/{n}.jpg";open(p,"wb").write(b)
              im=Image.open(p)
              print("QUAVO_OFFICIAL",n,im.size,len(b),im.format)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quavo-qromelife-official-visuals
          path: /tmp/*.jpg
          if-no-files-found: error
