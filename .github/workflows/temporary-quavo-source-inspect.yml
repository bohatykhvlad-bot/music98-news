name: Temporary Quavo source inspect
on:
  push:
    paths:
      - .github/workflows/temporary-quavo-source-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch QRÖMELIFE glasses portrait
        run: |
          python - <<'PY'
          import urllib.request
          from PIL import Image
          u="https://image-cdn.hypb.st/https%3A%2F%2Fhypebeast.com%2Fimage%2F2026%2F09%2F22%2F87A6893-scaled.jpg?cbr=1&fit=max&format=jpg&q=98&w=3500"
          q=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(q,timeout=45) as r:
              b=r.read()
          open("/tmp/quavo-qromelife.jpg","wb").write(b)
          im=Image.open("/tmp/quavo-qromelife.jpg")
          print("QUAVO_SOURCE",im.size,len(b),im.format)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quavo-qromelife-glasses
          path: /tmp/quavo-qromelife.jpg
          if-no-files-found: error
