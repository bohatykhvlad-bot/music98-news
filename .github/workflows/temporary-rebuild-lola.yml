name: Temporary rebuild Lola draft
on:
  push:
    paths:
      - .github/workflows/temporary-rebuild-lola.yml
      - .github/candidates/lola-final.json
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure editor key
        run: printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
      - name: Pre-edit full read stamp on exact current Lola draft
        run: python scripts/post.py editorial lola27everythingbegins --phase pre-edit
      - name: Extract reviewed Lola body without touching media fields
        shell: python
        run: |
          import json
          from pathlib import Path
          post=json.loads(Path(".github/candidates/lola-final.json").read_text(encoding="utf-8"))
          Path("/tmp/lola-body.txt").write_text(post["body"],encoding="utf-8")
      - name: Final complete read stamp on exact candidate body
        run: python scripts/post.py editorial lola27everythingbegins --body-file /tmp/lola-body.txt --phase post-edit
      - name: Update text only through guarded writer
        run: python scripts/post.py set lola27everythingbegins --body-file /tmp/lola-body.txt
      - name: Re-run saved draft gates
        run: |
          python scripts/post.py gate lola27everythingbegins
          python scripts/post.py preflight lola27everythingbegins
          python scripts/post.py show lola27everythingbegins
