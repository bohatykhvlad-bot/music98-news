name: Temporary Shakira draft loader
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-shakira-draft.yml]
permissions:
  contents: write
jobs:
  update-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      POST_ID: shakira26amazonmadrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update only the existing Shakira draft
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const body="Shakira's October 3 Madrid concert became Amazon Music's most-viewed livestream by a female artist, with Dua Lipa joining her for a surprise \"Antología\" duet. Amazon Music announced the record on October 4 and did not release a viewer total. The concert was broadcast worldwide through Amazon Music, Prime Video and Twitch, marking Shakira's first full-concert global livestream.\n\nAmazon Music describes the result as the largest livestream audience for a female artist on its own platform. The Madrid broadcast also served as the centerpiece of its 2026 Women Shaping Latin Music campaign, turning one night of Shakira's residency into an event available far beyond the stadium.\n\nThe concert took place at the temporary Shakira Stadium inside Madrid's Iberdrola Music complex, where more than 50,000 people watched in person. Dua Lipa appeared during the show for an acoustic performance of \"Antología,\" the ballad Shakira released on *Pies Descalzos* in 1995. Dua had already sung the song during her own Bogotá concert in 2025, but Madrid was the first time the two artists had performed together. Both later shared footage and photos from the duet, with Shakira calling the night a dream come true for many of them. The choice gave Dua's 2025 Bogotá cover a second life in Madrid, this time with Shakira beside her.\n\n[ig:p:DeFRhLolil0|@shakira|https://www.instagram.com/p/DeFRhLolil0/]\n\nThe duet arrived in the middle of a Madrid residency that has kept expanding. Shakira opened the run on September 18 after a residency initially announced as three nights had grown to 12. On October 5, Shakira and Live Nation added a 13th and final Madrid concert for October 12, citing demand. That gives the residency another closing night after the previously announced October 9, 10 and 11 shows.\n\nMadrid is not a conventional tour stop. Shakira's team built a temporary stadium and the surrounding Macondo Park for the residency, creating a larger site for concerts, exhibitions and other programming around Latin music and culture. The October 3 broadcast opened that setup to an audience far beyond the people who could enter the grounds.\n\nAmazon has not published a viewer figure, so the raw audience cannot be compared directly with other major concert streams. Its claim is limited to female artists on Amazon Music, where Shakira now holds the platform's livestream audience record. The broadcast's standout collaboration reached back to \"Antología,\" a song first released in 1995, with Dua Lipa beside Shakira for the first time. Shakira will return to the same Madrid site through October 12, the final date of the expanded residency.", excerpt="Shakira's October 3 Madrid concert became Amazon Music's most-viewed livestream by a female artist, with Dua Lipa joining her for a surprise \"Antología\" duet.";
          const key=process.env.ADMIN_PASSWORD, id=process.env.POST_ID;
          if(!key) throw Error("NO_ADMIN_PASSWORD");
          const headers={"X-Admin-Key":key,"Accept":"application/json","Content-Type":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const g=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
            const data=await g.json(), matches=(data.posts||[]).filter(p=>p.id===id);
            if(matches.length!==1||matches[0].status!=="draft") throw Error("TARGET_NOT_UNIQUE_DRAFT");
            const others=JSON.stringify(data.posts.filter(p=>p.id!==id));
            matches[0].body=body; matches[0].excerpt=excerpt;
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers,body:JSON.stringify({posts:data.posts,touched:[id]})});
            if(!s.ok) throw Error("SAVE_"+s.status);
            const v=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"}), after=await v.json();
            const got=(after.posts||[]).find(p=>p.id===id);
            if(!got||got.status!=="draft"||got.body!==body||got.excerpt!==excerpt) throw Error("VERIFY_FAILED");
            if(JSON.stringify(after.posts.filter(p=>p.id!==id))!==others) throw Error("OTHER_POST_CHANGED");
            console.log("DRAFT_UPDATE_VERIFIED");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Final Shakira gate and preflight
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          python scripts/post.py gate "$POST_ID" | tee /tmp/gate.txt
          MUSIC98_KEY="$ADMIN_PASSWORD" python scripts/preflight.py --post "$POST_ID" --expected-media 1 --min-words 300 | tee /tmp/preflight.txt
          { echo "POST=$POST_ID"; cat /tmp/gate.txt; cat /tmp/preflight.txt; } > .github/shakira-draft-report.txt
          git config user.name "music98-bot"
          git config user.email "music98-bot@users.noreply.github.com"
          git add .github/shakira-draft-report.txt
          git commit -m "Record final Shakira draft validation"
          git push
