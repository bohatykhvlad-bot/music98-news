name: Temporary Shakira draft loader
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-shakira-draft.yml]
permissions:
  contents: write
jobs:
  update-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      POST_ID: shakira26amazonmadrid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update only the existing Shakira draft
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ADMIN_PASSWORD"
          node <<'NODE'
          const body="Shakira's October 3 Madrid concert became Amazon Music's most-viewed livestream by a female artist, with Dua Lipa joining her for a surprise \"Antología\" duet. Amazon Music announced the record on October 4 and did not release a viewer total.\n\nThe show was broadcast worldwide through Amazon Music, Prime Video and Twitch, marking Shakira's first full-concert global livestream. The milestone is a specific one rather than an overall streaming record. Amazon Music says no female artist has drawn a larger livestream audience on its platform, and the Madrid broadcast served as the centerpiece of its 2026 Women Shaping Latin Music campaign.\n\nThe concert took place at the temporary Shakira Stadium inside Madrid's Iberdrola Music complex, where more than 50,000 people watched in person. Dua Lipa appeared during the show for an acoustic performance of \"Antología,\" the ballad Shakira released on *Pies Descalzos* in 1995. Dua had already sung the song during her own Bogotá concert in 2025, but Madrid was the first time the two artists had performed together. Both later shared footage and photos from the duet, with Shakira calling the night a dream come true for many of them. The choice gave Dua's 2025 Bogotá cover a second life in Madrid, this time with Shakira beside her.\n\n[ig:p:DeFRhLolil0|@shakira|https://www.instagram.com/p/DeFRhLolil0/]\n\nThe duet arrived in the middle of a Madrid residency that has kept expanding. Shakira opened the run on September 18 after a residency initially announced as three nights had grown to 12. On October 5, Shakira and Live Nation added a 13th and final Madrid concert for October 12, citing demand. That gives the residency another closing night after the previously announced October 9, 10 and 11 shows.\n\nMadrid is not a conventional tour stop. Shakira's team built a temporary stadium and the surrounding Macondo Park for the residency, creating a larger site for concerts, exhibitions and other programming around Latin music and culture. The October 3 broadcast effectively opened that setup to an audience far beyond the people who could enter the grounds.\n\nAmazon's announcement should not be mistaken for an all-platform streaming record, and without a viewer figure there is no useful way to compare its raw audience with other major concert streams. The claim is narrower and clear. Among female artists who have livestreamed on Amazon Music, none has drawn a larger audience. That new benchmark came from a show whose biggest surprise was not a new song or elaborate production turn, but Shakira revisiting a 1995 ballad with Dua Lipa beside her for the first time.";
          const excerpt="Shakira's October 3 Madrid concert became Amazon Music's most-viewed livestream by a female artist, with Dua Lipa joining her for a surprise \"Antología\" duet.";
          const key=process.env.ADMIN_PASSWORD;
          const id=process.env.POST_ID;
          const headers={"X-Admin-Key":key,"Accept":"application/json","Content-Type":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const g=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
            if(!g.ok) throw Error("GET_DESK_"+g.status);
            const data=await g.json();
            const matches=(data.posts||[]).filter(p=>p.id===id);
            if(matches.length!==1) throw Error("TARGET_COUNT_"+matches.length);
            const post=matches[0];
            if(post.status!=="draft") throw Error("TARGET_NOT_DRAFT");
            const othersBefore=JSON.stringify(data.posts.filter(p=>p.id!==id));
            post.body=body;
            post.excerpt=excerpt;
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers,body:JSON.stringify({posts:data.posts,touched:[id]})});
            if(!s.ok) throw Error("SAVE_"+s.status);
            const v=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
            const after=await v.json();
            const got=(after.posts||[]).find(p=>p.id===id);
            if(!got || got.status!=="draft" || got.body!==body || got.excerpt!==excerpt) throw Error("DRAFT_VERIFY");
            if(JSON.stringify(after.posts.filter(p=>p.id!==id))!==othersBefore) throw Error("OTHER_POST_CHANGED");
            console.log("SHAKIRA_DRAFT_UPDATED",id,"STATUS",got.status,"OTHER_POSTS_UNCHANGED",true);
          })().catch(e=>{console.error(String(e.message||e));process.exit(1)});
          NODE
      - name: Run gate and preflight and record report
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          set +e
          python scripts/post.py gate "$POST_ID" > /tmp/gate.txt 2>&1
          gate_code=$?
          MUSIC98_KEY="$ADMIN_PASSWORD" python scripts/preflight.py --post "$POST_ID" --expected-media 1 --min-words 300 > /tmp/preflight.txt 2>&1
          preflight_code=$?
          set -e
          cat /tmp/gate.txt
          cat /tmp/preflight.txt
          {
            echo "POST=$POST_ID"
            echo "GATE_CODE=$gate_code"
            cat /tmp/gate.txt
            echo "PREFLIGHT_CODE=$preflight_code"
            cat /tmp/preflight.txt
          } > .github/shakira-draft-report.txt
          git config user.name "music98-bot"
          git config user.email "music98-bot@users.noreply.github.com"
          git add .github/shakira-draft-report.txt
          git commit -m "Refresh Shakira draft validation report"
          git push
          test "$gate_code" -eq 0
          test "$preflight_code" -eq 0
