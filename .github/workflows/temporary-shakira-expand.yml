name: Expand Shakira post safely
on:
  push:
    branches: [main]
    paths:
      - .github/shakira-expanded-stage.json
      - .github/workflows/temporary-shakira-expand.yml
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      MUSIC98_KEY: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mandatory editorial readthrough
        run: python scripts/editorial_readthrough.py --post shakira26amazonmadrid --file .github/shakira-expanded-stage.json --confirm-full-read
      - name: Gate staged body
        shell: python
        run: |
          import importlib.util,json,sys
          spec=importlib.util.spec_from_file_location("gate","scripts/gate.py")
          g=importlib.util.module_from_spec(spec);spec.loader.exec_module(g);g.CHECK_IDS=False
          p=json.load(open(".github/shakira-expanded-stage.json",encoding="utf-8"))
          fails,warns,info=g.check_post(p,strict=True)
          for k,v in warns: print("WARN",k,v)
          for k,v in fails: print("FAIL",k,v)
          print("GATE","PASS" if not fails else "FAIL")
          if fails: sys.exit(1)
      - name: Preflight staged body
        run: python scripts/preflight.py --post shakira26amazonmadrid --file .github/shakira-expanded-stage.json --expected-media 1 --min-words 430
      - name: Apply only body and excerpt
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const staged=JSON.parse(fs.readFileSync(".github/shakira-expanded-stage.json","utf8"));
          const h={"X-Admin-Key":process.env.ADMIN_PASSWORD,"Content-Type":"application/json","Accept":"application/json","Cache-Control":"no-cache"};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(n){
            const r=await fetch("https://music98.news/api/desk?expand="+Date.now()+"_"+n,{headers:h,cache:"no-store"});
            if(!r.ok) throw Error("GET_"+r.status);
            return r.json();
          }
          (async()=>{
            const d=await get(0);
            const p=d.posts.find(x=>x.id===staged.id);
            if(!p||p.status!=="live") throw Error("TARGET_NOT_LIVE");
            const others=JSON.stringify(d.posts.filter(x=>x.id!==staged.id));
            const meta=JSON.stringify(Object.fromEntries(Object.entries(p).filter(([k])=>!["body","excerpt"].includes(k))));
            p.body=staged.body;
            p.excerpt=staged.excerpt;
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers:h,body:JSON.stringify({posts:d.posts,touched:[staged.id]})});
            if(!s.ok) throw Error("SAVE_"+s.status);
            for(let i=1;i<=20;i++){
              await sleep(2000);
              const a=await get(i);
              const q=a.posts.find(x=>x.id===staged.id);
              if(!q||q.body!==staged.body||q.excerpt!==staged.excerpt) continue;
              if(JSON.stringify(a.posts.filter(x=>x.id!==staged.id))!==others) throw Error("OTHER_POST_CHANGED");
              const meta2=JSON.stringify(Object.fromEntries(Object.entries(q).filter(([k])=>!["body","excerpt"].includes(k))));
              if(meta2!==meta) throw Error("TARGET_METADATA_CHANGED");
              console.log("SHAKIRA_EXPANDED_BODY_VERIFIED");
              return;
            }
            throw Error("KV_VERIFY_TIMEOUT");
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Verify live
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          python scripts/editorial_readthrough.py --post shakira26amazonmadrid --confirm-full-read
          python scripts/post.py gate shakira26amazonmadrid
          python scripts/post.py verify shakira26amazonmadrid
