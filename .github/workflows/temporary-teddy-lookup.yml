name: Temporary Teddy and live text audit
on:
  push:
    paths:
      - .github/workflows/temporary-teddy-lookup.yml
jobs:
  lookup:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Audit desk
        shell: python
        run: |
          import json,os,re,urllib.request
          req=urllib.request.Request("https://music98.news/api/desk",headers={"X-Admin-Key":os.environ["ADMIN_PASSWORD"],"User-Agent":"Mozilla/5.0","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=30) as r: d=json.loads(r.read().decode())
          ids={"quavo26qromelife","lola26ebtour"}
          ent=re.compile(r"&(?:#\d+|#x[0-9A-Fa-f]+|[A-Za-z][A-Za-z0-9]+);")
          for p in d.get("posts",[]):
              if str(p.get("id")) in ids:
                  print("AUDIT",p.get("id"))
                  for k in ("title","excerpt","body"):
                      s=str(p.get(k) or "")
                      print(k,"entities=",ent.findall(s),"literal=",re.findall(r"\\[nrt]",s),"nbsp=",s.count("\u00a0"),"zwsp=",s.count("\u200b"),"tail=",repr(s[-90:]))
              if "Teddy Swims" in json.dumps(p,ensure_ascii=False):
                  keep={k:p.get(k) for k in ("id","type","rtype","tag","artist","title","excerpt","status","date")}
                  print("TEDDY",json.dumps(keep,ensure_ascii=False))
