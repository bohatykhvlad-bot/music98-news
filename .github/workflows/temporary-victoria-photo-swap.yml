name: Temporary Victoria photo swap
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-victoria-photo-swap.yml]
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      POST_ID: auvictoriafol26r1
      NEW_WEB: photos/victoria-monet-marvin-portrait-2026.jpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for clean MAR+VIN portrait deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -L -s -o /tmp/victoria.jpg -w "%{http_code}" "https://music98.news/$NEW_WEB?coverprobe=$i" || true)
            if [ "$code" = "200" ]; then
              echo "PORTRAIT_DEPLOYED"
              exit 0
            fi
            sleep 6
          done
          exit 1
      - name: Replace only Victoria draft cover
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const key=process.env.ADMIN_PASSWORD, id=process.env.POST_ID;
          if(!key) throw Error("NO_ADMIN_PASSWORD");
          const headers={"X-Admin-Key":key,"Accept":"application/json","Content-Type":"application/json","Cache-Control":"no-cache"};
          (async()=>{
            const g=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
            if(!g.ok) throw Error("GET_"+g.status);
            const data=await g.json();
            const matches=(data.posts||[]).filter(p=>p.id===id);
            if(matches.length!==1 || matches[0].status!=="draft") throw Error("TARGET_NOT_UNIQUE_DRAFT");
            const post=matches[0];
            const bodyBefore=post.body, titleBefore=post.title, excerptBefore=post.excerpt;
            const othersBefore=JSON.stringify(data.posts.filter(p=>p.id!==id));
            post.cover={
              kind:"img",
              src:process.env.NEW_WEB,
              credit:"MAR+VIN",
              creditUrl:"https://www.mar-vin.com/",
              pos:"50% 50%",
              zoom:1,
              cardY:0.5,
              cardZoom:1,
              lockX:0.5
            };
            const s=await fetch("https://music98.news/api/desk",{method:"POST",headers,body:JSON.stringify({posts:data.posts,touched:[id]})});
            if(!s.ok) throw Error("SAVE_"+s.status);
            const v=await fetch("https://music98.news/api/desk",{headers,cache:"no-store"});
            const after=await v.json(), got=(after.posts||[]).find(p=>p.id===id);
            if(!got || got.status!=="draft") throw Error("DRAFT_VERIFY");
            if(got.body!==bodyBefore || got.title!==titleBefore || got.excerpt!==excerptBefore) throw Error("TEXT_CHANGED");
            if(!got.cover || got.cover.src!==process.env.NEW_WEB || got.cover.credit!=="MAR+VIN") throw Error("COVER_VERIFY");
            if(JSON.stringify(after.posts.filter(p=>p.id!==id))!==othersBefore) throw Error("OTHER_POST_CHANGED");
            console.log("VICTORIA_COVER_SWAP_VERIFIED",got.cover);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Rerun editorial gate and preflight after cover change
        shell: bash
        run: |
          set -euo pipefail
          printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" > .env
          python scripts/post.py gate "$POST_ID"
          MUSIC98_KEY="$ADMIN_PASSWORD" python scripts/preflight.py --post "$POST_ID" --expected-media 1 --min-words 450
      - name: Remove superseded album artwork and QA preview
        shell: bash
        run: |
          set -euo pipefail
          rm -f public/photos/victoria-monet-frequency-of-love-marvin-2026.jpg
          rm -f .github/victoria-photo-preview.b64
          git config user.name "music98-bot"
          git config user.email "music98-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "NO_CLEANUP_CHANGES"
          else
            git commit -m "Use clean MAR+VIN portrait for Victoria Monet draft"
            git push
          fi
