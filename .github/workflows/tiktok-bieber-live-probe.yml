name: TikTok Bieber live probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/tiktok-bieber-live-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Inspect live Bieber TikTok marker and TikTok endpoints
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error
          headers={"X-Admin-Key":os.environ["ADMIN_PASSWORD"],"User-Agent":"music98-tiktok-probe","Cache-Control":"no-cache","Accept":"application/json"}
          req=urllib.request.Request("https://music98.news/api/desk",headers=headers)
          with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
          posts=data.get("posts") or []
          matches=[]
          for p in posts:
              hay=(" ".join([str(p.get("title") or ""),str(p.get("artist") or ""),str(p.get("body") or "")])).lower()
              if "speed demon" in hay or "justin bieber" in hay:
                  toks=re.findall(r"\[tiktok:([^\]]+)\]",str(p.get("body") or ""),re.I)
                  if toks: matches.append((p.get("id"),p.get("title"),p.get("status"),toks))
          print("MATCHES="+json.dumps(matches,ensure_ascii=False))
          if not matches: raise SystemExit("NO_BIEBER_TIKTOK_POST")
          raw=matches[0][3][0]
          video_id=raw.split("|",1)[0].split(":",1)[0]
          print("VIDEO_ID="+video_id)
          urls=[
            "https://www.tiktok.com/player/v1/"+video_id+"?rel=0&description=0&music_info=0",
            "https://www.tiktok.com/embed/v2/"+video_id+"?lang=en",
            "https://www.tiktok.com/oembed?url=https://www.tiktok.com/video/"+video_id,
          ]
          for url in urls:
              try:
                  q=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html,application/json;q=0.9,*/*;q=0.8"})
                  with urllib.request.urlopen(q,timeout=25) as r:
                      b=r.read(200000).decode("utf-8","replace")
                      print("PROBE",url.split("?")[0],"STATUS",r.status,"FINAL",r.geturl(),"LEN",len(b),"OVERLOAD",("overload-protect triggered" in b.lower()),"INVALID",("invalid_video" in b.lower()))
              except urllib.error.HTTPError as e:
                  b=e.read(50000).decode("utf-8","replace")
                  print("PROBE",url.split("?")[0],"HTTP",e.code,"LEN",len(b),"OVERLOAD",("overload-protect triggered" in b.lower()))
              except Exception as e:
                  print("PROBE",url.split("?")[0],"ERROR",type(e).__name__,str(e)[:180])
