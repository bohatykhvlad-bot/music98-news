name: validate-spotify-mirror-parser
on:
  push:
    paths:
      - ".github/workflows/validate-spotify-mirror-parser.yml"
      - "scripts/validate-spotify-mirror.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compare full public Spotify mirror against Kworb
        run: node scripts/validate-spotify-mirror.mjs
