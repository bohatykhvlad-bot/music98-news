<html lang="en">
<head>

<title>Contacts — music98.news</title>
<meta name="description" content="Contact music98.news: editorial, advertising, corrections and privacy requests.">
<link rel="icon" href="/logo.png">
<style>
  :root{--bg:#f6f8f8;--card:#ffffff;--text:#15181a;--muted:#5c6a70;--muted2:#9aa6ab;--line:#e3e8ea;--accent:#00fdfb;--acc2:#0a8f8c}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{padding-top:70px}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .page{max-width:1080px;margin:0 auto;padding:48px 24px 64px}
              .aback{display:flex;width:max-content;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-weight:700;font-size:14px;margin:0 0 18px}
  .aback::before{content:"";width:7px;height:7px;flex:none;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-1px}
  .aback:hover{text-decoration:underline}
  .kicker{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);margin:0 0 10px}
  h1{margin:0 0 14px;font-size:clamp(30px,6vw,40px);letter-spacing:-.02em;line-height:1.1}
  .lead{font-size:17.5px;line-height:1.65;color:var(--muted);margin:0 0 28px}
  .row{display:flex;flex-direction:column;gap:12px;margin:26px 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .card h2{margin:0 0 6px;font-size:15.5px;letter-spacing:0;text-transform:none;color:var(--text)}
  .card p{margin:0;font-size:14.5px;line-height:1.65;color:var(--muted)}
  .card a.mail{color:var(--text);text-decoration:none;font-weight:600;border-bottom:1.5px solid var(--text)}
  .card a.mail:hover{color:var(--acc2);border-color:var(--acc2)}
  .socials{display:flex;gap:10px;margin:26px 0}
  .socials a{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acc2);text-decoration:none}
  .socials svg{width:18px;height:18px}
      </style>
<style>
  /* footer styles copied from the main site so legal pages match it exactly */
  footer{border-top:1px solid var(--line);background:var(--bg2);margin-top:56px}
  .foot-in{max-width:1180px;margin:0 auto;padding:40px 24px 44px;display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:34px}
  .foot-col h3{margin:0 0 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2)}
  .foot-col p{margin:0;color:var(--muted);font-size:13.5px;max-width:340px}
  .flink{display:block;color:var(--muted);text-decoration:none;font-size:14px;padding:5px 0;transition:.15s}
  .flink:hover{color:var(--text)}
  .social .icons{display:flex;gap:10px;flex-wrap:wrap}
  .social a{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none}
  .social svg{width:18px;height:18px}
  @media(max-width:900px){.foot-in{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.foot-in{grid-template-columns:1fr;padding:32px 20px 36px}}

</head>

    </div>
    <div class="card">

    </div>
  </div>
