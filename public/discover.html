.loadmore-btn{position:relative;isolation:isolate;border:0;background:transparent;border-radius:999px;padding:11px 22px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transform:none;-webkit-font-smoothing:antialiased;transition:color .18s ease;-webkit-tap-highlight-color:transparent;white-space:nowrap}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
(()=>{"use strict";
const DATA_URL="/data/discover-albums.json",APPLE_AFFILIATE_TOKEN="1001l3aZW",CAMPAIGN="music98_discover";
const $=id=>document.getElementById(id);let artists=[],lastIds=[];
function secureInt(n){return Number.isSafeInteger(n)&&n>0&&n<1e12}
function verifyEntry(a){return a&&typeof a.name==="string"&&a.name.length>0&&Array.isArray(a.albums)&&a.albums.some(x=>secureInt(x.id)&&typeof x.title==="string")}
function usable(d){return (Array.isArray(d?.artists)?d.artists:[]).filter(verifyEntry)}
async function load(){const fallback=()=>usable(JSON.parse($("embeddedCatalog").textContent));artists=fallback();try{if(location.protocol==="file:")return;const r=await fetch(DATA_URL,{cache:"default"});if(!r.ok)throw Error("Catalog unavailable");const fresh=usable(await r.json());if(fresh.length)artists=fresh}catch(e){console.warn("Album catalog: using last known seed",e)}if(!artists.length){$("surprise").disabled=true;$("status").textContent="The album catalog is temporarily unavailable."}}
function rand(max){if(max<=1)return 0;const a=new Uint32Array(1);const limit=Math.floor(4294967296/max)*max;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=limit);return x%max}
function pick(){const valid=artists.filter(a=>a.albums.some(x=>secureInt(x.id)));if(!valid.length)return null;const fresh=valid.filter(a=>a.albums.some(x=>!lastIds.includes(x.id)));const pool=fresh.length?fresh:valid;const a=pool[rand(pool.length)];const eligible=a.albums.filter(x=>secureInt(x.id)&&(!fresh.length||!lastIds.includes(x.id)));const album=eligible[rand(eligible.length)]||a.albums[0];lastIds.push(album.id);if(lastIds.length>18)lastIds.shift();return {...album,artist:a.name}}
function embedUrl(id){const u=new URL("/apple-embed/us/album/"+id,location.origin);u.searchParams.set("at",APPLE_AFFILIATE_TOKEN);u.searchParams.set("ct",CAMPAIGN);return u.toString()}
function display(album){$("artistName").textContent=album.artist;$("albumTitle").textContent=album.title;$("albumYear").textContent=album.year||"";$("albumGenre").textContent=album.genre||"";$("mystery").hidden=true;const frame=$("applePlayer");frame.hidden=false;frame.src=embedUrl(album.id);document.body.classList.add("picked");$("buttonLabel").textContent="Find another album";$("status").textContent=album.title+" by "+album.artist+" selected."}
$("surprise").addEventListener("click",()=>{const next=pick();if(next)display(next)});load();
})();
