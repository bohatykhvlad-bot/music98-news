<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>music98.news</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="icon" href="logo.png" type="image/png">
<style>
:root{
  --bg:#ffffff; --bg2:#f4f6f7; --card:#fff; --line:#e2e8ea;
  --text:#15181a; --muted:#5c6a70; --accent:#00fdfb; --acc2:#15181a;
  --font:"Pretendard",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 56px}
.brand{display:flex;align-items:center;gap:10px;height:40px;text-decoration:none;color:inherit;user-select:none}
.brand-logo{width:40px;height:40px;border-radius:50%;object-fit:cover;border:0;background:transparent}
.brand-name{font-size:20px;line-height:1;font-weight:700;letter-spacing:-.015em;color:var(--text);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;min-height:40px}
.top > a:last-child{font-size:13px}
h1{margin:0 0 4px;font-size:22px;line-height:1.1;letter-spacing:-.03em;color:var(--text)}
h2{margin:0 0 8px;font-size:15px;color:var(--text)}
.head{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);color:var(--text);min-height:36px}
#title{min-height:40px;font-size:16px;font-weight:700;letter-spacing:-.02em}
#excerpt{min-height:72px;font-size:14px;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:#03282b}
.btn.ghost{background:var(--bg2);border:1px solid var(--line)}
.btn.danger{background:#fff0f0;color:#b42318}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:40px 1fr auto auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px}
.item img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:var(--bg2)}
.item .ph{width:40px;height:40px;border-radius:6px;background:var(--bg2)}
.st{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.st.live{background:#e8fff6;color:#0d6b45}
.st.draft{background:#f4f6f7;color:#5c6a70}
.st.sched{background:#fff6e0;color:#8a5a00}
.muted{color:var(--muted);font-size:12px}
.toast{position:fixed;right:16px;bottom:16px;background:#fff;border:1px solid var(--accent);border-radius:10px;padding:8px 12px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:40;font-size:13px}
.login{max-width:340px;margin:12vh auto;padding:18px}
.hide{display:none}
a{color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 8px}
.toolbar .ico{
  width:32px;height:32px;padding:0;border:1px solid var(--line);background:#fff;border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);
  font-size:14px;line-height:1;
}
.toolbar .ico:hover{border-color:#b7c4c8;background:#fafbfc}
.toolbar .ico b{font-family:Georgia,"Times New Roman",serif;font-size:14px}
.toolbar .ico i{font-family:Georgia,"Times New Roman",serif;font-size:14px;font-weight:700}
.toolbar .ico.wide{width:auto;padding:0 9px;gap:5px;font-size:12px;font-weight:650}
.toolbar .ico.quote{width:38px;gap:0}
.toolbar .ico.quote .qmark{
  font-family:Georgia,"Times New Roman",serif;
  font-size:22px;
  font-weight:700;
  font-style:normal;
  line-height:1;
  display:block;
  width:11px;
  text-align:center;
  transform:translateY(-1px);
}
.toolbar .tsep{width:1px;height:18px;background:var(--line);margin:0 4px}
.stage-wrap{border:1px dashed var(--line);border-radius:12px;background:#111;overflow:hidden}
.crop-row{display:grid;grid-template-columns:1fr 200px;gap:10px;align-items:start}
.stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;cursor:default;background:#111;touch-action:none}
.stage.hot{outline:2px solid var(--acc2);outline-offset:-2px}
.stage:active,.stage.drag{cursor:default}
.stage img{position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none;will-change:transform}
.stage .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;pointer-events:none;color:#fff;font-size:13px}
.stage .hint.hide{display:none}
.stage .grid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .12s;background-image:linear-gradient(to right,rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.5) 1px,transparent 1px);background-size:calc(100%/3) 100%, 100% calc(100%/3);z-index:2}
.stage:hover .grid,.stage.drag .grid{opacity:1}
.mini{display:flex;flex-direction:column;gap:8px}
.mini-frame{position:relative;aspect-ratio:1;overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#111}
.mini-frame img,.mini-hero-pic img{position:absolute;left:0;top:0;max-width:none;width:auto;height:auto;display:block}
.mini .muted{text-align:center;font-size:11px}
.mini-hero{display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;min-height:96px}
.mini-hero-text{padding:8px 8px 8px 9px;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.mini-kicker{font-size:8px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.mini-hero-title{font-size:10px;font-weight:700;line-height:1.2;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)}
.mini-hero-pic{position:relative;min-height:96px;background:#111;overflow:hidden}
.cropbar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.cropbar input[type=range]{flex:1;min-width:100px}
.cropbar .btn{padding:5px 10px;font-size:12px}
@media (max-width:900px){ .crop-row{grid-template-columns:1fr} }
.composer{min-height:380px;padding:12px 14px 28px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;line-height:1.55;outline:none}
.composer:empty:before{content:attr(data-placeholder);color:var(--muted)}
.composer p{margin:0 0 12px}
.composer em,.composer i{font-style:italic}
.composer b,.composer strong{font-weight:700}
.composer .blk{position:relative;margin:12px auto 16px;border-radius:10px}
.composer .blk .kill{position:absolute;right:6px;top:6px;z-index:2;width:24px;height:24px;border:0;border-radius:50%;background:#fff;color:#15181a;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.composer .aembed{max-width:520px;width:100%;margin:12px auto 16px}
.composer .aembed.song{max-width:420px}
.composer .aembed.song iframe{height:166px}
.composer .aembed.album iframe{height:320px}
.composer .yembed{max-width:520px;width:100%}
.composer .yembed .ytbox{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.composer .yembed iframe{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.composer iframe{width:100%;border:0;border-radius:10px;display:block;background:transparent}
.composer .abody-pic{max-width:320px;margin:12px auto}
.composer .abody-pic img{width:100%;max-height:220px;object-fit:contain;border-radius:10px;display:block;background:var(--bg2)}
.modal{position:fixed;inset:0;background:rgba(10,16,18,.45);align-items:center;justify-content:center;padding:16px;z-index:30}
.modal:not(.hide){display:flex}
.modal.hide{display:none}
.modal .card{max-width:560px;width:100%;margin:0}
.modal iframe{width:100%;border:0;border-radius:10px;display:block;margin-top:10px}
@media (max-width:900px){ .row,.item{grid-template-columns:1fr} .composer{min-height:280px;padding:12px;font-size:14px} }
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const KEY = "music98_admin_key";
const APPLE_AT = "1001l3aZW";
let posts = [];
let coverSrc = "";
let crop = {x:0.5, y:0.5, zoom:1, dirty:false, aspect:"16/9"};
let editing = null;
let appleKind = "song";
let pendingApple = null;
let drag = null;
let pointers = new Map();
let pinch = null;

function toast(m){
  const t = $("#toast"); t.textContent = m; t.classList.remove("hide");
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.classList.add("hide"), 2800);
}
function auth(){ return sessionStorage.getItem(KEY) || ""; }
function headers(json=true){
  const h = {"X-Admin-Key": auth()};
  if(json) h["Content-Type"] = "application/json";
  return h;
}
function today(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toLocalInput(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  const pad = n => String(n).padStart(2,"0");
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
}
function fromLocalInput(v){
  if(!v) return "";
  const raw = /T\d{2}:\d{2}$/.test(v) ? v+":00" : v;
  const d = new Date(raw);
  return isNaN(d.getTime()) ? "" : d.toISOString();
}
function fmtWhen(iso){
  const d = new Date(iso);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleString("en-GB", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}
function esc(s){ return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function rich(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>"); }
function originalCover(src){
  return String(src||"").replace(/-banner(\.[a-z0-9]+)(?:\?.*)?$/i, "$1");
}

function readPhoto(file, cb, max=1800){
  if(!file || file.type.indexOf("image/")!==0) return;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = ()=>{
    let w = img.width, h = img.height;
    if(Math.max(w,h)>max){ const s = max/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
    const c = document.createElement("canvas"); c.width=w; c.height=h;
    c.getContext("2d").drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    cb(c.toDataURL("image/jpeg", 0.86));
  };
  img.onerror = ()=> URL.revokeObjectURL(url);
  img.src = url;
}
function dropHasImage(dt){
  if(!dt) return false;
  const types = [...(dt.types||[])];
  if(types.includes("Files") || types.includes("text/uri-list") || types.includes("text/html")) return true;
  return [...(dt.items||[])].some(i => (i.type||"").indexOf("image/")===0);
}
function takeDroppedImage(e, cb, max=1800){
  const dt = e.dataTransfer;
  if(!dt) return false;
  const file = [...(dt.files||[])].find(f => (f.type||"").indexOf("image/")===0)
    || [...(dt.items||[])].map(i => i.kind==="file" ? i.getAsFile() : null).find(f => f && (f.type||"").indexOf("image/")===0);
  if(file){ e.preventDefault(); readPhoto(file, cb, max); return true; }
  const uri = (dt.getData("text/uri-list") || dt.getData("text/plain") || "").split("\n").map(s=>s.trim()).find(s=>s && !s.startsWith("#"));
  if(uri && /^https?:\/\//i.test(uri) && /\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(uri.split("?")[0])){
    e.preventDefault();
    fetch(uri, {mode:"cors"}).then(r=>{ if(!r.ok) throw 0; return r.blob(); }).then(blob=>{
      const type = blob.type || "image/jpeg";
      if(type.indexOf("image/")!==0 && type !== "application/octet-stream") throw 0;
      readPhoto(new File([blob], "photo.jpg", {type: type.indexOf("image/")===0 ? type : "image/jpeg"}), cb, max);
    }).catch(()=> toast("Save the photo first, then drop the file here."));
    return true;
  }
  const html = dt.getData("text/html") || "";
  const m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
  if(m && /^https?:\/\//i.test(m[1])){
    e.preventDefault();
    fetch(m[1], {mode:"cors"}).then(r=>{ if(!r.ok) throw 0; return r.blob(); }).then(blob=>{
      const type = blob.type || "image/jpeg";
      readPhoto(new File([blob], "photo.jpg", {type: type.indexOf("image/")===0 ? type : "image/jpeg"}), cb, max);
    }).catch(()=> toast("Save the photo first, then drop the file here."));
    return true;
  }
  return false;
}

async function api(path, opt={}){
  const ctrl = new AbortController();
  const t = setTimeout(()=> ctrl.abort(), 25000);
  try{
    const r = await fetch(path, Object.assign({}, opt, {signal: ctrl.signal}));
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw j;
    return j;
  }catch(e){
    if(e && e.name === "AbortError") throw {error:"timeout"};
    throw e;
  }finally{
    clearTimeout(t);
  }
}

function parseApple(raw){
  try{
    const u = new URL(raw.trim());
    const host = (u.hostname||"").toLowerCase();
    if(host!=="music.apple.com" && host!=="itunes.apple.com") return null;
    const album = u.pathname.match(/\/album\/(?:[^/]+\/)?(\d+)/);
    const song = u.pathname.match(/\/song\/(?:[^/]+\/)?(\d+)/);
    const track = u.searchParams.get("i");
    if(album && /^\d+$/.test(track||"")) return {kind:"song", album:album[1], track};
    if(album) return {kind:"album", album:album[1]};
    if(song) return {kind:"song-only", track:song[1]};
  }catch(e){}
  return null;
}

async function resolveApple(p){
  if(!p) return null;
  if(p.kind !== "song-only") return p;
  const r = await fetch("https://itunes.apple.com/lookup?id="+encodeURIComponent(p.track)+"&entity=song");
  const j = await r.json();
  const item = (j.results||[]).find(x=>x.wrapperType==="track") || (j.results||[])[0];
  if(!item || !item.collectionId) return null;
  return {kind:"song", album:String(item.collectionId), track:p.track};
}

function appleSrc(albumId, songId){
  const id = String(albumId||"").replace(/\D/g,"");
  const track = String(songId||"").replace(/\D/g,"");
  if(!id) return "";
  let src = "https://embed.music.apple.com/us/album/"+id+"?";
  if(track) src += "i="+track+"&";
  src += "at="+APPLE_AT+"&ct=music98";
  return src;
}

function appleBlock(kind, album, track){
  const src = appleSrc(album, track);
  const song = kind==="song" || track;
  const h = song ? 166 : 320;
  const token = song ? ("song:"+album+":"+track) : ("album:"+album);
  return `<figure class="blk aembed${song?" song":" album"}" contenteditable="false" data-apple="${esc(token)}"><button class="kill" type="button" aria-label="Remove">×</button><iframe height="${h}" src="${esc(src)}" title="Apple Music" loading="eager"></iframe></figure>`;
}
function photoBlock(src){
  return `<figure class="blk abody-pic" contenteditable="false" data-photo="${esc(src)}"><button class="kill" type="button" aria-label="Remove">×</button><img src="${esc(src)}" alt=""></figure>`;
}
function parseYouTube(raw){
  const s = String(raw||"").trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(s)) return {id:s, start:0};
  let u;
  try{ u = new URL(s); }catch(e){ return null; }
  const host = (u.hostname||"").replace(/^www\./,"").toLowerCase();
  if(!["youtube.com","m.youtube.com","music.youtube.com","youtu.be","youtube-nocookie.com"].includes(host)) return null;
  let id = "";
  if(host==="youtu.be") id = (u.pathname.split("/").filter(Boolean)[0]||"");
  else{
    id = u.searchParams.get("v") || "";
    const m = u.pathname.match(/\/(?:embed|shorts|live|v)\/([A-Za-z0-9_-]{11})/);
    if(m) id = m[1];
  }
  id = String(id).slice(0,11);
  if(!/^[A-Za-z0-9_-]{11}$/.test(id)) return null;
  let start = 0;
  const t = u.searchParams.get("t") || u.searchParams.get("start") || "";
  if(/^\d+$/.test(t)) start = +t;
  else{
    const mm = String(t).match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i);
    if(mm && t) start = (+mm[1]||0)*3600 + (+mm[2]||0)*60 + (+mm[3]||0);
  }
  return {id, start: start||0};
}
function youtubeSrc(id, start){
  let src = "https://www.youtube-nocookie.com/embed/"+id+"?rel=0&modestbranding=1&enablejsapi=1";
  if(start) src += "&start="+start;
  return src;
}
function youtubeBlock(id, start){
  const token = start ? (id+":"+start) : id;
  return `<figure class="blk yembed" contenteditable="false" data-youtube="${esc(token)}"><button class="kill" type="button" aria-label="Remove">×</button><div class="ytbox"><iframe src="${esc(youtubeSrc(id, start))}" title="YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="eager"></iframe></div></figure>`;
}

function insertHTML(html){
  const el = $("#composer");
  el.focus();
  const sel = window.getSelection();
  if(sel && sel.rangeCount && el.contains(sel.anchorNode)){
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const wrap = document.createElement("div");
    wrap.innerHTML = html + "<p><br></p>";
    const frag = document.createDocumentFragment();
    while(wrap.firstChild) frag.appendChild(wrap.firstChild);
    range.insertNode(frag);
  }else{
    el.insertAdjacentHTML("beforeend", html + "<p><br></p>");
  }
}

function inlineText(node){
  let s = "";
  node.childNodes.forEach(n=>{
    if(n.nodeType===3) s += n.textContent;
    else if(n.nodeName==="BR") s += "\n";
    else if(n.nodeName==="STRONG" || n.nodeName==="B") s += "**"+n.textContent+"**";
    else if(n.nodeName==="EM" || n.nodeName==="I") s += "*"+n.textContent+"*";
    else if(n.nodeName==="FIGURE") return;
    else s += inlineText(n);
  });
  return s;
}
function serialize(){
  const parts = [];
  const root = $("#composer");
  const dump = (node)=>{
    if(node.nodeType===3){
      const t = node.textContent.trim();
      if(t) parts.push(t);
      return;
    }
    if(node.nodeName==="FIGURE"){
      if(node.dataset.apple) parts.push("[apple:"+node.dataset.apple+"]");
      if(node.dataset.photo) parts.push("[photo:"+node.dataset.photo+"]");
      if(node.dataset.youtube) parts.push("[youtube:"+node.dataset.youtube+"]");
      return;
    }
    if(node.querySelector && node.querySelector("figure")){
      node.childNodes.forEach(dump);
      return;
    }
    const t = inlineText(node).trim();
    if(t) parts.push(t);
  };
  root.childNodes.forEach(dump);
  return parts.join("\n\n");
}
function bodyToComposer(text){
  const html = String(text||"").split(/\n{2,}/).filter(Boolean).map(raw=>{
    const t = raw.trim();
    const pic = t.match(/^\[photo:(.+?)\]$/i);
    if(pic) return photoBlock(pic[1]);
    const album = t.match(/^\[apple:album:(\d+)\]$/i);
    if(album) return appleBlock("album", album[1]);
    const song = t.match(/^\[apple:song:(\d+):(\d+)\]$/i);
    if(song) return appleBlock("song", song[1], song[2]);
    const yt = t.match(/^\[youtube:([A-Za-z0-9_-]{11})(?::(\d+))?\]$/i);
    if(yt) return youtubeBlock(yt[1], yt[2] ? +yt[2] : 0);
    return "<p>"+rich(raw)+"</p>";
  }).join("");
  $("#composer").innerHTML = html || "<p><br></p>";
}

function parsePos(p){
  const m = String(p||"").match(/([\d.]+)%\s+([\d.]+)%/);
  if(m) return {x: Math.min(1, Math.max(0, +m[1]/100)), y: Math.min(1, Math.max(0, +m[2]/100))};
  return {x:0.5, y:0.5};
}
function fitCover(img, fx, fy, zoom){
  const box = img && img.parentElement;
  if(!box || !img.naturalWidth) return;
  const x = Math.min(1, Math.max(0, Number(fx)));
  const y = Math.min(1, Math.max(0, Number(fy)));
  const z = Math.min(3, Math.max(1, Number(zoom)||1));
  const sw = box.clientWidth, sh = box.clientHeight;
  if(!sw || !sh) return;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const base = Math.max(sw/iw, sh/ih) * z;
  const dw = iw * base, dh = ih * base;
  let left = sw/2 - (Number.isFinite(x) ? x : 0.5) * dw;
  let top = sh/2 - (Number.isFinite(y) ? y : 0.5) * dh;
  left = Math.min(0, Math.max(sw - dw, left));
  top = Math.min(0, Math.max(sh - dh, top));
  img.style.width = dw+"px";
  img.style.height = dh+"px";
  img.style.transform = "translate("+left+"px,"+top+"px)";
}
function setZoom(z){
  crop.zoom = Math.min(3, Math.max(1, Number(z)||1));
  $("#zoom").value = crop.zoom;
  crop.dirty = true;
  layoutCrop();
}
function setAspect(a){
  crop.aspect = a === "1/1" ? "1/1" : "16/9";
  $("#stage").style.aspectRatio = crop.aspect === "1/1" ? "1 / 1" : "16 / 9";
  $("#asp169").classList.toggle("primary", crop.aspect === "16/9");
  $("#asp11").classList.toggle("primary", crop.aspect === "1/1");
  layoutCrop();
}
function paintMini(){
  const title = ($("#title") && $("#title").value.trim()) || "Main story";
  const tag = ($("#tag") && $("#tag").value.trim()) || ($("#type") && $("#type").value === "release" ? "Album" : "News");
  const ht = $("#miniHeroTitle");
  const hg = $("#miniHeroTag");
  if(ht) ht.textContent = title;
  if(hg) hg.textContent = tag;
  ["miniImg","miniHeroImg"].forEach(id=>{
    const m = $("#"+id);
    if(!m) return;
    if(!coverSrc){ m.classList.add("hide"); return; }
    if(m.getAttribute("src") !== coverSrc) m.src = coverSrc;
    m.classList.remove("hide");
    const go = ()=> fitCover(m, crop.x, crop.y, crop.zoom);
    if(m.naturalWidth) go();
    else m.onload = go;
  });
}
function layoutCrop(){
  const stage = $("#stage");
  const img = $("#stageImg");
  if(!coverSrc || !img.naturalWidth){ paintMini(); return; }
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const z = crop.zoom || 1;
  const base = Math.max(sw/iw, sh/ih) * z;
  const dw = iw * base, dh = ih * base;
  let left = sw/2 - crop.x * dw;
  let top = sh/2 - crop.y * dh;
  left = Math.min(0, Math.max(sw - dw, left));
  top = Math.min(0, Math.max(sh - dh, top));
  crop.x = dw ? (sw/2 - left) / dw : 0.5;
  crop.y = dh ? (sh/2 - top) / dh : 0.5;
  img.style.width = dw+"px";
  img.style.height = dh+"px";
  img.style.transform = "translate("+left+"px,"+top+"px)";
  paintMini();
}
function setCover(src, pos, zoom){
  coverSrc = src;
  const parsed = parsePos(pos);
  crop.x = parsed.x; crop.y = parsed.y; crop.zoom = Number(zoom)||1;
  $("#zoom").value = crop.zoom;
  const img = $("#stageImg");
  img.onload = ()=> layoutCrop();
  img.src = src;
  img.classList.remove("hide");
  $("#coverHint").classList.add("hide");
  paintMini();
}

stage.addEventListener("pointerdown", e=>{
  if(!coverSrc) return;
  e.preventDefault();
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  stage.classList.add("drag");
  if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), z: crop.zoom||1};
    drag = null;
  }else{
    pinch = null;
    drag = {x:e.clientX, y:e.clientY, cx:crop.x, cy:crop.y};
  }
});
stage.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinch.d) setZoom(pinch.z * (d / pinch.d));
    return;
  }
  if(!drag) return;
  const img = $("#stageImg");
  const dw = parseFloat(img.style.width)||1;
  const dh = parseFloat(img.style.height)||1;
  crop.x = drag.cx - (e.clientX - drag.x) / dw;
  crop.y = drag.cy - (e.clientY - drag.y) / dh;
  crop.dirty = true;
  layoutCrop();
});
function endPtr(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  if(!pointers.size){ drag = null; stage.classList.remove("drag"); }
}

  const title = $("#title").value.trim();
  if(!title){ toast("Add a title"); return null; }
  let publishAt = fromLocalInput($("#goLive").value.trim());
  if(status === "scheduled" && !publishAt){
    toast("Set a time under Go live at");
    return null;

  if(status !== "scheduled") publishAt = publishAt || undefined;
  return {
    id: editing || uid(),
    type: $("#type").value,
    tag: $("#tag").value.trim() || ($("#type").value==="release" ? "Release" : "News"),
    rtype: $("#rtype").value.trim(),
    artist: $("#artist").value.trim(),
    title,
    excerpt: $("#excerpt").value.trim(),
    body: serialize(),
    date: $("#date").value || today(),
    pinned: $("#pinned").checked,
    status,
    publishAt: publishAt || "",
    cover: coverSrc ? {
      kind:"img",
      src: originalCover(coverSrc),
      credit: $("#credit").value.trim(),
      creditUrl: $("#creditUrl").value.trim(),
      pos: Math.round(crop.x*100)+"% "+Math.round(crop.y*100)+"%",
      zoom: Math.round((crop.zoom||1)*100)/100
    } : {kind:"preset", i:0}
  };
}
async function writePost(status){

  if(!rec) return;
  if(!rec.publishAt) delete rec.publishAt;
  const ix = posts.findIndex(p=>p.id===rec.id);
  if(ix>=0) posts[ix] = rec; else posts.unshift(rec);
  try{
    await api("/api/desk", {method:"POST", headers: headers(), body: JSON.stringify({posts})});
    if(status==="live") toast("Published on the public site");
    else if(status==="scheduled") toast("Scheduled — it goes live at that time");
    else toast("Saved as draft — not on the public site");
    fillForm(rec);
    editing = rec.id;
    renderList();
  }catch(e){
    toast(e.error === "unauthorized" ? "Password rejected" : "Could not save");
  }
}
$("#save").onclick = ()=> writePost("live");
$("#schedule").onclick = ()=> writePost("scheduled");
$("#draft").onclick = ()=> writePost("draft");

$("#list").onclick = async e=>{
  const del = e.target.closest("[data-del]");
  const ed = e.target.closest("[data-edit]");
  if(ed){
    fillForm(posts.find(p=>p.id===ed.dataset.edit));
    window.scrollTo({top:0, behavior:"smooth"});
  }
  if(del){
    posts = posts.filter(p=>p.id!==del.dataset.del);
    try{
      await api("/api/desk", {method:"POST", headers: headers(), body: JSON.stringify({posts})});
      renderList();
      toast("Removed from the site");
    }catch(err){ toast("Could not delete"); }
  }
};

$("#send").onclick = async ()=>{
  try{
    const j = await api("/api/broadcast", {
      method:"POST", headers: headers(),
      body: JSON.stringify({subject: $("#msubject").value.trim(), text: $("#mtext").value.trim()})
    });
    toast("Sent to " + (j.sent||0) + " addresses");
  }catch(e){
    if(e.error==="missing_resend_key") toast("Addresses are saved. Add a Resend key to actually send.");
    else if(e.error==="no_subscribers") toast("Nobody has subscribed yet");
    else toast("Could not send");
  }
};

$("#date").value = today();
if(auth()){
  api("/api/desk?auth=1", {headers: headers(false)}).then(()=>{
    $("#gate").classList.add("hide");
    $("#desk").classList.remove("hide");
    setAspect("16/9");
    return reload();
  }).catch(()=> sessionStorage.removeItem(KEY));
}

function pauseDeskMedia(){
  document.querySelectorAll("audio, video").forEach(el=>{ try{ el.pause(); }catch(e){} });
  document.querySelectorAll("iframe").forEach(f=>{
    const src = f.dataset.keepSrc || f.getAttribute("src") || "";
    if(!/embed\.music\.apple\.com|youtube\.com|youtube-nocookie\.com|open\.spotify\.com/i.test(src)) return;
    if(src !== "about:blank") f.dataset.keepSrc = src;
    const keep = f.dataset.keepSrc;
    const n = document.createElement("iframe");
    for(const a of f.attributes){
      if(a.name === "src") continue;
      n.setAttribute(a.name, a.value);
    }
    n.dataset.keepSrc = keep;
    n.src = "about:blank";
    f.replaceWith(n);
  });
}
function restoreDeskMedia(){
  document.querySelectorAll("iframe").forEach(f=>{
    if(f.dataset.keepSrc) f.src = f.dataset.keepSrc;
  });
}
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) pauseDeskMedia();
  else restoreDeskMedia();
});
window.addEventListener("pagehide", pauseDeskMedia);
</script>
