name = "music98-news"
main = "worker.js"
compatibility_date = "2026-09-17"
keep_vars = true
workers_dev = true
compatibility_flags = ["global_fetch_strictly_public"]

[triggers]
crons = ["20 0 * * *", "20 1 * * *", "* * * * *"]

[vars]
FROM_EMAIL = "music98.news <onboarding@resend.dev>"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"

# Created automatically on Cloudflare Git deploy (no id needed).
[[kv_namespaces]]
binding = "DESK"

[[routes]]
pattern = "music98.news"
custom_domain = true

[[routes]]
pattern = "www.music98.news"
custom_domain = true
