name = "music98-news"
main = "worker.js"
compatibility_date = "2026-09-17"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/m98desk", "/m98desk.html"]
html_handling = "auto-trailing-slash"

# Created automatically on Cloudflare Git deploy (no id needed).
[[kv_namespaces]]
binding = "DESK"
